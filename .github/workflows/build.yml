name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Capacitor 6 & Sync Android Project
        run: |
          rm -rf android package.json package-lock.json
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android

      - name: Enforce App Name & Custom Knight Launcher Icon
        run: |
          cat <<'EOF' > android/app/src/main/res/values/strings.xml
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">Rookie</string>
              <string name="title_activity_main">Rookie</string>
              <string name="package_name">com.rookie.learnchess</string>
              <string name="custom_url_scheme">com.rookie.learnchess</string>
          </resources>
          EOF
          rm -rf android/app/src/main/res/mipmap-* \
                 android/app/src/main/res/drawable/ic_launcher_* \
                 android/app/src/main/res/drawable-*/ic_launcher_*
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi-v26
          cp app/src/main/res/drawable/ic_launcher_knight.xml android/app/src/main/res/drawable/
          cp app/src/main/res/drawable/ic_launcher_foreground.xml android/app/src/main/res/drawable/
          cp app/src/main/res/drawable/ic_launcher_background.xml android/app/src/main/res/drawable/
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml android/app/src/main/res/mipmap-anydpi-v26/
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "android/app/src/main/res/$dir"
            cp "app/src/main/res/$dir/ic_launcher.png" "android/app/src/main/res/$dir/"
            cp "app/src/main/res/$dir/ic_launcher_round.png" "android/app/src/main/res/$dir/"
          done

      - name: Increment Android Version Code & Version Name
        run: |
          RUN_NUM="${GITHUB_RUN_NUMBER:-1}"
          sed -i -E "s/versionCode [0-9]+/versionCode ${RUN_NUM}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.0.${RUN_NUM}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Versioned APK Artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/Rookie-Learn-Chess-v${GITHUB_RUN_NUMBER}.apk"

      - name: Upload File APK
        uses: actions/upload-artifact@v4
        with:
          name: Rookie-Learn-Chess-v${{ github.run_number }}.apk
          path: android/app/build/outputs/apk/debug/Rookie-Learn-Chess-v${{ github.run_number }}.apk
