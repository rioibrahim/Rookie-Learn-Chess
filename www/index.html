<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%23000000'/%3E%3Cg transform='translate(5,5) scale(0.7917)' fill='%23ffffff'%3E%3Ccircle cx='9.5' cy='13.5' r='2.3'/%3E%3Ccircle cx='16.8' cy='9.5' r='2.3'/%3E%3Ccircle cx='24' cy='7.8' r='2.5'/%3E%3Ccircle cx='31.2' cy='9.5' r='2.3'/%3E%3Ccircle cx='38.5' cy='13.5' r='2.3'/%3E%3Cpath d='M12.2 29.5h23.6l2.6-13.5-7.4 9.9-1.7-13.6-5.3 12.6-5.3-12.6-1.7 13.6-7.4-9.9 2.6 13.5z'/%3E%3Crect x='11.5' y='31.5' width='25' height='3.7' rx='1.85'/%3E%3Crect x='9.2' y='37.2' width='29.6' height='5.2' rx='2.4'/%3E%3C/g%3E%3C/svg%3E">
<title>Rookie: Learn Chess</title>
<style>
:root{
  --bg:#161512;
  --bg-elev:#1f1d1a;
  --pn:#262421;
  --pn2:#312e2a;
  --tx:#f0eee9;
  --mu:#a39d93;
  --ac:#7fa650;
  --ac-hi:#93bd5e;
  --ac-soft:rgba(127,166,80,.18);
  --ac-ring:rgba(127,166,80,.46);
  --acon:#0f1d09;
  --lt:#ebecd0;
  --dk:#739552;
  --bd:#3c3833;
  --err:#ef4444;
  --hint:#4b9bff;
  --shadow:0 12px 32px rgba(0,0,0,.46);
  --radius:14px;
  --piece-scale:1.2;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f2efe9;
    --bg-elev:#ebe6dc;
    --pn:#ffffff;
    --pn2:#ece8de;
    --tx:#1e1c19;
    --mu:#67625a;
    --ac:#5e8336;
    --ac-hi:#6d9640;
    --ac-soft:rgba(94,131,54,.14);
    --ac-ring:rgba(94,131,54,.38);
    --acon:#ffffff;
    --bd:#d7d1c5;
    --shadow:0 10px 26px rgba(30,28,25,.14);
  }
}
:root[data-theme="light"]{
  --bg:#f2efe9;
  --bg-elev:#ebe6dc;
  --pn:#ffffff;
  --pn2:#ece8de;
  --tx:#1e1c19;
  --mu:#67625a;
  --ac:#5e8336;
  --ac-hi:#6d9640;
  --ac-soft:rgba(94,131,54,.14);
  --ac-ring:rgba(94,131,54,.38);
  --acon:#ffffff;
  --bd:#d7d1c5;
  --shadow:0 10px 26px rgba(30,28,25,.14);
}
*,*::before,*::after{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  height:100dvh;
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:manipulation;
  background:var(--bg);
  color:var(--tx);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
body{
  display:flex;
  flex-direction:column;
  position:relative;
}
[hidden]{display:none!important}

/* Generic Interactive Controls (Minimum 44px touch targets) */
button{
  font:inherit;
  color:var(--tx);
  background:var(--pn);
  border:1px solid var(--bd);
  border-radius:12px;
  padding:0 14px;
  min-height:44px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-size:14px;
  font-weight:600;
  line-height:1.15;
  white-space:nowrap;
  flex-shrink:0;
  cursor:pointer;
  transition:border-color .14s ease,background-color .14s ease,color .14s ease,transform .08s ease;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
}
button svg,.ico{
  width:21px;
  height:21px;
  flex:0 0 auto;
  display:block;
}
button:active:not(:disabled){transform:scale(.97)}
button:hover:not(:disabled){border-color:var(--ac)}
button.on,button.pri{
  background:var(--ac);
  color:var(--acon);
  border-color:var(--ac);
  font-weight:700;
}
button:disabled{opacity:.4;cursor:default}

/* Mittens Glowing Red Signature Style */
button.mittens-btn{
  border-color:rgba(239,68,68,.55);
  color:#fca5a5;
  background:rgba(239,68,68,.12);
  box-shadow:0 0 12px rgba(239,68,68,.28);
}
:root[data-theme="light"] button.mittens-btn{
  color:#b91c1c;
}
button.mittens-btn.on{
  background:#ef4444;
  color:#ffffff;
  border-color:#f87171;
  box-shadow:0 0 16px rgba(239,68,68,.62);
}
.mittens-pill{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:2px 8px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.03em;
  text-transform:uppercase;
  color:#ffffff;
  background:#ef4444;
  box-shadow:0 0 10px rgba(239,68,68,.7);
}
.mittens-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#ef4444;
  box-shadow:0 0 8px #ef4444;
  flex:0 0 auto;
}

.icon-btn{
  width:44px;
  height:44px;
  min-width:44px;
  min-height:44px;
  padding:0;
  border-radius:12px;
}
.icon-btn svg{width:22px;height:22px}

/* Compact Top Header + Dropdown Trigger */
header#hdr{
  flex:0 0 auto;
  position:relative;
  z-index:40;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:calc(8px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 8px calc(12px + env(safe-area-inset-left,0px));
  background:var(--pn);
  border-bottom:1px solid var(--bd);
}
.brand-group{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}
.app-badge{
  width:38px;
  height:38px;
  border-radius:10px;
  background:#000000;
  border:1px solid rgba(255,255,255,.18);
  display:grid;
  place-items:center;
  padding:5px;
  flex:0 0 auto;
  box-shadow:0 2px 8px rgba(0,0,0,.35);
}
.app-badge svg{width:100%;height:100%;display:block}
.brand-meta{
  display:flex;
  flex-direction:column;
  min-width:0;
}
.brand-title{
  font-size:15px;
  font-weight:800;
  letter-spacing:-.02em;
  line-height:1.15;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.brand-sub{
  font-size:12px;
  font-weight:600;
  color:var(--mu);
  line-height:1.2;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  display:flex;
  align-items:center;
  gap:6px;
}
.hdr-actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex:0 0 auto;
}
.menu-btn{
  min-height:44px;
  padding:0 14px;
  border-radius:12px;
  background:var(--pn2);
  gap:6px;
}
.menu-btn .chev{
  width:16px;
  height:16px;
  transition:transform .2s ease;
}
.menu-btn[aria-expanded="true"]{
  background:var(--ac);
  color:var(--acon);
  border-color:var(--ac);
}
.menu-btn[aria-expanded="true"] .chev{
  transform:rotate(180deg);
}

/* Header Dropdown Menu Overlay */
#menu-backdrop{
  position:fixed;
  inset:0;
  z-index:45;
  background:rgba(0,0,0,.46);
}
#menu-pop{
  position:fixed;
  top:calc(62px + env(safe-area-inset-top,0px));
  right:calc(12px + env(safe-area-inset-right,0px));
  width:min(360px,calc(100vw - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));
  max-height:calc(100dvh - 84px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  overflow-y:auto;
  overscroll-behavior:contain;
  z-index:50;
  background:var(--pn);
  border:1px solid var(--bd);
  border-radius:16px;
  padding:14px;
  box-shadow:var(--shadow);
  animation:popIn .16s ease-out;
}
@keyframes popIn{
  from{opacity:0;transform:translateY(-6px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.menu-sec{margin-bottom:14px}
.menu-sec:last-child{margin-bottom:0}
.menu-lbl{
  font-size:11.5px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--mu);
  margin:0 0 8px;
}
.seg{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}
.seg-3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}
.seg-4{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:6px;
}
.seg button,.seg-3 button{
  width:100%;
  min-height:44px;
  border-radius:12px;
  font-size:13.5px;
}
.seg-4 button{
  width:100%;
  min-height:42px;
  padding:0 4px;
  border-radius:10px;
  font-size:12.5px;
}
.diff-list{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.diff-item{
  width:100%;
  min-height:44px;
  padding:8px 12px;
  border-radius:12px;
  justify-content:space-between;
  text-align:left;
  font-size:13px;
}
.diff-item .d-name{font-weight:700;display:flex;align-items:center;gap:6px}
.diff-item .d-sub{font-size:11.5px;opacity:.82;font-weight:500}
.menu-grid{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.menu-grid button{
  min-height:42px;
  padding:0 12px;
  font-size:13px;
  border-radius:10px;
}
.sw-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}
.sw{
  width:40px;
  height:40px;
  min-width:40px;
  min-height:40px;
  padding:0;
  border-radius:50%;
}
.vol-wrap{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:8px;
}
.vol-wrap input[type="range"]{
  flex:1 1 auto;
  height:36px;
  accent-color:var(--ac);
  cursor:pointer;
}
.vol-val{
  min-width:44px;
  text-align:right;
  font-weight:700;
  font-size:13px;
  font-variant-numeric:tabular-nums;
}

/* Main Content Area */
main{
  flex:1 1 0;
  min-height:0;
  width:100%;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* PLAY VIEW: Maximized Board + Compact Action Strip */
#play-view{
  flex:1 1 0;
  min-height:0;
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:8px calc(10px + env(safe-area-inset-right,0px)) 8px calc(10px + env(safe-area-inset-left,0px));
  display:flex;
  flex-direction:column;
  gap:8px;
}
#status-bar{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-height:40px;
  padding:8px 12px;
  background:var(--pn);
  border:1px solid var(--bd);
  border-radius:12px;
}
.status-main{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
  flex:1 1 auto;
}
.turn-dot{
  width:12px;
  height:12px;
  border-radius:50%;
  flex:0 0 auto;
  border:1.5px solid var(--bd);
}
.turn-dot.w{background:#fcfbf7;border-color:#9e9a92}
.turn-dot.b{background:#232220;border-color:#777268}
.turn-dot.thinking{animation:thinkPulse 1s ease-in-out infinite}
@keyframes thinkPulse{
  0%,100%{transform:scale(.9);opacity:.6}
  50%{transform:scale(1.15);opacity:1}
}
.status-txt{
  font-size:13.5px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.status-sub{
  font-size:12px;
  color:var(--mu);
  white-space:nowrap;
  flex:0 0 auto;
}

/* Contextual Banner for Lessons / Puzzles / Hints / Warnings / Checkmate */
#banner{
  flex:0 0 auto;
  padding:10px 12px;
  border-radius:12px;
  background:var(--pn);
  border:1px solid var(--bd);
  border-left:4px solid var(--ac);
  font-size:13.5px;
  line-height:1.4;
  display:flex;
  flex-direction:column;
  gap:8px;
}
#banner.bad{
  border-color:rgba(239,68,68,.55);
  border-left:4px solid var(--err);
  background:rgba(239,68,68,.14);
}
#banner.hint{
  border-left-color:var(--hint);
  background:rgba(75,155,255,.12);
}
.banner-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}
.banner-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.banner-actions button{
  min-height:38px;
  padding:0 12px;
  font-size:13px;
  border-radius:10px;
}

/* Fixed 90% Screen-Width Square Chessboard Container */
#bwrap{
  flex:1 1 0;
  min-height:0;
  width:100%;
  display:grid;
  place-items:center;
  container-type:size;
}
#bw{
  position:relative;
  width:min(90vw,100cqw,100cqh);
  height:min(90vw,100cqw,100cqh);
  min-width:0;
  margin:0;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}
#bd{
  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  grid-template-rows:repeat(8,minmax(0,1fr));
  width:100%;
  height:100%;
  border-radius:10px;
  overflow:hidden;
  border:1.5px solid var(--bd);
}
.sq{
  position:relative;
  display:grid;
  place-items:center;
  min-width:0;
  min-height:0;
  cursor:pointer;
  touch-action:manipulation;
}
.sq.l{background:var(--lt)}
.sq.d{background:var(--dk)}
.sq.last{box-shadow:inset 0 0 0 100px rgba(255,220,0,.35)}
.sq.sel{box-shadow:inset 0 0 0 100px rgba(255,235,0,.56)}
.sq.chk{box-shadow:inset 0 0 0 100px rgba(239,68,68,.46),inset 0 0 0 3px #ef4444}
.sq.chk-warn::after{
  content:"";
  position:absolute;
  inset:2px;
  border:3px solid #ff2e4c;
  border-radius:4px;
  box-shadow:0 0 14px rgba(255,46,76,.95),inset 0 0 10px rgba(255,46,76,.75);
  pointer-events:none;
  z-index:8;
  animation:kingPulse .65s ease-in-out infinite;
}
@keyframes kingPulse{
  0%,100%{opacity:.45;transform:scale(.95)}
  50%{opacity:1;transform:scale(1)}
}
.sq.mate-king{
  background:radial-gradient(circle at center,rgba(255,46,76,.88) 0%,rgba(220,38,38,.72) 62%,rgba(127,29,29,.85) 100%)!important;
  box-shadow:inset 0 0 0 3px #ff4d67,inset 0 0 18px rgba(255,30,60,.95);
}
.sq.h1{box-shadow:inset 0 0 0 100px rgba(75,155,255,.52)}
.sq.h2{box-shadow:inset 0 0 0 100px rgba(45,204,120,.56)}
.sq[data-r]::before{
  content:attr(data-r);
  position:absolute;
  left:4px;
  top:3px;
  font-size:clamp(10px,2.4vw,12px);
  font-weight:800;
  color:rgba(28,32,22,.74);
  line-height:1;
  pointer-events:none;
  z-index:2;
}
.sq[data-f]::after{
  content:attr(data-f);
  position:absolute;
  right:4px;
  bottom:3px;
  font-size:clamp(10px,2.4vw,12px);
  font-weight:800;
  color:rgba(28,32,22,.74);
  line-height:1;
  pointer-events:none;
  z-index:2;
}
.sq.d[data-r]::before,.sq.d[data-f]::after{
  color:rgba(255,255,255,.82);
}
.sq .ind{
  position:absolute;
  pointer-events:none;
  z-index:3;
  display:none;
}
.sq.mv .ind{
  display:block;
  width:30%;
  height:30%;
  border-radius:50%;
  background:rgba(0,0,0,.24);
}
.sq.cap .ind{
  display:block;
  inset:4%;
  border-radius:50%;
  border:3.5px solid rgba(0,0,0,.28);
}

/* Persistent GPU-Composited Piece Layer (Default +20% Piece Scale) */
#pl{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:5;
  overflow:hidden;
  border-radius:10px;
}
.pp{
  position:absolute;
  left:0;
  top:0;
  width:12.5%;
  height:12.5%;
  display:grid;
  place-items:center;
  padding:0;
  pointer-events:none;
  transform-origin:center center;
  transition:transform var(--p-ms,160ms) cubic-bezier(.2,.8,.2,1);
}
.pp.dragging{
  transition:none!important;
  will-change:transform;
  z-index:25;
}
.pp.snap{
  transition:none!important;
}
.pp.mate-king svg{
  filter:drop-shadow(0 0 8px #ff2e4c) drop-shadow(0 0 16px rgba(239,68,68,.9));
}
.pp svg{
  width:74%;
  height:74%;
  display:block;
  transform:scale(var(--piece-scale,1.2));
  transform-origin:center center;
  transition:transform .12s ease;
}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}

/* Inline Draw Color Strip (Shown When Draw Mode Active) */
#draw-bar{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:6px 10px;
  background:var(--pn);
  border:1px solid var(--bd);
  border-radius:12px;
}
#draw-bar .sw-row{margin-top:0}
#draw-bar .sw{width:34px;height:34px;min-width:34px;min-height:34px}
#draw-bar .draw-acts{display:flex;align-items:center;gap:6px}
#draw-bar .draw-acts button{min-height:36px;padding:0 10px;font-size:12.5px;border-radius:10px}

/* Compact Action Bar Under Board (Restart, Undo, Redo, Draw, Flip, Hint, Moves) */
#bctl{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:4px;
  width:100%;
}
#bctl button{
  min-height:46px;
  padding:4px 2px;
  border-radius:11px;
  flex-direction:column;
  gap:2px;
  font-size:10px;
  font-weight:700;
}
#bctl button svg{
  width:21px;
  height:21px;
}

/* UI Size Presets (Compact / Normal / Large) */
:root[data-ui="compact"] header#hdr{
  padding:calc(5px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-right,0px)) 5px calc(10px + env(safe-area-inset-left,0px));
}
:root[data-ui="compact"] .app-badge{width:32px;height:32px;padding:4px}
:root[data-ui="compact"] .icon-btn{width:38px;height:38px;min-width:38px;min-height:38px}
:root[data-ui="compact"] .menu-btn{min-height:38px;padding:0 11px;font-size:13px}
:root[data-ui="compact"] #play-view{padding:4px calc(8px + env(safe-area-inset-right,0px)) 4px calc(8px + env(safe-area-inset-left,0px));gap:5px}
:root[data-ui="compact"] #status-bar{min-height:34px;padding:5px 10px}
:root[data-ui="compact"] .status-txt{font-size:12.5px}
:root[data-ui="compact"] #bctl button{min-height:39px;font-size:9.5px;border-radius:9px}
:root[data-ui="compact"] #bctl button svg{width:17px;height:17px}
:root[data-ui="compact"] nav#botbar{padding:6px calc(10px + env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-left,0px))}
:root[data-ui="compact"] nav#botbar button{min-height:40px;font-size:13px}

:root[data-ui="large"] #play-view{gap:10px}
:root[data-ui="large"] #status-bar{min-height:46px;padding:9px 14px}
:root[data-ui="large"] .status-txt{font-size:15px}
:root[data-ui="large"] #bctl{gap:6px}
:root[data-ui="large"] #bctl button{min-height:54px;font-size:11px;border-radius:12px}
:root[data-ui="large"] #bctl button svg{width:24px;height:24px}
:root[data-ui="large"] nav#botbar button{min-height:52px;font-size:15px}
:root[data-ui="large"] button{min-height:48px}

/* ME VIEW: Player Stats, Daily Puzzles & Comprehensive Learning Hub */
#me-view{
  flex:1 1 0;
  min-height:0;
  width:100%;
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:14px calc(14px + env(safe-area-inset-right,0px)) 18px calc(14px + env(safe-area-inset-left,0px));
}
.me-wrap{
  max-width:720px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.card{
  background:var(--pn);
  border:1px solid var(--bd);
  border-radius:16px;
  padding:16px;
}
.card h3{
  margin:0 0 10px;
  font-size:16px;
  font-weight:800;
  letter-spacing:-.01em;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.me-hero{
  display:flex;
  align-items:center;
  gap:14px;
}
.me-emblem{
  width:60px;
  height:60px;
  border-radius:16px;
  background:#000000;
  border:1px solid rgba(255,255,255,.2);
  padding:9px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  box-shadow:0 6px 18px rgba(0,0,0,.35);
}
.me-emblem svg{width:100%;height:100%;display:block}
.me-hero-info{min-width:0;flex:1 1 auto}
.me-hero-title{font-size:18px;font-weight:800;line-height:1.2}
.mu{color:var(--mu);font-size:13px;line-height:1.4}
.bar{
  height:10px;
  background:var(--pn2);
  border-radius:999px;
  overflow:hidden;
  margin-top:8px;
}
.bar i{
  display:block;
  height:100%;
  background:var(--ac);
  border-radius:999px;
  transition:width .25s ease;
}
.stats-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.stat{
  background:var(--pn2);
  border:1px solid var(--bd);
  border-radius:12px;
  padding:12px 14px;
  font-size:12.5px;
  color:var(--mu);
}
.stat b{
  display:block;
  color:var(--tx);
  font-size:22px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  line-height:1.2;
  margin-bottom:2px;
}
.mod-hdr{
  font-size:11.5px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--ac);
  margin:12px 0 6px;
}
.mod-hdr:first-child{margin-top:2px}
.item-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.list-btn{
  width:100%;
  min-height:54px;
  padding:10px 14px;
  border-radius:12px;
  justify-content:space-between;
  text-align:left;
  background:var(--pn2);
  white-space:normal;
}
.list-btn .l-left{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:2px;
  min-width:0;
  padding-right:8px;
}
.list-btn .l-title{font-size:14.5px;font-weight:700}
.list-btn .l-sub{font-size:12px;color:var(--mu);font-weight:500}
.badge{
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  background:var(--pn);
  border:1px solid var(--bd);
  color:var(--mu);
  flex:0 0 auto;
}
.badge.done{
  background:var(--ac-soft);
  border-color:var(--ac-ring);
  color:var(--ac);
}
.badge.today{
  background:var(--ac);
  border-color:var(--ac);
  color:var(--acon);
}

/* Fixed Bottom Bar (Play | Me) */
nav#botbar{
  flex:0 0 auto;
  z-index:35;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  padding:8px calc(14px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px));
  background:var(--pn);
  border-top:1px solid var(--bd);
}
nav#botbar button{
  min-height:46px;
  border-radius:12px;
  font-size:14px;
  font-weight:700;
  background:transparent;
  border-color:transparent;
  color:var(--mu);
}
nav#botbar button.on{
  background:var(--ac-soft);
  border-color:var(--ac-ring);
  color:var(--ac);
}

/* Expandable Move List Drawer */
#drawer-bg{
  position:fixed;
  inset:0;
  z-index:55;
  background:rgba(0,0,0,.5);
}
#drawer{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:60;
  max-width:720px;
  margin:0 auto;
  max-height:72dvh;
  background:var(--pn);
  border-top:1px solid var(--bd);
  border-radius:20px 20px 0 0;
  padding:14px calc(16px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px));
  display:flex;
  flex-direction:column;
  gap:12px;
  box-shadow:0 -12px 32px rgba(0,0,0,.45);
  animation:slideUp .18s ease-out;
}
@keyframes slideUp{
  from{transform:translateY(28px);opacity:.6}
  to{transform:translateY(0);opacity:1}
}
.drawer-hdr{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.drawer-hdr h3{margin:0;font-size:16px;font-weight:800}
.drawer-body{
  overflow-y:auto;
  overscroll-behavior:contain;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.moves-grid{
  display:grid;
  grid-template-columns:44px minmax(0,1fr) minmax(0,1fr);
  gap:4px 8px;
  font-size:13.5px;
  font-variant-numeric:tabular-nums;
}
.m-num{color:var(--mu);font-weight:700}
.m-san{font-weight:600;padding:3px 6px;border-radius:6px;background:var(--pn2)}
code{
  display:block;
  word-break:break-all;
  font-size:12px;
  padding:8px 10px;
  background:var(--pn2);
  border:1px solid var(--bd);
  border-radius:10px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}

/* Shared Overlay Modals (Bot Color Modal, Pawn Promotion Modal, Checkmate Modal) */
.modal-bg{
  position:fixed;
  inset:0;
  z-index:70;
  background:rgba(0,0,0,.64);
  display:grid;
  place-items:center;
  padding:16px;
}
.modal-card{
  width:min(390px,100%);
  max-height:calc(100dvh - 32px);
  overflow-y:auto;
  background:var(--pn);
  border:1px solid var(--bd);
  border-radius:20px;
  padding:20px 18px 18px;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  gap:14px;
  text-align:center;
  animation:popIn .16s ease-out;
}
.modal-card h3{margin:0;font-size:19px;font-weight:800}
.modal-emblem{
  width:56px;
  height:56px;
  margin:0 auto;
  border-radius:16px;
  background:#000000;
  border:1px solid rgba(255,255,255,.2);
  padding:8px;
  display:grid;
  place-items:center;
}
.modal-emblem.mate-glow{
  border-color:#ef4444;
  box-shadow:0 0 22px rgba(239,68,68,.7);
}
.modal-emblem svg{width:100%;height:100%;display:block}
.color-choices{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}
.color-opt{
  min-height:82px;
  padding:10px 6px;
  flex-direction:column;
  gap:6px;
  border-radius:14px;
  background:var(--pn2);
}
.color-swatch{
  width:30px;
  height:30px;
  border-radius:50%;
  border:2px solid var(--bd);
}
.color-swatch.w{background:#fcfbf7}
.color-swatch.b{background:#1d1c1a}
.color-swatch.r{background:linear-gradient(135deg,#fcfbf7 50%,#1d1c1a 50%)}

/* Promotion Modal Grid */
.promo-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.promo-opt{
  min-height:86px;
  padding:10px;
  flex-direction:column;
  gap:6px;
  border-radius:14px;
  background:var(--pn2);
}
.promo-opt svg{
  width:46px;
  height:46px;
}
.promo-opt span{
  font-size:13px;
  font-weight:700;
}

/* Coach Gemini Chat Bubble & Mistake Prompt */
#coach-box{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:8px 12px;
  background:var(--pn);
  border:1px solid var(--bd);
  border-left:4px solid var(--hint);
  border-radius:12px;
  font-size:13px;
  line-height:1.35;
}
#coach-box.warn{
  border-color:rgba(239,68,68,.55);
  border-left-color:var(--err);
  background:rgba(239,68,68,.12);
}
#coach-box.good{
  border-left-color:var(--ac);
}
.coach-lead{
  display:flex;
  align-items:flex-start;
  gap:8px;
  min-width:0;
  flex:1 1 auto;
}
.coach-ava{
  width:26px;
  height:26px;
  border-radius:8px;
  background:var(--hint);
  color:#fff;
  font-size:12px;
  font-weight:800;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  margin-top:1px;
}
#coach-box.warn .coach-ava{background:var(--err)}
#coach-box.good .coach-ava{background:var(--ac)}
.coach-txt{min-width:0;font-weight:600}
.coach-txt small{display:block;color:var(--mu);font-weight:500;font-size:11.5px;margin-top:1px}
#coach-box button{
  min-height:34px;
  padding:0 10px;
  font-size:12px;
  border-radius:9px;
}
#coach-prompt{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:7px 10px;
  background:rgba(239,68,68,.14);
  border:1px solid rgba(239,68,68,.5);
  border-radius:12px;
  font-size:12.5px;
  font-weight:700;
}
.cp-acts{display:flex;gap:6px;flex:0 0 auto}
.cp-acts button{min-height:36px;padding:0 11px;font-size:12.5px;border-radius:9px}

/* Daily Countdown Banner */
.cd-box{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 12px;
  margin-bottom:10px;
  border-radius:12px;
  background:var(--ac-soft);
  border:1px solid var(--ac-ring);
  font-size:13px;
  font-weight:700;
}
.cd-time{
  font-variant-numeric:tabular-nums;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:15px;
  font-weight:800;
  color:var(--ac);
}

.rm *,.rm *::after{animation:none!important;transition:none!important}
@media (max-height:520px) and (min-width:560px){
  #play-view{
    display:grid;
    grid-template-columns:minmax(0,1fr) 230px;
    grid-template-rows:auto auto minmax(0,1fr);
    grid-template-areas:"board status" "board banner" "board actions";
    gap:8px 12px;
  }
  #bwrap{grid-area:board}
  #status-bar{grid-area:status}
  #banner{grid-area:banner}
  #bctl{grid-area:actions;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start}
}

function formatMidnightCountdown(){
  const now=new Date();
  const next=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1,0,0,0,0);
  const sec=Math.max(0,Math.ceil((next.getTime()-now.getTime())/1000));
  const h=String(Math.floor(sec/3600)).padStart(2,"0");
  const m=String(Math.floor((sec%3600)/60)).padStart(2,"0");
  const s=String(sec%60).padStart(2,"0");
  return `${h}:${m}:${s}`;
}

/* ---------- Web Audio SFX ---------- */
let AC=null;
function unlockAudio(){
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx)return;
    if(!AC)AC=new Ctx();
    if(AC.state==="suspended")AC.resume().catch(()=>{});
  }catch(e){}
}
document.addEventListener("pointerdown",unlockAudio,{passive:true});
function tone(f,d=.08,ty="sine",v=.18,t0=0){
  if(P.mute||P.vol<=.01)return;
  try{
    unlockAudio();
    if(!AC)return;
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;
    o.type=ty;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(Math.max(.001,v*P.vol),t);
    g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(AC.destination);
    o.start(t);o.stop(t+d);
  }catch(e){}
}

function parseFen(fen){
  const p=fen.split(" "),rows=p[0].split("/");
  const b=new Int8Array(64);
  let wk=-1,bk=-1;
  for(let r=0;r<8;r++){
    let c=0;
    for(const ch of rows[r]){
      if(ch>="1"&&ch<="8"){c+=+ch}
      else{
        const lo=ch.toLowerCase(),t=PMAP[lo],v=ch===lo?-t:t,idx=r*8+c;
        b[idx]=v;
        if(v===6)wk=idx;else if(v===-6)bk=idx;
        c++;
      }
    }
  }
  let cr=0;
  if(p[2]){
    if(p[2].includes("K"))cr|=1;
    if(p[2].includes("Q"))cr|=2;
    if(p[2].includes("k"))cr|=4;
    if(p[2].includes("q"))cr|=8;
  }
  const ep=p[3]&&p[3]!=="-"?((8-+p[3][1])*8+(p[3].charCodeAt(0)-97)):-1;
  return{b,turn:p[1]==="w"?1:-1,cr,ep,wk,bk};
}

function attacked(b,sq,by){
  const r=sq>>3,c=sq&7;
  const pr=by===1?r+1:r-1;
  if(pr>=0&&pr<8){
    if(c>0&&b[pr*8+c-1]===by)return true;
    if(c<7&&b[pr*8+c+1]===by)return true;
  }
  const kn=by*2;
  for(let i=0;i<8;i++){
    const nr=r+KN[i][0],nc=c+KN[i][1];
    if(nr>=0&&nr<8&&nc>=0&&nc<8&&b[nr*8+nc]===kn)return true;
  }
  const kk=by*6;
  for(let i=0;i<8;i++){
    const kr=r+KDIR[i][0],kc=c+KDIR[i][1];
    if(kr>=0&&kr<8&&kc>=0&&kc<8&&b[kr*8+kc]===kk)return true;
  }
  const bb=by*3,qq=by*5;
  for(let i=0;i<4;i++){
    let dr=BDIR[i][0],dc=BDIR[i][1],nr=r+dr,nc=c+dc;
    while(nr>=0&&nr<8&&nc>=0&&nc<8){
      const v=b[nr*8+nc];
      if(v){if(v===bb||v===qq)return true;break}
      nr+=dr;nc+=dc;
    }
  }
  const rr=by*4;
  for(let i=0;i<4;i++){
    let dr=RDIR[i][0],dc=RDIR[i][1],nr=r+dr,nc=c+dc;
    while(nr>=0&&nr<8&&nc>=0&&nc<8){
      const v=b[nr*8+nc];
      if(v){if(v===rr||v===qq)return true;break}
      nr+=dr;nc+=dc;
    }
  }
  return false;
}

function genMoves(st,capOnly){
  const b=st.b,side=st.turn,ms=[];
  for(let sq=0;sq<64;sq++){
    const p=b[sq];
    if(!p||(p>0?1:-1)!==side)continue;
    const t=p<0?-p:p,r=sq>>3,c=sq&7;
    if(t===1){
      const dr=side===1?-1:1,nr=r+dr,promoRank=side===1?0:7,startRank=side===1?6:1;
      if(nr>=0&&nr<8){
        const fwd=nr*8+c;
        if(!capOnly&&!b[fwd]){
          if(nr===promoRank){
            ms.push({f:sq,t:fwd,pr:5,cap:0});
            ms.push({f:sq,t:fwd,pr:2,cap:0});
          }else{
            ms.push({f:sq,t:fwd,pr:0,cap:0});
            if(r===startRank){
              const fwd2=(r+dr*2)*8+c;
              if(!b[fwd2])ms.push({f:sq,t:fwd2,pr:0,cap:0,dp:1});
            }
          }
        }
        for(const dc of[-1,1]){
          const nc=c+dc;if(nc<0||nc>7)continue;
          const to=nr*8+nc,tp=b[to];
          if(tp&&(tp>0?1:-1)===-side){
            const cv=VAL[tp<0?-tp:tp];
            if(nr===promoRank){
              ms.push({f:sq,t:to,pr:5,cap:cv});
              ms.push({f:sq,t:to,pr:2,cap:cv});
            }else ms.push({f:sq,t:to,pr:0,cap:cv});
          }else if(to===st.ep){
            ms.push({f:sq,t:to,pr:0,cap:100,ep:1});
          }
        }
      }
    }else if(t===2){
      for(let i=0;i<8;i++){
        const nr=r+KN[i][0],nc=c+KN[i][1];
        if(nr<0||nr>7||nc<0||nc>7)continue;
        const to=nr*8+nc,tp=b[to];
        if(!tp){if(!capOnly)ms.push({f:sq,t:to,pr:0,cap:0})}
        else if((tp>0?1:-1)===-side)ms.push({f:sq,t:to,pr:0,cap:VAL[tp<0?-tp:tp]});
      }
    }else if(t===6){
      for(let i=0;i<8;i++){
        const nr=r+KDIR[i][0],nc=c+KDIR[i][1];
        if(nr<0||nr>7||nc<0||nc>7)continue;
        const to=nr*8+nc,tp=b[to];
        if(!tp){if(!capOnly)ms.push({f:sq,t:to,pr:0,cap:0})}
        else if((tp>0?1:-1)===-side)ms.push({f:sq,t:to,pr:0,cap:VAL[tp<0?-tp:tp]});
      }
      if(!capOnly){
        if(side===1&&sq===60){
          if((st.cr&1)&&!b[61]&&!b[62]&&b[63]===4&&!attacked(b,60,-1)&&!attacked(b,61,-1)&&!attacked(b,62,-1))
            ms.push({f:60,t:62,pr:0,cap:0,cs:1});
          if((st.cr&2)&&!b[59]&&!b[58]&&!b[57]&&b[56]===4&&!attacked(b,60,-1)&&!attacked(b,59,-1)&&!attacked(b,58,-1))
            ms.push({f:60,t:58,pr:0,cap:0,cs:2});
        }else if(side===-1&&sq===4){
          if((st.cr&4)&&!b[5]&&!b[6]&&b[7]===-4&&!attacked(b,4,1)&&!attacked(b,5,1)&&!attacked(b,6,1))
            ms.push({f:4,t:6,pr:0,cap:0,cs:4});
          if((st.cr&8)&&!b[3]&&!b[2]&&!b[1]&&b[0]===-4&&!attacked(b,4,1)&&!attacked(b,3,1)&&!attacked(b,2,1))
            ms.push({f:4,t:2,pr:0,cap:0,cs:8});
        }
      }
    }else{
      const dirs=t===3?BDIR:t===4?RDIR:BDIR.concat(RDIR);
      for(let i=0;i<dirs.length;i++){
        const dr=dirs[i][0],dc=dirs[i][1];
        let nr=r+dr,nc=c+dc;
        while(nr>=0&&nr<8&&nc>=0&&nc<8){
          const to=nr*8+nc,tp=b[to];
          if(!tp){if(!capOnly)ms.push({f:sq,t:to,pr:0,cap:0})}
          else{
            if((tp>0?1:-1)===-side)ms.push({f:sq,t:to,pr:0,cap:VAL[tp<0?-tp:tp]});
            break;
          }
          nr+=dr;nc+=dc;
        }
      }
    }
  }
  return ms;
}

function makeMove(st,m){
  const b=st.b,side=st.turn,pc=b[m.f],cap=b[m.t];
  const u={f:m.f,t:m.t,pc,cap,cr:st.cr,ep:st.ep,wk:st.wk,bk:st.bk,epSq:-1,rkF:-1,rkT:-1};
  b[m.t]=m.pr?side*m.pr:pc;
  b[m.f]=0;
  if(pc===6)st.wk=m.t;else if(pc===-6)st.bk=m.t;
  if(m.ep){
    u.epSq=side===1?m.t+8:m.t-8;
    u.epCap=b[u.epSq];
    b[u.epSq]=0;
  }
  if(m.cs){
    if(m.cs===1){u.rkF=63;u.rkT=61}
    else if(m.cs===2){u.rkF=56;u.rkT=59}
    else if(m.cs===4){u.rkF=7;u.rkT=5}
    else{u.rkF=0;u.rkT=3}
    b[u.rkT]=b[u.rkF];b[u.rkF]=0;
  }
  if(m.f===60||m.t===60)st.cr&=~3;
  if(m.f===4||m.t===4)st.cr&=~12;
  if(m.f===63||m.t===63)st.cr&=~1;
  if(m.f===56||m.t===56)st.cr&=~2;
  if(m.f===7||m.t===7)st.cr&=~4;
  if(m.f===0||m.t===0)st.cr&=~8;
  st.ep=m.dp?(side===1?m.t+8:m.t-8):-1;
  st.turn=-side;
  return u;
}

function unmake(st,u){
  const b=st.b;
  st.turn=-st.turn;
  b[u.f]=u.pc;b[u.t]=u.cap;
  if(u.epSq>=0)b[u.epSq]=u.epCap;
  if(u.rkF>=0){b[u.rkF]=b[u.rkT];b[u.rkT]=0}
  st.cr=u.cr;st.ep=u.ep;st.wk=u.wk;st.bk=u.bk;
}

function evalBoard(st,agg,aiSide){
  const b=st.b;
  let sc=0;
  const enemyKing=aiSide===1?st.bk:st.wk;
  const ekr=enemyKing>>3,ekc=enemyKing&7;
  for(let sq=0;sq<64;sq++){
    const p=b[sq];if(!p)continue;
    if(p>0){
      sc+=VAL[p]+PSTS[p][sq];
      if(agg&&aiSide===1&&p<6){
        const d=Math.abs((sq>>3)-ekr)+Math.abs((sq&7)-ekc);
        sc+=Math.max(0,8-d)*((agg*0.4)|0);
      }
    }else{
      const ap=-p,r=sq>>3,c=sq&7;
      sc-=VAL[ap]+PSTS[ap][(7-r)*8+c];
      if(agg&&aiSide===-1&&ap<6){
        const d=Math.abs(r-ekr)+Math.abs(c-ekc);
        sc-=Math.max(0,8-d)*((agg*0.4)|0);
      }
    }
  }
  return st.turn===1?sc:-sc;
}

function quiesce(st,alpha,beta,qDepth,ctx){
  if((++ctx.nodes&63)===0&&performance.now()>ctx.deadline)throw 1;
  const stand=evalBoard(st,ctx.agg,ctx.aiSide);
  if(stand>=beta)return beta;
  if(alpha<stand)alpha=stand;
  if(qDepth<=0)return alpha;
  const ms=genMoves(st,true).sort((a,b)=>b.cap-a.cap);
  const side=st.turn;
  for(let i=0;i<ms.length;i++){
    const m=ms[i],u=makeMove(st,m);
    const ksq=side===1?st.wk:st.bk;
    if(attacked(st.b,ksq,-side)){unmake(st,u);continue}
    const sc=-quiesce(st,-beta,-alpha,qDepth-1,ctx);
    unmake(st,u);
    if(sc>=beta)return beta;

function search(st,depth,alpha,beta,ctx){

  const ms=genMoves(st,false);
  ms.sort((a,b)=>(b.cap+(b.pr?800:0))-(a.cap+(a.pr?800:0)));
  const side=st.turn;
  let legal=0,best=-1e9;
  for(let i=0;i<ms.length;i++){
    const m=ms[i],u=makeMove(st,m);
    const ksq=side===1?st.wk:st.bk;
    if(attacked(st.b,ksq,-side)){unmake(st,u);continue}
    legal++;
    const sc=-search(st,depth-1,-beta,-alpha,ctx);
    unmake(st,u);
    if(sc>best)best=sc;
    if(sc>alpha)alpha=sc;
    if(alpha>=beta)break;

    const ksq=side===1?st.wk:st.bk;

}

        next.push({m,sc});

      next.sort((a,b)=>b.sc-a.sc);

/* Async time-sliced fallback if Blob Worker is unavailable */
const V_FALLBACK={p:100,n:320,b:330,r:500,q:900,k:0};
function evalShallow(g){
  let s=0;
  const bd=g.board();
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const x=bd[r][c];if(!x)continue;
    let v=V_FALLBACK[x.type];
    if(x.type==="p")v+=(x.color==="w"?6-r:r-1)*6;
    if(c>1&&c<6&&r>1&&r<6&&"pnb".includes(x.type))v+=10;
    s+=x.color==="w"?v:-v;
  }
  return g.turn()==="w"?s:-s;
}
function runFallbackAsync(fen,diff,cb){
  const g=new Chess(fen);
  const ms=g.moves({verbose:true});
  if(!ms.length)return cb(null);
  let i=0,best=ms[0],bestSc=-1e9;
  const agg=(diff==="mittens"?45:diff==="nightmare"?28:diff==="hard"?12:0);
  const endDeadline=performance.now()+220;
  function step(){
    const t0=performance.now();
    while(i<ms.length&&performance.now()-t0<8){
      const m=ms[i++];
      g.move(m);
      let sc=g.in_checkmate()?1e6:-evalShallow(g);
      if(agg&&g.in_check())sc+=agg;
      if(agg&&m.captured)sc+=Math.round(agg*.5);
      if(diff==="easy")sc+=Math.random()*95;
      else if(diff==="medium")sc+=Math.random()*28;
      g.undo();
      if(sc>bestSc){bestSc=sc;best=m}
      if(performance.now()>=endDeadline)break;
    }
    if(i<ms.length&&performance.now()<endDeadline)setTimeout(step,0);
    else cb(best.from+best.to+(best.promotion||""));
  }
  setTimeout(step,0);
}
function runCoachEvalFallback(fenBefore,fenAfter,cb){
  const gB=new Chess(fenBefore),ms=gB.moves({verbose:true});
  let best=ms[0],bestSc=-1e9;
  for(const m of ms){gB.move(m);const sc=gB.in_checkmate()?1e5:-evalShallow(gB);gB.undo();if(sc>bestSc){bestSc=sc;best=m}}
  const gA=new Chess(fenAfter),om=gA.moves({verbose:true});
  let opp=om[0],oppSc=-1e9;
  for(const m of om){gA.move(m);const sc=gA.in_checkmate()?1e5:-evalShallow(gA);gA.undo();if(sc>oppSc){oppSc=sc;opp=m}}
  const playedSc=om.length?-oppSc:(gA.in_checkmate()?1e5:0);
  let isCheck=false;
  if(opp){gA.move(opp);isCheck=gA.in_check();gA.undo();}
  setTimeout(()=>cb({
    loss:bestSc-playedSc,
    punishUci:opp?opp.from+opp.to:"",
    punFrom:opp?opp.from:"",
    punTo:opp?opp.to:"",
    atkType:opp?opp.piece:"",
    tgtType:opp&&opp.captured?opp.captured:"",
    isCheck
  }),0);
}

/* ---------- Pseudo-Legal Move Detector (For Check & Pin Feedback) ---------- */
function pathClear(g,fc,fr,tc,tr){
  const dc=Math.sign(tc-fc),dr=Math.sign(tr-fr);
  let c=fc+dc,r=fr+dr;
  while(c!==tc||r!==tr){
    const sq="abcdefgh"[c]+(r+1);
    if(g.get(sq))return false;
    c+=dc;r+=dr;
  }
  return true;
}
function isPseudoLegalMove(g,from,to){
  if(!from||!to||from===to)return false;
  const p=g.get(from);
  if(!p||p.color!==g.turn())return false;
  const dest=g.get(to);
  if(dest&&dest.color===p.color)return false;
  const fc=from.charCodeAt(0)-97,fr=+from[1]-1;
  const tc=to.charCodeAt(0)-97,tr=+to[1]-1;
  const dc=tc-fc,dr=tr-fr,adc=Math.abs(dc),adr=Math.abs(dr);
  if(p.type==="p"){
    const dir=p.color==="w"?1:-1;
    if(dc===0&&dr===dir&&!dest)return true;
    const startRank=p.color==="w"?1:6;
    if(dc===0&&dr===2*dir&&fr===startRank&&!dest){
      const mid="abcdefgh"[fc]+(fr+dir+1);
      return !g.get(mid);
    }
    if(adc===1&&dr===dir){
      if(dest)return true;
      const ep=g.fen().split(" ")[3];
      return ep===to;
    }
    return false;
  }
  if(p.type==="n")return(adc===1&&adr===2)||(adc===2&&adr===1);
  if(p.type==="b")return adc===adr&&adc>0&&pathClear(g,fc,fr,tc,tr);
  if(p.type==="r")return(dc===0||dr===0)&&(adc+adr>0)&&pathClear(g,fc,fr,tc,tr);
  if(p.type==="q")return((adc===adr)||dc===0||dr===0)&&(adc+adr>0)&&pathClear(g,fc,fr,tc,tr);
  if(p.type==="k")return(adc<=1&&adr<=1&&(adc+adr>0))||(adr===0&&adc===2);
  return false;
}

function syncPieces(anim){
  const g=S.g,fen=g.fen();
  document.documentElement.style.setProperty("--p-ms",dur()+"ms");
  const fullRebuild=renderedFlip!==S.flip||!anim;
  if(renderedFen===fen&&renderedFlip===S.flip){

    return;
  }

  // Fast incremental move update (keeps all stationary pieces untouched!)
  if(!fullRebuild&&anim&&anim.m){
    const m=anim.m,rev=!!anim.rev,instant=!!anim.instant;
    const fs=rev?m.to:m.from,ts=rev?m.from:m.to;
    const moving=PE[fs];
    if(moving){
      if(!rev&&m.captured){
        const capSq=m.flags.includes("e")?(m.to[0]+m.from[1]):m.to;
        const victim=PE[capSq];
        if(victim){
          delete PE[capSq];
          if(P.fx.cap&&dur()>0){
            victim.style.opacity="0";
            setTimeout(()=>victim.remove(),140);

        }

      }

          delete PE[rf];PE[rt]=rook;
          const[rx,ry]=pxCoord(rt);

        }

      // Restore captured piece on undo
      if(rev&&m.captured){
        const capSq=m.flags.includes("e")?(m.to[0]+m.from[1]):m.to;
        PE[capSq]=makePieceEl(m.captured,m.color==="w"?"b":"w",capSq);

      renderedFlip=S.flip;
      return;
    }

  // Full board sync (only on reset / flip / initial load)
  plEl.textContent="";
  for(const k in PE)delete PE[k];
  const frag=document.createDocumentFragment();
  const bd=g.board();
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p=bd[r][c];if(!p)continue;
    const sq="abcdefgh"[c]+(8-r);
    const el=document.createElement("div");
    el.className="pp";
    el.dataset.pc=p.color+p.type;
    el.innerHTML=pieceUse(p.type,p.color);
    const[x,y]=pxCoord(sq);
    el.style.transform=`translate3d(${x*100}%,${y*100}%,0)`;
    PE[sq]=el;
    frag.appendChild(el);
  }
  plEl.appendChild(frag);
  updateCheckClass();
  renderedFen=fen;
  renderedFlip=S.flip;
}

      const col=DC[r.c]||r.c;
      const[x1,y1]=xySvg(r.a),[x2,y2]=xySvg(r.b),dx=x2-x1,dy=y2-y1,kn=Math.abs(dx*dy)===200;
      const[cx,cy]=kn?(Math.abs(dx)>Math.abs(dy)?[x2,y1]:[x1,y2]):[x1,y1];
      const l=Math.hypot(x2-cx,y2-cy);if(!l)continue;
      const ux=(x2-cx)/l,uy=(y2-cy)/l,bx=x2-ux*3.4,by=y2-uy*3.4;
      h+=`<g fill="${col}" stroke="${col}" opacity="${r.pv?.55:(r.coach?.82:.86)}"><polyline points="${x1},${y1} ${cx},${cy} ${bx},${by}" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><polygon stroke="none" points="${x2},${y2} ${bx-uy*2.3},${by+ux*2.3} ${bx+uy*2.3},${by-ux*2.3}"/></g>`;
    }
  }
  e.innerHTML=h;
}

/* ---------- Non-Blocking Bot / Coach AI Workers ---------- */
function runWorkerOp(payload,fallbackFn,cb){
  const w=ensureWorker();
  if(w){
    const onMsg=e=>{
      if(e.data.id!==payload.id)return;
      w.removeEventListener("message",onMsg);
      w.removeEventListener("error",onErr);
      cb(e.data);
    };
    const onErr=()=>{
      w.removeEventListener("message",onMsg);
      w.removeEventListener("error",onErr);
      aiWorker=null;
      fallbackFn();
    };
    w.addEventListener("message",onMsg);
    w.addEventListener("error",onErr,{once:true});
    w.postMessage(payload);
  }else fallbackFn();
}

const ID_PIECE={p:"pion",n:"kuda",b:"gajah",r:"benteng",q:"menteri",k:"raja"};
const ID_VAL={p:1,n:3,b:3,r:5,q:9,k:100};

function findCoachThreat(){
  const g=S.g;
  if(g.in_check())return null;
  const parts=g.fen().split(" ");
  parts[1]=g.turn()==="w"?"b":"w";
  parts[3]="-";
  let gOpp;
  try{gOpp=new Chess(parts.join(" "))}catch(e){return null}
  const caps=gOpp.moves({verbose:true}).filter(m=>m.captured);
  if(!caps.length)return null;
  let best=null,bestScore=0;
  for(const c of caps){
    const gain=ID_VAL[c.captured]-ID_VAL[c.piece]*0.3;
    if(gain>bestScore){bestScore=gain;best=c}
  }
  return best&&bestScore>=2?{from:best.from,to:best.to,atk:best.piece,tgt:best.captured}:null;
}

function triggerBotMove(){
  const isCoach=S.mode==="coach";
  if(S.busy||(S.mode!=="bot"&&!isCoach)||S.over||S.g.turn()===S.col)return;
  const tk=++S.tok,fen=S.g.fen(),diff=isCoach?"medium":P.diff;
  const startedAt=performance.now();
  const targetDelay=isCoach?(420+Math.round(Math.random()*280)):(600+Math.round(Math.random()*600));
  S.busy=true;
  renderUIOnly();

  const finishWithMove=uci=>{
    if(tk!==S.tok||S.g.fen()!==fen||(S.mode!=="bot"&&S.mode!=="coach"))return;
    const elapsed=performance.now()-startedAt;
    const wait=Math.max(0,targetDelay-elapsed);
    S.aiTimer=setTimeout(()=>{
      S.aiTimer=0;
      if(tk!==S.tok||S.g.fen()!==fen||(S.mode!=="bot"&&S.mode!=="coach"))return;
      const ms=S.g.moves({verbose:true});
      const mv=(uci&&ms.find(m=>(m.from+m.to+(m.promotion||""))===uci))||ms[0];
      S.busy=false;
      if(!mv){render();return}
      const m=S.g.move({from:mv.from,to:mv.to,promotion:mv.promotion});
      if(!m){render();return}
      S.last=[m.from,m.to];
      S.bad=false;
      S.msg="";
      S.ex=(isCoach?"Coach: ":"Bot: ")+explain(m,S.g);
      if(isCoach){
        const thr=findCoachThreat();
        if(S.g.in_check()){
          S.coachTone="warn";
          S.coachArrows=[];
          S.coachMsg="Skak! Raja kamu lagi terancam nih, lindungi atau geser ke tempat aman dulu ya.";
        }else if(thr){
          S.coachTone="warn";
          S.coachArrows=[{a:thr.from,b:thr.to,c:"#ef4444",coach:1}];
          S.coachMsg=`Eh hati-hati, ${ID_PIECE[thr.tgt]} kamu lagi diincer ${ID_PIECE[thr.atk]} lawan nih! Coba cek dulu sebelum melangkah.`;
        }else if(m.captured){
          S.coachTone="";
          S.coachArrows=[];
          S.coachMsg=`Aku barusan makan ${ID_PIECE[m.captured]} kamu nih. Santai, coba cari balasan yang oke ya!`;
        }else{
          S.coachTone="";
          S.coachArrows=[];
          S.coachMsg="Giliranku udah jalan. Cek dulu semua perwiramu aman sebelum melangkah ya!";
        }
      }
      snd(kind(m,S.g));clrDraw();endCheck();
      render({m});
    },wait);
  };

  runWorkerOp({id:tk,fen,diff},()=>runFallbackAsync(fen,diff,uci=>finishWithMove(uci)),d=>finishWithMove(d.uci));
}

function evaluateCoachMove(fenBefore,m){
  const tk=++S.tok,fenAfter=S.g.fen();
  S.busy=true;
  S.coachTone="";
  S.coachMsg="Sebentar ya, lagi ngecek langkah barusan…";
  renderUIOnly();
  const apply=res=>{
    if(tk!==S.tok||S.mode!=="coach"||S.g.fen()!==fenAfter)return;
    S.busy=false;
    const loss=res?res.loss:0;
    if(loss>=120&&!S.over){
      S.coachTone="warn";
      const pun=res.punishUci||"";
      const pf=res.punFrom||(pun?pun.slice(0,2):"");
      const pt=res.punTo||(pun?pun.slice(2,4):"");
      S.coachArrows=(pf&&pt)?[{a:pf,b:pt,c:"#ef4444",coach:1}]:[];
      if(res.tgtType&&res.atkType){
        S.coachMsg=`Waduh, hati-hati! Langkah barusan bikin ${ID_PIECE[res.tgtType]} kamu bisa langsung dimakan ${ID_PIECE[res.atkType]} lawan secara gratis.`;
      }else if(res.isCheck){
        S.coachMsg="Eh, tunggu dulu! Pertahanan raja kamu kebuka nih, lawan bisa langsung skak dan nekan balik.";
      }else{
        S.coachMsg="Waduh, langkah itu agak berisiko nih—lawan punya serangan balasan yang bikin kamu rugi posisi.";
      }
      S.coachPending={punishUci:pun};
      renderUIOnly();
    }else{
      S.coachTone="good";
      S.coachArrows=[];
      if(S.g.in_check()){
        S.coachMsg="Mantap! Skak yang cakep, lawan jadi tertekan nih.";
      }else if(m.captured){
        S.coachMsg="Cakep! Pertukaran yang bagus, posisimu tetap aman.";
      }else if(loss<35){
        S.coachMsg="Langkah yang oke banget! Posisimu aktif dan aman.";
      }else{
        S.coachMsg="Lumayan solid nih, aman buat lanjut ke langkah berikutnya!";
      }
      renderUIOnly();
      if(!S.over)triggerBotMove();
    }
  };
  runWorkerOp({id:tk,op:"coachEval",fenBefore,fenAfter},()=>runCoachEvalFallback(fenBefore,fenAfter,apply),d=>apply(d.res));
}

/* ---------- Fast Coaching Explanations ---------- */
function explain(m,g){
  let t=`${N[m.piece]} ${m.from}→${m.to}.`;
  if(m.captured)t+=` Captures ${N[m.captured]}.`;
  if(/[kq]/.test(m.flags)&&m.piece==="k")t+=" Castling: king to safety, rook activated.";
  if(m.flags.includes("e"))t+=" En passant capture.";
  if(m.promotion)t+=` Promoted to ${N[m.promotion]}.`;
  if(g.in_checkmate())t+=" Checkmate!";
  else if(g.in_check())t+=" Check!";
  if("de".includes(m.to[0])&&"45".includes(m.to[1]))t+=" Claims the centre.";
  if("nb".includes(m.piece)&&m.from[1]===(m.color==="w"?"1":"8"))t+=" Develops a piece.";
  if(P.beg){
    const s=m.san;
    t+=` Notation “${s}”: `+(s[0]==="O"?"castling.":(/[NBRQK]/.test(s[0])?N[m.piece][0].toUpperCase()+N[m.piece].slice(1):(s.includes("x")?"pawn capture":"pawn move"))+(s.includes("x")?", x = capture":"")+(s.includes("+")?", + = check":"")+(s.includes("#")?", # = checkmate":"")+".");
  }
  return t;
}

/* ---------- Moves, Promotion Modal, Check/Pin Validation, Undo/Redo ---------- */
const needPromo=(f,t)=>S.g.moves({square:f,verbose:true}).some(m=>m.to===t&&m.promotion);
function askPromo(f,t,fromDrag){
  const pc=S.g.get(f);if(!pc)return;
  S.pp={f,t,c:pc.color,fromDrag:!!fromDrag};
  S.ppAt=performance.now();
  S.sel=null;S.legal=[];
  renderUIOnly();
}

function reportInvalidAttempt(fromSq,targetSq){
  const g=S.g;
  const pseudo=isPseudoLegalMove(g,fromSq,targetSq);
  if(g.in_check()||pseudo){
    triggerCheckPinWarning(g.in_check()
      ?"Your King is in check! Defend or move the King"
      :"Your King is in check! That piece is pinned — defend or move the King");
    SND.err();
    return true;
  }
  if(targetSq&&g.get(targetSq)){
    S.msg="Illegal move for that piece — tap one of the dot indicators.";
    S.bad=true;
    SND.err();
    return true;
  }
  return false;
}

function doMove(f,t,pr,fromDrag){
  if(!pr&&needPromo(f,t)){
    askPromo(f,t,fromDrag);
    return;
  }
  const g=S.g;
  const fenBefore=S.mode==="coach"?g.fen():"";
  const m=g.move({from:f,to:t,promotion:pr});
  if(!m)return;
  clearCheckWarn();
  S.coachTok++;S.coachArrows=[];S.coachPending=null;
  S.sel=null;S.legal=[];S.redo=[];S.hint=null;S.hm="";S.last=[f,t];
  S.ex=explain(m,g);
  const sk=kind(m,g),L=g.history().length;
  S.bad=false;
  if(S.mode==="bot"||S.mode==="coach")S.msg="";
  let animObj={m,instant:!!fromDrag};

  if(S.mode==="learn"){
    const s=cur();
    const matched=(m.from===s.best.slice(0,2)&&s.acc.includes(m.to))||(s.accMate&&g.in_checkmate());
    if(matched){
      S.solved=true;S.msg=s.why+" ✓";
      P.done[S.li+"-"+S.si]=1;save();
      if(S.si===LS[S.li].s.length-1&&LS[S.li].s.every((_,i)=>P.done[S.li+"-"+i]))S.msg+=" Lesson complete!";
      SND.ok();
    }else{
      g.undo();S.last=null;S.ex="";S.bad=true;animObj=null;
      S.msg=m.from!==s.best.slice(0,2)?"Legal move, but try moving the lesson’s target piece instead.":"Legal move, but not the goal of this step — check the prompt or tap Hint.";
      SND.err();
    }
  }else if(S.mode==="puz"){
    const pzList=getTodayPuzzles(),p=pzList[S.pi];
    if(p.seq){
      const exp=p.seq[S.pzStep*2];
      if(f+t===exp){
        if(S.pzStep===0){
          S.pzStep=1;S.pzBusy=true;
          S.msg="Great start! Forced response incoming…";
          snd(sk);clrDraw();render(animObj);
          const tk=S.tok;
          setTimeout(()=>{
            if(tk!==S.tok||S.mode!=="puz"||!S.pzBusy)return;
            const r=p.seq[1];
            const om=S.g.move({from:r.slice(0,2),to:r.slice(2,4),promotion:"q"});
            S.pzBusy=false;
            if(om){
              S.last=[om.from,om.to];
              S.msg="Finish the combination now!";
              snd(kind(om,S.g));
              render({m:om});
            }else renderUIOnly();
          },360);
          return;
        }else{
          S.msg=p.why+" ✓";
          S.solved=true;
          recordPz(true);
          SND.ok();
        }
      }else{
        g.undo();S.last=null;S.ex="";S.bad=true;animObj=null;
        S.msg=`${m.san} isn’t the combination move. Try again or tap Hint.`;
        SND.err();
        recordPz(false);
      }
    }else{
      const ok=p.sol?(f+t===p.sol):m.san.endsWith("#");
      if(ok){
        S.msg=(p.why||`${m.san} is checkmate!`) +" ✓";
        S.solved=true;
        recordPz(true);
        SND.ok();
      }else{
        g.undo();S.last=null;S.ex="";S.bad=true;animObj=null;
        S.msg=`${m.san} isn’t the solution. Try again or tap Hint.`;
        SND.err();
        recordPz(false);
      }
    }
  }else{
    endCheck();
    if(S.mode==="basic"&&!S.over)S.flip=g.turn()==="b";
  }

  if(g.history().length===L){
    snd(sk);clrDraw();
    render(animObj);
    if(S.mode==="bot"&&!S.over)triggerBotMove();
    else if(S.mode==="coach"&&!S.over)evaluateCoachMove(fenBefore,m);
  }else{
    render();
    shakeSq(f);
  }
}

function shakeSq(sq){
  if(P.fx.rm||!P.fx.anim)return;
  const el=PE[sq];if(!el)return;
  const[x,y]=pxCoord(sq);
  el.animate([
    {transform:`translate3d(${x*100}%,${y*100}%,0)`},
    {transform:`translate3d(calc(${x*100}% - 6px),${y*100}%,0)`},
    {transform:`translate3d(calc(${x*100}% + 6px),${y*100}%,0)`},
    {transform:`translate3d(${x*100}%,${y*100}%,0)`}
  ],{duration:240});
}

function recordPz(ok){
  const pzList=getTodayPuzzles(),p=pzList[S.pi],z=P.pz,ds=getDailyState(),day=todayKey();
  if(ok){
    if(!ds.done[S.pi]){
      ds.done[S.pi]=true;
    }
    if(allDoneToday()&&z.lastDay!==day){
      z.lastDay=day;
    }
    if(!S.tried){
      z.a++;z.cat[p.c]=z.cat[p.c]||{a:0,s:0};z.cat[p.c].a++;
      z.s++;z.cat[p.c].s++;
      z.st++;z.r+=12;
    }
    S.tried=true;save();
    return;
  }
  if(S.tried)return;
  z.a++;z.cat[p.c]=z.cat[p.c]||{a:0,s:0};z.cat[p.c].a++;
  z.st=0;z.r=Math.max(400,z.r-8);
  S.tried=true;save();
}

function endCheck(){
  const g=S.g;let r="",res=null;
  if(g.in_checkmate()){
    const wn=g.turn()==="w"?"b":"w";
    r="Checkmate — "+(wn==="w"?"White":"Black")+" wins";
    res=wn===S.col?"w":"l";
    S.mateWin=wn;
    if(S.mode==="basic"||S.mode==="bot"||S.mode==="coach")S.mateModalOpen=true;
  }
  else if(g.in_stalemate()){r="Stalemate — draw";res="d"}
  else if(g.in_threefold_repetition()){r="Draw by repetition";res="d"}
  else if(g.insufficient_material()){r="Draw — insufficient material";res="d"}
  else if(g.in_draw()){r="Draw — 50-move rule";res="d"}
  if(r){
    S.over=r;
    if(S.mode==="bot"&&res){P.g[res]++;save()}
    if(S.mode==="coach"){
      S.coachArrows=[];
      if(g.in_checkmate()){
        const wn=g.turn()==="w"?"b":"w";
        S.coachTone=wn===S.col?"good":"warn";
        S.coachMsg=wn===S.col?"Keren abis! Kamu berhasil menang skakmat!":"Skakmat nih! Nggak apa-apa, yuk main lagi biar makin jago.";
      }else{
        S.coachTone="";
        S.coachMsg="Permainan berakhir seri! Pertandingan yang seimbang.";
      }
    }
  }
  return !!r;
}

function undo(){
  if(S.busy||S.pzBusy)cancelAI();
  clearCheckWarn();
  S.pp=null;S.mateModalOpen=false;S.mateWin="";
  S.coachPending=null;S.coachArrows=[];S.coachTone="";
  const g=S.g;
  if(!g.history().length)return;
  let n=((S.mode==="bot"||S.mode==="coach")&&g.turn()===S.col&&g.history().length>=2)?2:1;
  if(S.mode==="puz"&&S.pzStep===1&&g.history().length>=2){n=2;S.pzStep=0}
  S.over="";
  let lastAnim=null,undone=0;
  while(n--&&g.history().length){
    const m=g.undo();S.redo.push(m);
    lastAnim={m,rev:true};undone++;
  }
  if(S.mode==="basic")S.flip=g.turn()==="b";
  S.solved=false;S.sel=null;S.legal=[];S.hint=null;S.hm="";S.bad=false;
  if(S.mode==="learn")S.msg=cur().tx;
  else if(S.mode==="puz")S.msg=getTodayPuzzles()[S.pi].t;
  else if(S.mode==="coach"){S.msg="";S.coachMsg="Langkah udah di-undo! Yuk coba cari langkah yang lebih aman."}
  else S.msg="";
  clrDraw();
  const h=g.history({verbose:true}).pop();
  S.last=h?[h.from,h.to]:null;
  S.ex=h?explain(h,g):"";
  SND.click();
  render(undone===1?lastAnim:null);
}

function redo(){
  if(S.busy||S.pzBusy)cancelAI();
  clearCheckWarn();
  const g=S.g,o=S.redo.pop();if(!o)return;
  const m=g.move({from:o.from,to:o.to,promotion:o.promotion||"q"});
  if(!m)return;
  let lastM=m,redone=1;
  if((S.mode==="bot"||S.mode==="coach")&&!g.game_over()&&g.turn()!==S.col&&S.redo.length){
    const o2=S.redo.pop();
    const m2=g.move({from:o2.from,to:o2.to,promotion:o2.promotion||"q"});
    if(m2){lastM=m2;redone++}
  }
  if(S.mode==="basic")S.flip=g.turn()==="b";
  S.coachPending=null;S.coachArrows=[];
  S.last=[lastM.from,lastM.to];
  S.ex=explain(lastM,g);
  if(S.mode==="learn"||S.mode==="puz")S.solved=true;
  endCheck();
  snd(kind(lastM,g));clrDraw();
  render(redone===1?{m:lastM}:null);
  if((S.mode==="bot"||S.mode==="coach")&&!S.over&&g.turn()!==S.col)triggerBotMove();
}

function coachHint(){
  if(S.mode!=="coach"||S.over||S.busy)return;
  const fen=S.g.fen(),id=++S.coachTok;
  const show=uci=>{
    if(id!==S.coachTok||S.mode!=="coach"||S.g.fen()!==fen||!uci)return;
    const ms=S.g.moves({verbose:true});
    const o=ms.find(m=>(m.from+m.to+(m.promotion||""))===uci);
    if(!o)return;
    const thr=findCoachThreat();
    S.hint=[o.from];
    S.coachArrows=thr?[{a:thr.from,b:thr.to,c:"#ef4444",coach:1}]:[];
    S.coachHintUsed=true;
    S.coachTone=thr?"warn":"";
    if(thr){
      S.coachMsg=`Hati-hati, ${ID_PIECE[thr.tgt]} kamu lagi diincer ${ID_PIECE[thr.atk]} lawan tuh! Coba perhatikan ${ID_PIECE[o.piece]} yang kutandai.`;
    }else if(o.san==="O-O"||o.san==="O-O-O"){
      S.coachMsg="Petunjuk: Saatnya amanin raja! Coba rokade biar raja kamu lebih terlindungi.";
    }else if(o.captured){
      S.coachMsg=`Petunjuk: Coba perhatikan ${ID_PIECE[o.piece]} yang kutandai—ada perwira lawan yang lagi lengah nih!`;
    }else if(o.san.includes("+")){
      S.coachMsg=`Petunjuk: Coba cek ${ID_PIECE[o.piece]} yang kutandai, langkahnya bisa bikin raja lawan tertekan!`;
    }else{
      S.coachMsg=`Petunjuk: Coba lirik ${ID_PIECE[o.piece]} yang kutandai—menggerakkannya bisa bikin posisimu makin aktif.`;
    }
    renderUIOnly();
  };
  runWorkerOp({id,fen,diff:"hard"},()=>runFallbackAsync(fen,"hard",show),d=>show(d.uci));
}

function hint(){
  SND.click();
  if(S.mode==="coach"){coachHint();return}
  if(S.mode==="basic"||S.mode==="bot"){
    if(S.over||S.busy)return;
    const fen=S.g.fen();
    const showHint=uci=>{
      if(S.g.fen()!==fen||!uci)return;
      const ms=S.g.moves({verbose:true});
      const o=ms.find(m=>(m.from+m.to+(m.promotion||""))===uci);
      if(!o)return;
      S.hint=[o.from,o.to];
      S.hm=`Suggested move: ${o.san} (${N[o.piece]} to ${o.to}).`;
      S.h=3;
      renderUIOnly();
    };
    const id=++S.tok;
    runWorkerOp({id,fen,diff:"hard"},()=>runFallbackAsync(fen,"hard",showHint),d=>showHint(d.uci));
    return;
  }
  let b,idea,why;
  if(S.mode==="learn"){const s=cur();b=[s.best.slice(0,2),s.best.slice(2)];idea=s.idea;why=s.why}
  else{
    const p=getTodayPuzzles()[S.pi];
    if(p.seq){
      const mv=p.seq[S.pzStep*2];
      b=[mv.slice(0,2),mv.slice(2)];
      idea="Look for a forcing move (check or sacrifice) that strips away a defender.";
      why=p.why;
    }else if(p.sol){
      b=[p.sol.slice(0,2),p.sol.slice(2)];
      idea="Look closely for the decisive tactical blow.";
      why=p.why;
    }else{
      const m=mateMove(p.fen);
      b=[m.from,m.to];
      idea="Start with checks — which check leaves the king zero escape squares?";
      why=p.why||`${m.san} is checkmate.`;
    }
  }
  S.h=Math.min(4,S.h+1);
  S.hm=["",idea,"Look at the highlighted piece — that’s the one to move.","The highlighted squares show the exact move.","Solution: "+why][S.h];
  S.hint=S.h===2?[b[0]]:S.h>=3?b:null;
  renderUIOnly();
}

function renderStatusAndBanner(){
  const g=S.g,turnW=g.turn()==="w";
  let stText=turnW?"White to move":"Black to move";
  let stSub=g.in_check()?"CHECK":"";
  const bm=currentBotMeta();
  if(S.over){stText=S.over;stSub="Game Over"}
  else if(S.mode==="bot"||S.mode==="coach"){
    const lbl=S.mode==="coach"?"Coach Gemini":(P.diff==="mittens"?`<span class="mittens-pill">Mittens</span>`:bm.name);
    if(S.busy){
      stText=S.mode==="coach"?"Coach is thinking…":"Bot is thinking…";
      stSub=lbl;
    }else{
      stText=g.turn()===S.col?"Your turn":(S.mode==="coach"?"Coach’s turn":"Bot’s turn");
      stSub=g.in_check()?"CHECK":lbl;
    }
  }else if(S.mode==="learn"){
    stText=`${LS[S.li].t} · Step ${S.si+1}/${LS[S.li].s.length}`;
    stSub=S.solved?"Solved ✓":"";
  }else if(S.mode==="puz"){

    stText=`Daily Lv.${S.pi+1} (${p.diff}) · ${p.c}`;

    `<div class="status-main"><span class="turn-dot ${turnW?"w":"b"} ${S.busy?"thinking":""}"></span><span class="status-txt">${stText}</span></div>`+
    `${stSub?`<span class="status-sub">${stSub}</span>`:""}`;

  renderCoachBox();

  const ban=$("#banner");
  const showLearnPuz=S.mode==="learn"||S.mode==="puz";
  const text=S.hm&&S.h?S.hm:(S.over&&(S.mode==="bot"||S.mode==="coach")&&!S.msg?`${S.over}. Play again?`:S.msg);

    acts+=`<button data-a="next" class="${S.solved?"pri":""}" ${S.solved?"":"disabled"}>Next step →</button>`+
          `<button data-a="go-me">Learning Hub</button>`;

      acts+=`<span class="mu" style="font-weight:700;align-self:center">Next puzzles in <b id="banner-cd" style="color:var(--ac)">${formatMidnightCountdown()}</b></span>`;

    acts+=`<button data-a="restart" class="pri">${S.mode==="coach"?"New Coach Game":"New Bot Match"}</button>`;

  document.body.classList.toggle("rm",!!P.fx.rm);
  const isPlay=S.tab==="play";
  $("#play-view").hidden=!isPlay;
  $("#me-view").hidden=isPlay;

  renderHeaderAndMenu();
  if(isPlay){
    renderStatusAndBanner();
    syncGridHighlights();
    renderActionBar();
    ov();
  }else{
    renderMeView();
  }
  $("#botbar").innerHTML=
    `<button data-a="tab" data-v="play" class="${isPlay?"on":""}">${IC.play}<span>Play</span></button>`+
    `<button data-a="tab" data-v="me" class="${!isPlay?"on":""}">${IC.me}<span>Me</span></button>`;
  renderDrawer();
  renderColorModal();
  renderPromoModal();
  renderMateModal();
}

function render(anim){
  syncPieces(anim);
  renderUIOnly();
  cacheBoardRect();
}

/* ---------- Unified 60fps Drag-and-Drop + Tap + Keyboard ---------- */
let bdRect=null;
function cacheBoardRect(){
  const r=bdEl.getBoundingClientRect();
  if(r.width>0)bdRect=r;
}
if(window.ResizeObserver){
  new ResizeObserver(()=>cacheBoardRect()).observe(bdEl);
}
window.addEventListener("resize",cacheBoardRect,{passive:true});

function sqAtClient(x,y){
  const r=bdRect||bdEl.getBoundingClientRect();
  if(!r.width||!r.height)return null;
  const c=Math.floor((x-r.left)/r.width*8),w=Math.floor((y-r.top)/r.height*8);
  if(c<0||c>7||w<0||w>7)return null;
  return "abcdefgh"[S.flip?7-c:c]+(8-(S.flip?7-w:w));
}

function copyText(txt,label){
  try{
    if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt);
    else{const t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}
    S.copied=label+" copied";renderUIOnly();
    setTimeout(()=>{if(S.copied===label+" copied"){S.copied="";renderUIOnly()}},1500);
  }catch(e){}
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,d=b.dataset;
  if(a==="vol"||(a==="psz"&&b.tagName==="INPUT"))return;
  SND.click();
  if(a==="toggle-menu"){S.menuOpen=!S.menuOpen;renderUIOnly()}
  else if(a==="tab"){S.tab=d.v;S.menuOpen=false;renderUIOnly();if(S.tab==="play")requestAnimationFrame(cacheBoardRect)}
  else if(a==="go-me"){S.tab="me";S.menuOpen=false;renderUIOnly()}
  else if(a==="mode-basic"){S.menuOpen=false;S.mateModalOpen=false;startBasic()}
  else if(a==="mode-bot"){S.menuOpen=false;S.mateModalOpen=false;S.colorModalOpen=true;renderUIOnly()}
  else if(a==="mode-coach"){S.menuOpen=false;S.mateModalOpen=false;startCoach()}
  else if(a==="bot-col"){startBot(d.c)}
  else if(a==="close-color"){S.colorModalOpen=false;renderUIOnly()}
  else if(a==="coach-hint")coachHint();
  else if(a==="coach-undo")undo();
  else if(a==="coach-cont"){
    S.coachPending=null;S.coachArrows=[];S.coachTone="";
    S.coachMsg="Oke, kita lanjut main dari langkah barusan ya!";
    renderUIOnly();
    triggerBotMove();
  }
  else if(a==="mate-restart"){
    S.mateModalOpen=false;
    if(S.mode==="bot")startBot(S.col);
    else if(S.mode==="coach")startCoach();
    else startBasic();
  }
  else if(a==="close-mate"){S.mateModalOpen=false;renderUIOnly()}
  else if(a==="diff"){P.diff=d.v;save();renderUIOnly()}
  else if(a==="uisz"){
    P.uiSize=d.v;
    save();applyUIScale();renderUIOnly();
    requestAnimationFrame(cacheBoardRect);
  }
  else if(a==="psz"){
    P.pieceBoost=+d.v;
    save();applyUIScale();renderUIOnly();
  }
  else if(a==="beg"){P.beg=d.v==="1";save();renderUIOnly()}
  else if(a==="mute"){P.mute=!P.mute;save();renderUIOnly()}
  else if(a==="flip"){S.flip=!S.flip;render()}
  else if(a==="undo")undo();
  else if(a==="redo")redo();
  else if(a==="hint")hint();
  else if(a==="restart")restartCurrent();
  else if(a==="drawer"){S.drawerOpen=!S.drawerOpen;renderUIOnly()}
  else if(a==="close-drawer"){S.drawerOpen=false;renderUIOnly()}
  else if(a==="lesson"){startLesson(+d.i,0)}
  else if(a==="puzzle"){const idx=+d.i;if(isPuzzleUnlocked(idx))startPuzzle(idx)}
  else if(a==="next"){if(S.si<LS[S.li].s.length-1)S.si++;else{S.li=(S.li+1)%LS.length;S.si=0}startLesson()}
  else if(a==="npz"){const nx=S.pi+1;if(nx<3&&isPuzzleUnlocked(nx))startPuzzle(nx)}
  else if(a==="ppz"){S.pi=Math.max(0,S.pi-1);startPuzzle()}
  else if(a==="pro"){const p=S.pp;S.pp=null;if(p)doMove(p.f,p.t,d.p,p.fromDrag)}
  else if(a==="pcancel"){if(performance.now()-S.ppAt<250)return;S.pp=null;renderUIOnly()}
  else if(a==="dm"){S.dm=!S.dm;S.ds=null;renderUIOnly()}
  else if(a==="dc"){S.dc=d.c;S.ds=null;ov();renderDrawBar()}
  else if(a==="cd"){S.dr={a:[],h:{}};S.ds=null;ov();renderDrawBar()}
  else if(a==="set"){if(d.k==="spd")P.fx.spd=+d.v;else P.fx[d.k]=!P.fx[d.k];save();renderUIOnly()}
  else if(a==="theme"){P.theme=d.v;save();applyTheme();renderUIOnly()}
  else if(a==="cpfen")copyText(S.g.fen(),"FEN");
  else if(a==="cppgn")copyText(S.g.pgn(),"PGN");
});

$("#menu-backdrop").addEventListener("click",()=>{S.menuOpen=false;renderUIOnly()});
$("#drawer-bg").addEventListener("click",()=>{S.drawerOpen=false;renderUIOnly()});
$("#color-bg").addEventListener("click",e=>{if(e.target.id==="color-bg"){S.colorModalOpen=false;renderUIOnly()}});
$("#promo-bg").addEventListener("click",e=>{
  if(e.target.id==="promo-bg"){
    if(performance.now()-S.ppAt<250)return;
    S.pp=null;renderUIOnly();
  }
});
$("#mate-bg").addEventListener("click",e=>{if(e.target.id==="mate-bg"){S.mateModalOpen=false;renderUIOnly()}});

bdEl.addEventListener("contextmenu",e=>e.preventDefault());
let drag=null,rc=null,dragRaf=0,dragLastX=0,dragLastY=0;

function flushDragFrame(){
  dragRaf=0;
  if(!drag||!drag.moved||!drag.el||!bdRect)return;
  const r=bdRect,sqW=r.width/8,sqH=r.height/8;
  const dx=Math.max(-sqW*.5,Math.min(r.width-sqW*.5,dragLastX-r.left-sqW*.5));
  const dy=Math.max(-sqH*.5,Math.min(r.height-sqH*.5,dragLastY-r.top-sqH*.5));
  drag.el.style.transform=`translate3d(${(dx/sqW)*100}%,${(dy/sqH)*100}%,0) scale(1.16)`;
}

function endDragCleanup(){
  if(dragRaf){cancelAnimationFrame(dragRaf);dragRaf=0}
  if(drag&&drag.el){
    drag.el.classList.remove("dragging");
    const[x,y]=pxCoord(drag.sq);
    placePiece(drag.el,x,y,true);
  }
  drag=null;
}

bdEl.addEventListener("pointerdown",e=>{
  if(e.button===2){
    e.preventDefault();cacheBoardRect();
    rc={s:sqAtClient(e.clientX,e.clientY),c:e.shiftKey?"red":e.ctrlKey?"yellow":e.altKey?"blue":"green"};
    return;
  }
  if(e.button!==0||S.pp||S.menuOpen||S.drawerOpen||S.colorModalOpen||S.mateModalOpen)return;
  cacheBoardRect();
  const sq=sqAtClient(e.clientX,e.clientY);if(!sq)return;
  if(S.dm){
    drag={mode:"draw",sq,x:e.clientX,y:e.clientY,moved:false,id:e.pointerId};
    bdEl.setPointerCapture?.(e.pointerId);
    return;
  }
  if(!sideOK())return;
  if(S.sel&&S.legal.includes(sq)){
    S.dr={a:[],h:{}};ov();
    needPromo(S.sel,sq)?askPromo(S.sel,sq,false):doMove(S.sel,sq,null,false);
    return;
  }
  const p=S.g.get(sq);
  const canDrag=!!(p&&p.color===S.g.turn()&&((S.mode!=="bot"&&S.mode!=="coach")||p.color===S.col));
  if(canDrag){
    const wasSel=S.sel===sq;
    if(!wasSel){
      S.sel=sq;
      S.legal=S.g.moves({square:sq,verbose:true}).map(m=>m.to);
      S.hint=null;S.dr={a:[],h:{}};ov();
      syncGridHighlights();
      SND.click();
    }
    drag={mode:"piece",sq,x:e.clientX,y:e.clientY,moved:false,canDrag:true,wasSel,el:PE[sq],id:e.pointerId};
    bdEl.setPointerCapture?.(e.pointerId);
  }else{
    if(S.sel&&reportInvalidAttempt(S.sel,sq)){
      const prevSel=S.sel;
      S.sel=null;S.legal=[];
      renderUIOnly();
      shakeSq(prevSel);
    }else if(S.sel){
      S.sel=null;S.legal=[];S.dr={a:[],h:{}};ov();
      syncGridHighlights();
    }else if(hasDrawMarks()){
      S.dr={a:[],h:{}};S.ds=null;ov();renderDrawBar();
    }
  }
});

document.addEventListener("pointermove",e=>{
  if(rc){const t=sqAtClient(e.clientX,e.clientY);S.pv=rc.s&&t?[rc.s,t,rc.c]:null;ov();return}
  if(!drag||e.pointerId!==drag.id)return;
  const dist=Math.hypot(e.clientX-drag.x,e.clientY-drag.y);
  if(drag.mode==="draw"){
    if(dist>8)drag.moved=true;
    if(drag.moved){const t=sqAtClient(e.clientX,e.clientY);S.pv=t?[drag.sq,t,S.dc]:null;ov()}
    return;
  }
  if(!drag.canDrag||!drag.el)return;
  if(!drag.moved&&dist>6){
    drag.moved=true;
    drag.el.classList.add("dragging");
  }
  if(drag.moved){
    dragLastX=e.clientX;dragLastY=e.clientY;
    if(!dragRaf)dragRaf=requestAnimationFrame(flushDragFrame);
  }
});

function handlePointerFinish(e,cancelled){
  if(e.button===2&&rc){
    const t=cancelled?null:sqAtClient(e.clientX,e.clientY);
    if(rc.s&&t)draw(rc.s,t,rc.c);
    rc=null;S.pv=null;ov();return;
  }
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;
  if(dragRaf){cancelAnimationFrame(dragRaf);dragRaf=0}
  drag=null;S.pv=null;
  if(cancelled){
    if(d.el){
      d.el.classList.remove("dragging");
      const[x,y]=pxCoord(d.sq);
      placePiece(d.el,x,y,true);
    }
    S.sel=null;S.legal=[];syncGridHighlights();ov();return;
  }
  const target=sqAtClient(e.clientX,e.clientY);
  if(d.mode==="draw"){
    if(d.moved&&target){S.ds=null;draw(d.sq,target,S.dc)}
    else drawTap(d.sq);
    return;
  }
  if(d.moved){
    if(target&&target!==d.sq&&S.legal.includes(target)){
      if(d.el)d.el.classList.remove("dragging");
      if(needPromo(d.sq,target)){
        if(d.el){const[x,y]=pxCoord(d.sq);placePiece(d.el,x,y,true)}
        askPromo(d.sq,target,true);
      }else{
        doMove(d.sq,target,null,true);
      }
    }else{
      if(d.el){
        d.el.classList.remove("dragging");
        const[x,y]=pxCoord(d.sq);
        placePiece(d.el,x,y,true);
      }
      if(target&&target!==d.sq){
        if(reportInvalidAttempt(d.sq,target))shakeSq(d.sq);
      }
      S.sel=null;S.legal=[];renderUIOnly();
    }
  }else{
    if(d.el)d.el.classList.remove("dragging");
    if(d.wasSel){
      S.sel=null;S.legal=[];syncGridHighlights();ov();
    }
  }
}

document.addEventListener("pointerup",e=>handlePointerFinish(e,false));
document.addEventListener("pointercancel",e=>handlePointerFinish(e,true));
window.addEventListener("blur",endDragCleanup);

document.addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==="Escape"){
    if(S.mateModalOpen){S.mateModalOpen=false;renderUIOnly()}
    else if(S.pp){S.pp=null;renderUIOnly()}
    else if(S.colorModalOpen){S.colorModalOpen=false;renderUIOnly()}
    else if(S.menuOpen){S.menuOpen=false;renderUIOnly()}
    else if(S.drawerOpen){S.drawerOpen=false;renderUIOnly()}
    else{S.dr={a:[],h:{}};S.ds=null;ov();renderDrawBar()}
  }else if(e.key==="f"||e.key==="F"){S.flip=!S.flip;render()}
  else if(e.key==="ArrowLeft")undo();
  else if(e.key==="ArrowRight")redo();
});

document.addEventListener("input",e=>{
  const a=e.target.dataset.a;
  if(a==="vol"){
    P.vol=+e.target.value;save();
    const vv=$("#volv");if(vv)vv.textContent=Math.round(P.vol*100)+"%";
    tone(440,.05);
  }else if(a==="psz"){
    P.pieceBoost=+e.target.value;save();
    applyUIScale();
    const pv=$("#pszv");if(pv)pv.textContent=(P.pieceBoost>0?"+"+P.pieceBoost:P.pieceBoost)+"%";
    document.querySelectorAll('#menu-pop button[data-a="psz"]').forEach(btn=>btn.classList.toggle("on",+btn.dataset.v===P.pieceBoost));
  }
});

/* Real-Time Local Midnight Countdown & Rollover Ticker */
setInterval(()=>{
  const nowDay=todayKey();
  if(nowDay!==activeDailyDay){
    activeDailyDay=nowDay;
    getDailyState();
    if(S.mode==="puz")startPuzzle(0);
    else renderUIOnly();
    return;
  }
  const cd=formatMidnightCountdown();
  const dEl=$("#daily-cd"),bEl=$("#banner-cd");
  if(dEl)dEl.textContent=cd;
  if(bEl)bEl.textContent=cd;
},1000);

render();
})();
</script>
