<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#161512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000000'/%3E%3Cg fill='%23ffffff'%3E%3Ccircle cx='14' cy='18' r='2.9'/%3E%3Ccircle cx='23' cy='13.5' r='2.9'/%3E%3Ccircle cx='32' cy='11.5' r='3.1'/%3E%3Ccircle cx='41' cy='13.5' r='2.9'/%3E%3Ccircle cx='50' cy='18' r='2.9'/%3E%3Cpath d='M17 38.5h30l3.2-16.5-9.2 12.2-2.2-16.7-6.8 15.5-6.8-15.5-2.2 16.7-9.2-12.2 3.2 16.5z'/%3E%3Crect x='16' y='41' width='32' height='4.4' rx='2.2'/%3E%3Crect x='13.5' y='48' width='37' height='6.2' rx='2.8'/%3E%3C/g%3E%3C/svg%3E">
<title>Rookie – Learn Chess</title>
<style>
:root{
  --bg:#161512;
  --bg-elev:#1f1d1a;
  --pn:#262421;
  --pn2:#312e2a;
  --tx:#f0eee9;
  --mu:#a39d93;
  --ac:#7fa650;
  --ac-hi:#93bd5e;
  --ac-soft:rgba(127,166,80,.18);
  --ac-ring:rgba(127,166,80,.46);
  --acon:#0f1d09;
  --lt:#ebecd0;
  --dk:#739552;
  --bd:#3c3833;
  --err:#e05a55;
  --hint:#4b9bff;
  --shadow:0 12px 32px rgba(0,0,0,.46);
  --radius:14px;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f2efe9;
    --bg-elev:#ebe6dc;
    --pn:#ffffff;
    --pn2:#ece8de;
    --tx:#1e1c19;
    --mu:#67625a;
    --ac:#5e8336;
    --ac-hi:#6d9640;
    --ac-soft:rgba(94,131,54,.14);
    --ac-ring:rgba(94,131,54,.38);
    --acon:#ffffff;
    --bd:#d7d1c5;
    --shadow:0 10px 26px rgba(30,28,25,.14);
  }
}
:root[data-theme="light"]{
  --bg:#f2efe9;
  --bg-elev:#ebe6dc;
  --pn:#ffffff;
  --pn2:#ece8de;
  --tx:#1e1c19;
  --mu:#67625a;
  --ac:#5e8336;
  --ac-hi:#6d9640;
  --ac-soft:rgba(94,131,54,.14);
  --ac-ring:rgba(94,131,54,.38);
  --acon:#ffffff;
  --bd:#d7d1c5;
  --shadow:0 10px 26px rgba(30,28,25,.14);
}
*,*::before,*::after{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  height:100dvh;
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:manipulation;
  background:var(--bg);
  color:var(--tx);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
body{
  display:flex;
  flex-direction:column;
  position:relative;
}
[hidden]{display:none!important}

/* Generic Interactive Controls (Minimum 44px touch targets, clean radii) */
button{
  font:inherit;
  color:var(--tx);
  background:var(--pn);
  border:1px solid var(--bd);
  border-radius:12px;
  padding:0 14px;
  min-height:44px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-size:14px;
  font-weight:600;
  line-height:1.15;
  white-space:nowrap;
  flex-shrink:0;
  cursor:pointer;
  transition:border-color .14s ease,background-color .14s ease,color .14s ease,transform .08s ease;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
}
button svg,.ico{
  width:21px;
  height:21px;
  flex:0 0 auto;
  display:block;
}
button:active:not(:disabled){transform:scale(.97)}
button:hover:not(:disabled){border-color:var(--ac)}
button.on,button.pri{
  background:var(--ac);
  color:var(--acon);
  border-color:var(--ac);
  font-weight:700;
}
button:disabled{opacity:.4;cursor:default}

.icon-btn{
  width:44px;
  height:44px;
  min-width:44px;
  min-height:44px;
  padding:0;
  border-radius:12px;
}
.icon-btn svg{width:22px;height:22px}

/* Compact Top Header + Dropdown Trigger */
header#hdr{
  flex:0 0 auto;
  position:relative;
  z-index:40;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:calc(8px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 8px calc(12px + env(safe-area-inset-left,0px));
  background:var(--pn);
  border-bottom:1px solid var(--bd);
}
.brand-group{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}
.app-badge{
  width:38px;
  height:38px;
  border-radius:10px;
  background:#000000;
  border:1px solid rgba(255,255,255,.18);
  display:grid;
  place-items:center;
  padding:5px;
  flex:0 0 auto;
  box-shadow:0 2px 8px rgba(0,0,0,.35);
}
.app-badge svg{width:100%;height:100%;display:block}
.brand-meta{
  display:flex;
  flex-direction:column;
  min-width:0;
}
.brand-title{
  font-size:16px;
  font-weight:800;
  letter-spacing:-.02em;
  line-height:1.15;
}
.brand-sub{
  font-size:12px;
  font-weight:600;
  color:var(--mu);
  line-height:1.2;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.hdr-actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex:0 0 auto;
}
.menu-btn{
  min-height:44px;
  padding:0 14px;
  border-radius:12px;
  background:var(--pn2);
  gap:6px;
}
.menu-btn .chev{
  width:16px;
  height:16px;
  transition:transform .2s ease;
}
.menu-btn[aria-expanded="true"]{
  background:var(--ac);
  color:var(--acon);
  border-color:var(--ac);
}
.menu-btn[aria-expanded="true"] .chev{
  transform:rotate(180deg);
}

/* Header Dropdown Menu Overlay */
#menu-backdrop{
  position:fixed;
  inset:0;
  z-index:45;
  background:rgba(0,0,0,.46);
}
#menu-pop{
  position:fixed;
  top:calc(62px + env(safe-area-inset-top,0px));
  right:calc(12px + env(safe-area-inset-right,0px));
  width:min(350px,calc(100vw - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));
  max-height:calc(100dvh - 84px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  overflow-y:auto;
  overscroll-behavior:contain;
  z-index:50;
  background:var(--pn);
  border:1px solid var(--bd);
  border-radius:16px;
  padding:14px;
  box-shadow:var(--shadow);
  animation:popIn .16s ease-out;
}
@keyframes popIn{
  from{opacity:0;transform:translateY(-6px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.menu-sec{margin-bottom:14px}
.menu-sec:last-child{margin-bottom:0}
.menu-lbl{
  font-size:11.5px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--mu);
  margin:0 0 8px;
}
.seg{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}
.seg-3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}
.seg button,.seg-3 button{
  width:100%;
  min-height:44px;
  border-radius:12px;
  font-size:13.5px;
}
.menu-grid{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.menu-grid button{
  min-height:42px;
  padding:0 12px;
  font-size:13px;
  border-radius:10px;
}
.sw-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}
.sw{
  width:40px;
  height:40px;
  min-width:40px;
  min-height:40px;
  padding:0;
  border-radius:50%;
}
.vol-wrap{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:8px;
}
.vol-wrap input[type="range"]{
  flex:1 1 auto;
  height:36px;
  accent-color:var(--ac);
  cursor:pointer;
}
.vol-val{
  min-width:42px;
  text-align:right;
  font-weight:700;
  font-size:13px;
  font-variant-numeric:tabular-nums;
}

/* Main Content Area */
main{
  flex:1 1 0;
  min-height:0;
  width:100%;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* PLAY VIEW: Maximized Board + Compact Action Strip */
#play-view{
  flex:1 1 0;
  min-height:0;
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:8px calc(10px + env(safe-area-inset-right,0px)) 8px calc(10px + env(safe-area-inset-left,0px));
  display:flex;
  flex-direction:column;
  gap:8px;
}
#status-bar{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-height:40px;
  padding:8px 12px;
  background:var(--pn);
  border:1px solid var(--bd);
  border-radius:12px;
}
.status-main{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
  flex:1 1 auto;
}
.turn-dot{
  width:12px;
  height:12px;
  border-radius:50%;
  flex:0 0 auto;
  border:1.5px solid var(--bd);
}
.turn-dot.w{background:#fcfbf7;border-color:#9e9a92}
.turn-dot.b{background:#232220;border-color:#777268}
.status-txt{
  font-size:13.5px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.status-sub{
  font-size:12px;
  color:var(--mu);
  white-space:nowrap;
  flex:0 0 auto;
}

/* Contextual Banner for Lessons / Puzzles / Hints / Game Over */
#banner{
  flex:0 0 auto;
  padding:10px 12px;
  border-radius:12px;
  background:var(--pn);
  border:1px solid var(--bd);
  border-left:4px solid var(--ac);
  font-size:13.5px;
  line-height:1.4;
  display:flex;
  flex-direction:column;
  gap:8px;
}
#banner.bad{border-left-color:var(--err);background:rgba(224,90,85,.12)}
#banner.hint{border-left-color:var(--hint);background:rgba(75,155,255,.12)}
.banner-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}
.banner-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.banner-actions button{
  min-height:38px;
  padding:0 12px;
  font-size:13px;
  border-radius:10px;
}

/* Maximized 1:1 Chessboard Container */
#bwrap{
  flex:1 1 0;
  min-height:0;
  width:100%;
  display:grid;
  place-items:center;
  container-type:size;
}
#bw{
  position:relative;
  width:min(100cqw,100cqh);
  height:min(100cqw,100cqh);
  min-width:0;
  margin:0;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}
#bd{
  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  grid-template-rows:repeat(8,minmax(0,1fr));
  width:100%;
  height:100%;
  border-radius:10px;
  overflow:hidden;
  border:1.5px solid var(--bd);
}
.sq{
  position:relative;
  display:grid;
  place-items:center;
  min-width:0;
  min-height:0;
  cursor:pointer;
  touch-action:manipulation;
}
.sq.l{background:var(--lt)}
.sq.d{background:var(--dk)}
.sq.last{box-shadow:inset 0 0 0 100px rgba(255,220,0,.35)}
.sq.sel{box-shadow:inset 0 0 0 100px rgba(255,235,0,.56)}
.sq.chk{box-shadow:inset 0 0 0 100px rgba(255,45,45,.58)}
.sq.h1{box-shadow:inset 0 0 0 100px rgba(75,155,255,.52)}
.sq.h2{box-shadow:inset 0 0 0 100px rgba(45,204,120,.56)}
.sq[data-r]::before{
  content:attr(data-r);
  position:absolute;
  left:4px;
  top:3px;
  font-size:clamp(10px,2.4vw,12px);
  font-weight:800;
  color:rgba(28,32,22,.74);
  line-height:1;
  pointer-events:none;
  z-index:2;
}
.sq[data-f]::after{
  content:attr(data-f);
  position:absolute;
  right:4px;
  bottom:3px;
  font-size:clamp(10px,2.4vw,12px);
  font-weight:800;
  color:rgba(28,32,22,.74);
  line-height:1;
  pointer-events:none;
  z-index:2;
}
.sq.d[data-r]::before,.sq.d[data-f]::after{
  color:rgba(255,255,255,.82);
}
.sq .ind{
  position:absolute;
  pointer-events:none;
  z-index:3;
  display:none;
}
.sq.mv .ind{
  display:block;
  width:30%;
  height:30%;
  border-radius:50%;
  background:rgba(0,0,0,.24);
}
.sq.cap .ind{
  display:block;
  inset:7%;
  border-radius:50%;
  border:4px solid rgba(0,0,0,.26);
}

/* Persistent GPU-Composited Piece Layer */
#pl{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:5;
  overflow:hidden;
  border-radius:10px;
}
.pp{
  position:absolute;
  left:0;
  top:0;
  width:12.5%;
  height:12.5%;
  display:grid;
  place-items:center;
  padding:4%;
  pointer-events:none;
  transform-origin:center center;
  transition:transform var(--p-ms,160ms) cubic-bezier(.2,.8,.2,1);
}
.pp.dragging{
  transition:none!important;
  will-change:transform;
  z-index:25;
}
.pp.snap{
  transition:none!important;
}
.pp svg,.pkb svg{width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
#pk{position:absolute;inset:0;z-index:30;pointer-events:none;border-radius:10px;overflow:hidden}
.pkbg{position:absolute;inset:0;background:rgba(0,0,0,.52);pointer-events:auto}
.pkc{
  position:absolute;
  width:12.5%;
  display:flex;
  gap:2px;
  padding:2px;
  background:#eeebe3;
  border-radius:10px;
  box-shadow:0 8px 20px rgba(0,0,0,.45);
  pointer-events:auto;
}
.pkb{
  width:100%;
  aspect-ratio:1;
  padding:6%;
  display:grid;
  place-items:center;
  border:0;
  background:transparent;
  border-radius:8px;
  min-height:0;
}
.pkb:hover,.pkb:active{background:rgba(127,166,80,.42)}

/* Inline Draw Color Strip (Shown When Draw Mode Active) */
#draw-bar{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:6px 10px;
  background:var(--pn);
  border:1px solid var(--bd);
  border-radius:12px;
}
#draw-bar .sw-row{margin-top:0}
#draw-bar .sw{width:34px;height:34px;min-width:34px;min-height:34px}
#draw-bar .draw-acts{display:flex;align-items:center;gap:6px}
#draw-bar .draw-acts button{min-height:36px;padding:0 10px;font-size:12.5px;border-radius:10px}

/* Compact Action Bar Under Board */
#bctl{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:4px;
  width:100%;
}
#bctl button{
  min-height:46px;
  padding:4px 2px;
  border-radius:11px;
  flex-direction:column;
  gap:2px;
  font-size:10px;
  font-weight:700;
}
#bctl button svg{
  width:21px;
  height:21px;
}

/* ME VIEW: Player Stats, Learn Lessons & Tactical Puzzles */
#me-view{
  flex:1 1 0;
  min-height:0;
  width:100%;
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:14px calc(14px + env(safe-area-inset-right,0px)) 18px calc(14px + env(safe-area-inset-left,0px));
}
.me-wrap{
  max-width:720px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.card{
  background:var(--pn);
  border:1px solid var(--bd);
  border-radius:16px;
  padding:16px;
}
.card h3{
  margin:0 0 10px;
  font-size:16px;
  font-weight:800;
  letter-spacing:-.01em;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.me-hero{
  display:flex;
  align-items:center;
  gap:14px;
}
.me-emblem{
  width:60px;
  height:60px;
  border-radius:16px;
  background:#000000;
  border:1px solid rgba(255,255,255,.2);
  padding:9px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  box-shadow:0 6px 18px rgba(0,0,0,.35);
}
.me-emblem svg{width:100%;height:100%;display:block}
.me-hero-info{min-width:0;flex:1 1 auto}
.me-hero-title{font-size:18px;font-weight:800;line-height:1.2}
.mu{color:var(--mu);font-size:13px;line-height:1.4}
.bar{
  height:10px;
  background:var(--pn2);
  border-radius:999px;
  overflow:hidden;
  margin-top:8px;
}
.bar i{
  display:block;
  height:100%;
  background:var(--ac);
  border-radius:999px;
  transition:width .25s ease;
}
.stats-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.stat{
  background:var(--pn2);
  border:1px solid var(--bd);
  border-radius:12px;
  padding:12px 14px;
  font-size:12.5px;
  color:var(--mu);
}
.stat b{
  display:block;
  color:var(--tx);
  font-size:22px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  line-height:1.2;
  margin-bottom:2px;
}
.item-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.list-btn{
  width:100%;
  min-height:52px;
  padding:10px 14px;
  border-radius:12px;
  justify-content:space-between;
  text-align:left;
  background:var(--pn2);
}
.list-btn .l-left{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:2px;
  min-width:0;
}
.list-btn .l-title{font-size:14.5px;font-weight:700}
.list-btn .l-sub{font-size:12px;color:var(--mu);font-weight:500}
.badge{
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  background:var(--pn);
  border:1px solid var(--bd);
  color:var(--mu);
}
.badge.done{
  background:var(--ac-soft);
  border-color:var(--ac-ring);
  color:var(--ac);
}

/* Fixed Bottom Bar (Play | Me) */
nav#botbar{
  flex:0 0 auto;
  z-index:35;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  padding:8px calc(14px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px));
  background:var(--pn);
  border-top:1px solid var(--bd);
}
nav#botbar button{
  min-height:46px;
  border-radius:12px;
  font-size:14px;
  font-weight:700;
  background:transparent;
  border-color:transparent;
  color:var(--mu);
}
nav#botbar button.on{
  background:var(--ac-soft);
  border-color:var(--ac-ring);
  color:var(--ac);
}

/* Expandable Move List Drawer */
#drawer-bg{
  position:fixed;
  inset:0;
  z-index:55;
  background:rgba(0,0,0,.5);
}
#drawer{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:60;
  max-width:720px;
  margin:0 auto;
  max-height:72dvh;
  background:var(--pn);
  border-top:1px solid var(--bd);
  border-radius:20px 20px 0 0;
  padding:14px calc(16px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px));

@keyframes slideUp{
  from{transform:translateY(28px);opacity:.6}
  to{transform:translateY(0);opacity:1}
}
.drawer-hdr{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.drawer-hdr h3{margin:0;font-size:16px;font-weight:800}
.drawer-body{
  overflow-y:auto;
  overscroll-behavior:contain;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.moves-grid{
  display:grid;
  grid-template-columns:44px minmax(0,1fr) minmax(0,1fr);

}

.m-san{font-weight:600;padding:3px 6px;border-radius:6px;background:var(--pn2)}
code{

  word-break:break-all;
  font-size:12px;
  padding:8px 10px;
  background:var(--pn2);
  border:1px solid var(--bd);
  border-radius:10px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}

#color-bg{
  position:fixed;
  inset:0;
  z-index:70;
  background:rgba(0,0,0,.62);
  display:grid;
  place-items:center;
  padding:16px;
}
#color-modal{
  width:min(380px,100%);
  background:var(--pn);
  border:1px solid var(--bd);
  border-radius:20px;
  padding:20px 18px 18px;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  gap:14px;
  text-align:center;
  animation:popIn .16s ease-out;
}
.modal-emblem{
  width:56px;
  height:56px;
  margin:0 auto;
  border-radius:16px;
  background:#000000;
  border:1px solid rgba(255,255,255,.2);

  place-items:center;
}
.modal-emblem svg{width:100%;height:100%;display:block}
#color-modal h3{margin:0;font-size:19px;font-weight:800}
.color-choices{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));

}
.color-opt{
  min-height:84px;
  padding:10px 6px;
  flex-direction:column;
  gap:6px;
  border-radius:14px;
  background:var(--pn2);
}
.color-swatch{
  width:30px;
  height:30px;
  border-radius:50%;
  border:2px solid var(--bd);
}
.color-swatch.w{background:#fcfbf7}
.color-swatch.b{background:#1d1c1a}
.color-swatch.r{background:linear-gradient(135deg,#fcfbf7 50%,#1d1c1a 50%)}

.rm *,.rm *::after{animation:none!important;transition:none!important}

function parseFen(fen){

    }
  }
  let cr=0;
  if(p[2]){
    if(p[2].includes("K"))cr|=1;
    if(p[2].includes("Q"))cr|=2;
    if(p[2].includes("k"))cr|=4;
    if(p[2].includes("q"))cr|=8;
  }

function makeMove(st,m){

  if(pc===6)st.wk=m.t;else if(pc===-6)st.bk=m.t;
  if(m.ep){
    u.epSq=side===1?m.t+8:m.t-8;
    u.epCap=b[u.epSq];
    b[u.epSq]=0;
  }

    if(m.cs===1){u.rkF=63;u.rkT=61}
    else if(m.cs===2){u.rkF=56;u.rkT=59}
    else if(m.cs===4){u.rkF=7;u.rkT=5}

  }

  if(m.f===4||m.t===4)st.cr&=~12;
  if(m.f===63||m.t===63)st.cr&=~1;
  if(m.f===56||m.t===56)st.cr&=~2;
  if(m.f===7||m.t===7)st.cr&=~4;

  if(u.epSq>=0)b[u.epSq]=u.epCap;
  if(u.rkF>=0){b[u.rkF]=b[u.rkT];b[u.rkT]=0}
  st.cr=u.cr;st.ep=u.ep;st.wk=u.wk;st.bk=u.bk;
}

function evalBoard(st){
  const b=st.b;
  let sc=0;
  for(let sq=0;sq<64;sq++){
    const p=b[sq];if(!p)continue;
    if(p>0)sc+=VAL[p]+PSTS[p][sq];
    else{const ap=-p,r=sq>>3,c=sq&7;sc-=VAL[ap]+PSTS[ap][(7-r)*8+c]}
  }
  return st.turn===1?sc:-sc;
}

function quiesce(st,alpha,beta,qDepth,ctx){
  if((++ctx.nodes&63)===0&&performance.now()>ctx.deadline)throw 1;
  const stand=evalBoard(st);
  if(stand>=beta)return beta;
  if(alpha<stand)alpha=stand;
  if(qDepth<=0)return alpha;
  const ms=genMoves(st,true).sort((a,b)=>b.cap-a.cap);
  const side=st.turn;
  for(let i=0;i<ms.length;i++){
    const m=ms[i],u=makeMove(st,m);
    const ksq=side===1?st.wk:st.bk;
    if(attacked(st.b,ksq,-side)){unmake(st,u);continue}
    const sc=-quiesce(st,-beta,-alpha,qDepth-1,ctx);
    unmake(st,u);
    if(sc>=beta)return beta;
    if(sc>alpha)alpha=sc;
  }
  return alpha;
}

function search(st,depth,alpha,beta,ctx){
  if((++ctx.nodes&63)===0&&performance.now()>ctx.deadline)throw 1;
  if(depth<=0)return quiesce(st,alpha,beta,4,ctx);
  const ms=genMoves(st,false);
  ms.sort((a,b)=>(b.cap+(b.pr?800:0))-(a.cap+(a.pr?800:0)));
  const side=st.turn;
  let legal=0,best=-1e9;
  for(let i=0;i<ms.length;i++){
    const m=ms[i],u=makeMove(st,m);
    const ksq=side===1?st.wk:st.bk;
    if(attacked(st.b,ksq,-side)){unmake(st,u);continue}
    legal++;
    const sc=-search(st,depth-1,-beta,-alpha,ctx);
    unmake(st,u);
    if(sc>best)best=sc;
    if(sc>alpha)alpha=sc;
    if(alpha>=beta)break;
  }
  if(!legal){
    const ksq=side===1?st.wk:st.bk;
    return attacked(st.b,ksq,-side)?(-100000-depth):0;
  }
  return best;
}

function sqToStr(sq){return "abcdefgh"[sq&7]+(8-(sq>>3))}
function pickMove(fen,diff){
  const st=parseFen(fen),side=st.turn;
  const maxD=diff==="hard"?3:2;
  const budget=diff==="hard"?150:105;
  const ctx={nodes:0,deadline:performance.now()+budget};
  const raw=genMoves(st,false),legal=[];
  for(let i=0;i<raw.length;i++){
    const m=raw[i],u=makeMove(st,m);
    const ksq=side===1?st.wk:st.bk;
    if(!attacked(st.b,ksq,-side))legal.push(m);
    unmake(st,u);
  }
  if(!legal.length)return null;
  let scored=legal.map(m=>({m,sc:0}));
  for(let d=1;d<=maxD;d++){
    try{
      const next=[];
      for(let i=0;i<scored.length;i++){
        const m=scored[i].m,u=makeMove(st,m);
        const sc=-search(st,d-1,-1e9,1e9,ctx);
        unmake(st,u);
        next.push({m,sc});
      }
      next.sort((a,b)=>b.sc-a.sc);
      scored=next;
    }catch(e){break}
  }
  let chosen=scored[0].m;
  if(diff==="easy"&&scored.length>1){
    const top=scored[0].sc;
    const pool=scored.filter((x,idx)=>idx<4&&(top-x.sc)<=95);
    chosen=pool[(Math.random()*pool.length)|0].m;
  }
  return sqToStr(chosen.f)+sqToStr(chosen.t)+PCHAR[chosen.pr];
}

self.onmessage=e=>{
  const{id,fen,diff}=e.data;
  const uci=pickMove(fen,diff);
  self.postMessage({id,uci});
};

/* Async time-sliced fallback if Blob Worker is unavailable */
const V_FALLBACK={p:100,n:320,b:330,r:500,q:900,k:0};
function evalShallow(g){
  let s=0;
  const bd=g.board();
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const x=bd[r][c];if(!x)continue;
    let v=V_FALLBACK[x.type];
    if(x.type==="p")v+=(x.color==="w"?6-r:r-1)*6;
    if(c>1&&c<6&&r>1&&r<6&&"pnb".includes(x.type))v+=10;
    s+=x.color==="w"?v:-v;
  }
  return g.turn()==="w"?s:-s;
}
function runFallbackAsync(fen,diff,cb){
  const g=new Chess(fen);
  const ms=g.moves({verbose:true});
  if(!ms.length)return cb(null);
  let i=0,best=ms[0],bestSc=-1e9;
  const endDeadline=performance.now()+150;
  function step(){
    const t0=performance.now();
    while(i<ms.length&&performance.now()-t0<8){
      const m=ms[i++];
      g.move(m);
      let sc=g.in_checkmate()?1e6:-evalShallow(g);
      if(diff==="easy")sc+=Math.random()*75;
      g.undo();
      if(sc>bestSc){bestSc=sc;best=m}
      if(performance.now()>=endDeadline)break;
    }
    if(i<ms.length&&performance.now()<endDeadline)setTimeout(step,0);
    else cb(best.from+best.to+(best.promotion||""));
  }
  setTimeout(step,0);
}

/* ---------- Persistent 64-Square Grid & Keyed Piece Layer (Zero Rebuilds) ---------- */
const sqMap={};

const PE={}; // keyed by square "e2" -> div.pp element
let renderedFen="";
let renderedFlip=null;

function pxCoord(sq){
  const f=sq.charCodeAt(0)-97,r=+sq[1]-1;
  return[S.flip?7-f:f,S.flip?r:7-r];
}
function xySvg(sq){
  const f=sq.charCodeAt(0)-97,r=+sq[1]-1;
  return[(S.flip?7-f:f)*10+5,(S.flip?r:7-r)*10+5];
}
function placePiece(el,x,y,instant){
  if(instant)el.classList.add("snap");

function buildGridIfNeeded(){
  if(gridBuiltFlip===S.flip)return;
  gridBuiltFlip=S.flip;
  const frag=document.createDocumentFragment();
  for(const k in sqMap)delete sqMap[k];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const rr=S.flip?7-r:r,cc=S.flip?7-c:c,sq="abcdefgh"[cc]+(8-rr);

}

function syncGridHighlights(){
  buildGridIfNeeded();
  const g=S.g;

  if(g.in_check()){
    const bd=g.board(),turn=g.turn();
    for(let r=0;r<8;r++)for(let c=0;c<8;c++){
      const p=bd[r][c];
      if(p&&p.type==="k"&&p.color===turn){ckSq="abcdefgh"[c]+(8-r);break}
    }

    const isChk=sq===ckSq;

    const isH2=S.hint&&S.hint.length>1&&S.hint[1]===sq;
    const isMv=legalSet&&legalSet.has(sq);

function makePieceEl(type,color,sq){
  const el=document.createElement("div");
  el.className="pp";

  placePiece(el,x,y,true);

  return el;
}

function syncPieces(anim){
  const g=S.g,fen=g.fen();
  document.documentElement.style.setProperty("--p-ms",dur()+"ms");
  const fullRebuild=renderedFlip!==S.flip||!anim;
  if(renderedFen===fen&&renderedFlip===S.flip)return;

  // Fast incremental move update (keeps all stationary pieces untouched!)
  if(!fullRebuild&&anim&&anim.m){
    const m=anim.m,rev=!!anim.rev;
    const fs=rev?m.to:m.from,ts=rev?m.from:m.to;
    const moving=PE[fs];
    if(moving){
      // Handle captured piece fade/removal or undo restore
      if(!rev&&m.captured){
        const capSq=m.flags.includes("e")?(m.to[0]+m.from[1]):m.to;
        const victim=PE[capSq];
        if(victim){
          delete PE[capSq];
          if(P.fx.cap&&dur()>0){
            victim.style.opacity="0";
            setTimeout(()=>victim.remove(),140);
          }else victim.remove();
        }
      }
      delete PE[fs];
      PE[ts]=moving;
      if(!rev&&m.promotion){
        moving.dataset.pc=m.color+m.promotion;
        moving.innerHTML=pieceUse(m.promotion,m.color);
      }else if(rev&&m.promotion){
        moving.dataset.pc=m.color+"p";
        moving.innerHTML=pieceUse("p",m.color);
      }
      const[tx,ty]=pxCoord(ts);
      placePiece(moving,tx,ty,false);

      // Castling rook glide
      if(m.piece==="k"&&/[kq]/.test(m.flags)){
        const ks=m.flags.includes("k"),rk=m.from[1];
        const rf=rev?(ks?"f":"d")+rk:(ks?"h":"a")+rk;
        const rt=rev?(ks?"h":"a")+rk:(ks?"f":"d")+rk;
        const rook=PE[rf];
        if(rook){
          delete PE[rf];PE[rt]=rook;
          const[rx,ry]=pxCoord(rt);
          placePiece(rook,rx,ry,false);
        }
      }

      // Restore captured piece on undo
      if(rev&&m.captured){
        const capSq=m.flags.includes("e")?(m.to[0]+m.from[1]):m.to;
        PE[capSq]=makePieceEl(m.captured,m.color==="w"?"b":"w",capSq);
      }

      updateCheckClass();
      renderedFen=fen;
      renderedFlip=S.flip;
      return;
    }
  }

  // Full board sync (only on reset / flip / initial load)
  plEl.textContent="";
  for(const k in PE)delete PE[k];
  const frag=document.createDocumentFragment();
  const bd=g.board();
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p=bd[r][c];if(!p)continue;
    const sq="abcdefgh"[c]+(8-r);
    const el=document.createElement("div");
    el.className="pp";
    el.dataset.pc=p.color+p.type;
    el.innerHTML=pieceUse(p.type,p.color);
    const[x,y]=pxCoord(sq);
    el.style.transform=`translate3d(${x*100}%,${y*100}%,0)`;
    PE[sq]=el;
    frag.appendChild(el);
  }
  plEl.appendChild(frag);
  updateCheckClass();
  renderedFen=fen;
  renderedFlip=S.flip;
}

function updateCheckClass(){
  const g=S.g,inChk=g.in_check(),turn=g.turn();
  for(const sq in PE){
    const el=PE[sq];
    el.classList.toggle("chk",inChk&&el.dataset.pc===turn+"k");
  }
}

/* ---------- Fast Coaching Explanations (O(1) Attack Check) ---------- */
function explain(m,g){
  let t=`${N[m.piece]} ${m.from}→${m.to}.`;
  if(m.captured)t+=` Captures ${N[m.captured]}.`;
  if(/[kq]/.test(m.flags)&&m.piece==="k")t+=" Castling: king to safety, rook activated.";
  if(m.flags.includes("e"))t+=" En passant capture.";
  if(m.promotion)t+=` Promoted to ${N[m.promotion]}.`;
  if(g.in_checkmate())t+=" Checkmate!";
  else if(g.in_check())t+=" Check!";
  if("de".includes(m.to[0])&&"45".includes(m.to[1]))t+=" Claims the centre.";
  if("nb".includes(m.piece)&&m.from[1]===(m.color==="w"?"1":"8"))t+=" Develops a piece.";
  if(P.beg){
    const s=m.san;
    t+=` Notation “${s}”: `+(s[0]==="O"?"castling.":(/[NBRQK]/.test(s[0])?N[m.piece][0].toUpperCase()+N[m.piece].slice(1):(s.includes("x")?"pawn capture":"pawn move"))+(s.includes("x")?", x = capture":"")+(s.includes("+")?", + = check":"")+(s.includes("#")?", # = checkmate":"")+".");
  }
  return t;
}

const needPromo=(f,t)=>S.g.moves({square:f,verbose:true}).some(m=>m.to===t&&m.promotion);

}

function shakeSq(sq){
  if(P.fx.rm||!P.fx.anim)return;
  const el=PE[sq];if(!el)return;
  const[x,y]=pxCoord(sq);
  el.animate([
    {transform:`translate3d(${x*100}%,${y*100}%,0)`},
    {transform:`translate3d(calc(${x*100}% - 6px),${y*100}%,0)`},
    {transform:`translate3d(calc(${x*100}% + 6px),${y*100}%,0)`},
    {transform:`translate3d(${x*100}%,${y*100}%,0)`}
  ],{duration:260});
}

function doMove(f,t,pr){
  const g=S.g,m=g.move({from:f,to:t,promotion:pr||"q"});
  if(!m)return;
  S.sel=null;S.legal=[];S.redo=[];S.hint=null;S.hm="";S.last=[f,t];
  S.ex=explain(m,g);
  const sk=kind(m,g),L=g.history().length;
  S.bad=false;
  let animObj={m};

  if(S.mode==="learn"){
    const s=cur();
    if(m.from===s.best.slice(0,2)&&s.acc.includes(m.to)){
      S.solved=true;S.msg=s.why+" ✓";
      P.done[S.li+"-"+S.si]=1;save();
      if(S.si===LS[S.li].s.length-1&&LS[S.li].s.every((_,i)=>P.done[S.li+"-"+i]))S.msg+=" Lesson complete!";
      SND.ok();
    }else{
      g.undo();S.last=null;S.ex="";S.bad=true;animObj=null;
      S.msg=m.from!==s.best.slice(0,2)?"Legal move, but try moving the lesson’s target piece instead.":"Legal move, but not the goal of this step — check the prompt or tap Hint.";
      SND.err();
    }
  }else if(S.mode==="puz"){
    const p=PZ[S.pi],ok=p.sol?(f+t===p.sol):m.san.endsWith("#");
    if(ok){
      S.msg=(p.why||`${m.san} is checkmate!`) +" ✓";
      S.solved=true;
      if(!S.tried)recordPz(true);
      SND.ok();
    }else{
      g.undo();S.last=null;S.ex="";S.bad=true;animObj=null;
      S.msg=`${m.san} isn’t the solution. Try again or tap Hint.`;
      SND.err();
      if(!S.tried){S.tried=true;recordPz(false)}
    }
  }else if(S.mode==="bot"){
    endCheck();
  }else{
    endCheck();
  }

  if(g.history().length===L){
    snd(sk);clrDraw();
    render(animObj);
    if(S.mode==="bot"&&!S.over)triggerBotMove();
  }else{
    render();
    shakeSq(f);
  }
}

function recordPz(ok){
  const p=PZ[S.pi],z=P.pz;
  if(ok&&S.tried)return;
  z.a++;z.cat[p.c]=z.cat[p.c]||{a:0,s:0};z.cat[p.c].a++;
  if(ok&&!S.tried){z.s++;z.cat[p.c].s++;z.st++;z.r+=12;z.ok[S.pi]=1}
  else{z.st=0;z.r=Math.max(400,z.r-8)}
  S.tried=true;save();
}

function endCheck(){
  const g=S.g;let r="",res=null;
  if(g.in_checkmate()){const wn=g.turn()==="w"?"b":"w";r="Checkmate — "+(wn==="w"?"White":"Black")+" wins";res=wn===S.col?"w":"l"}
  else if(g.in_stalemate()){r="Stalemate — draw";res="d"}
  else if(g.in_threefold_repetition()){r="Draw by repetition";res="d"}
  else if(g.insufficient_material()){r="Draw — insufficient material";res="d"}
  else if(g.in_draw()){r="Draw — 50-move rule";res="d"}
  if(r){
    S.over=r;
    if(S.mode==="bot"&&res){P.g[res]++;save()}
  }
  return !!r;
}

function undo(){
  if(S.busy)cancelAI();
  S.pp=null;
  const g=S.g;
  if(!g.history().length)return;
  let n=(S.mode==="bot"&&g.turn()===S.col&&g.history().length>=2)?2:1;
  S.over="";
  let lastAnim=null,undone=0;
  while(n--&&g.history().length){
    const m=g.undo();S.redo.push(m);
    lastAnim={m,rev:true};undone++;
  }
  S.solved=false;S.sel=null;S.legal=[];S.hint=null;S.hm="";S.bad=false;
  if(S.mode==="learn")S.msg=cur().tx;
  else if(S.mode==="puz")S.msg=PZ[S.pi].t;
  else S.msg="";
  clrDraw();
  const h=g.history({verbose:true}).pop();
  S.last=h?[h.from,h.to]:null;
  S.ex=h?explain(h,g):"";
  SND.click();
  render(undone===1?lastAnim:null);
}

function redo(){
  if(S.busy)cancelAI();
  const g=S.g,o=S.redo.pop();if(!o)return;
  const m=g.move({from:o.from,to:o.to,promotion:o.promotion||"q"});
  if(!m)return;
  let lastM=m,redone=1;
  if(S.mode==="bot"&&!g.game_over()&&g.turn()!==S.col&&S.redo.length){
    const o2=S.redo.pop();
    const m2=g.move({from:o2.from,to:o2.to,promotion:o2.promotion||"q"});
    if(m2){lastM=m2;redone++}
  }
  S.last=[lastM.from,lastM.to];
  S.ex=explain(lastM,g);
  if(S.mode==="learn"||S.mode==="puz")S.solved=true;
  endCheck();
  snd(kind(lastM,g));clrDraw();
  render(redone===1?{m:lastM}:null);
  if(S.mode==="bot"&&!S.over&&g.turn()!==S.col)triggerBotMove();
}

function hint(){
  SND.click();
  if(S.mode==="basic"||S.mode==="bot"){
    if(S.over||S.busy)return;
    const fen=S.g.fen();
    const w=ensureWorker();
    const showHint=uci=>{
      if(S.g.fen()!==fen||!uci)return;
      const ms=S.g.moves({verbose:true});
      const o=ms.find(m=>(m.from+m.to+(m.promotion||""))===uci);
      if(!o)return;
      S.hint=[o.from,o.to];
      S.hm=`Suggested move: ${o.san} (${N[o.piece]} to ${o.to}).`;
      S.h=3;
      renderUIOnly();
    };
    if(w){
      const id=++S.tok;
      const onMsg=e=>{if(e.data.id===id){w.removeEventListener("message",onMsg);w.removeEventListener("error",onErr);showHint(e.data.uci)}};
      const onErr=()=>{w.removeEventListener("message",onMsg);aiWorker=null;runFallbackAsync(fen,"hard",showHint)};
      w.addEventListener("message",onMsg);
      w.addEventListener("error",onErr,{once:true});
      w.postMessage({id,fen,diff:"hard"});
    }else runFallbackAsync(fen,"hard",showHint);
    return;
  }
  let b,idea,why;
  if(S.mode==="learn"){const s=cur();b=[s.best.slice(0,2),s.best.slice(2)];idea=s.idea;why=s.why}
  else{
    const p=PZ[S.pi];
    if(p.sol){b=[p.sol.slice(0,2),p.sol.slice(2)];idea="Look for a knight fork attacking two valuable pieces at once.";why=p.why}
    else{const m=mateMove(p.fen);b=[m.from,m.to];idea="Start with checks — which check leaves the king zero escape squares?";why=`${m.san} is checkmate.`}
  }
  S.h=Math.min(4,S.h+1);
  S.hm=["",idea,"Look at the highlighted piece — that’s the one to move.","The highlighted squares show the exact move.","Solution: "+why][S.h];
  S.hint=S.h===2?[b[0]]:S.h>=3?b:null;
  renderUIOnly();
}

/* ---------- Unified 60fps Drag-and-Drop + Tap + Keyboard ---------- */
let bdRect=null;
function cacheBoardRect(){
  const r=bdEl.getBoundingClientRect();
  if(r.width>0)bdRect=r;
}
if(window.ResizeObserver){
  new ResizeObserver(()=>cacheBoardRect()).observe(bdEl);
}
window.addEventListener("resize",cacheBoardRect,{passive:true});

function sqAtClient(x,y){
  const r=bdRect||bdEl.getBoundingClientRect();
  if(!r.width||!r.height)return null;
  const c=Math.floor((x-r.left)/r.width*8),w=Math.floor((y-r.top)/r.height*8);
  if(c<0||c>7||w<0||w>7)return null;
  return "abcdefgh"[S.flip?7-c:c]+(8-(S.flip?7-w:w));
}

function copyText(txt,label){
  try{
    if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt);
    else{const t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}
    S.copied=label+" copied";renderUIOnly();
    setTimeout(()=>{if(S.copied===label+" copied"){S.copied="";renderUIOnly()}},1500);
  }catch(e){}
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,d=b.dataset;
  if(a==="vol")return;
  SND.click();
  if(a==="toggle-menu"){S.menuOpen=!S.menuOpen;renderUIOnly()}
  else if(a==="tab"){S.tab=d.v;S.menuOpen=false;renderUIOnly();if(S.tab==="play")requestAnimationFrame(cacheBoardRect)}
  else if(a==="go-me"){S.tab="me";S.menuOpen=false;renderUIOnly()}
  else if(a==="mode-basic"){S.menuOpen=false;startBasic()}
  else if(a==="mode-bot"){S.menuOpen=false;S.colorModalOpen=true;renderUIOnly()}
  else if(a==="bot-col"){startBot(d.c)}
  else if(a==="close-color"){S.colorModalOpen=false;renderUIOnly()}
  else if(a==="diff"){P.diff=d.v;save();renderUIOnly()}
  else if(a==="beg"){P.beg=d.v==="1";save();renderUIOnly()}
  else if(a==="mute"){P.mute=!P.mute;save();renderUIOnly()}
  else if(a==="flip"){S.flip=!S.flip;render()}
  else if(a==="undo")undo();
  else if(a==="redo")redo();
  else if(a==="hint")hint();
  else if(a==="restart")restartCurrent();
  else if(a==="drawer"){S.drawerOpen=!S.drawerOpen;renderUIOnly()}
  else if(a==="close-drawer"){S.drawerOpen=false;renderUIOnly()}
  else if(a==="lesson"){startLesson(+d.i,0)}
  else if(a==="puzzle"){startPuzzle(+d.i)}
  else if(a==="next"){if(S.si<LS[S.li].s.length-1)S.si++;else{S.li=(S.li+1)%LS.length;S.si=0}startLesson()}
  else if(a==="npz"){S.pi=(S.pi+1)%PZ.length;startPuzzle()}
  else if(a==="ppz"){S.pi=Math.max(0,S.pi-1);startPuzzle()}
  else if(a==="pro"){const p=S.pp;S.pp=null;if(p)doMove(p.f,p.t,d.p)}
  else if(a==="pcancel"){if(performance.now()-S.ppAt<250)return;S.pp=null;renderUIOnly()}
  else if(a==="dm"){S.dm=!S.dm;S.ds=null;renderUIOnly()}
  else if(a==="dc"){S.dc=d.c;S.ds=null;renderUIOnly()}
  else if(a==="cd"){S.dr={a:[],h:{}};S.ds=null;ov();renderUIOnly()}
  else if(a==="set"){if(d.k==="spd")P.fx.spd=+d.v;else P.fx[d.k]=!P.fx[d.k];save();renderUIOnly()}
  else if(a==="theme"){P.theme=d.v;save();applyTheme();renderUIOnly()}
  else if(a==="cpfen")copyText(S.g.fen(),"FEN");
  else if(a==="cppgn")copyText(S.g.pgn(),"PGN");
});

$("#menu-backdrop").addEventListener("click",()=>{S.menuOpen=false;renderUIOnly()});
$("#drawer-bg").addEventListener("click",()=>{S.drawerOpen=false;renderUIOnly()});
$("#color-bg").addEventListener("click",e=>{if(e.target.id==="color-bg"){S.colorModalOpen=false;renderUIOnly()}});

bdEl.addEventListener("contextmenu",e=>e.preventDefault());
let drag=null,rc=null,dragRaf=0,dragLastX=0,dragLastY=0;

function flushDragFrame(){
  dragRaf=0;
  if(!drag||!drag.moved||!drag.el||!bdRect)return;
  const r=bdRect;
  const dx=Math.max(-r.width*0.06,Math.min(r.width*0.94,dragLastX-r.left-r.width/16));
  const dy=Math.max(-r.height*0.06,Math.min(r.height*0.94,dragLastY-r.top-r.height/16));
  drag.el.style.transform=`translate3d(${dx}px,${dy}px,0) scale(1.18)`;
}

function endDragCleanup(){
  if(dragRaf){cancelAnimationFrame(dragRaf);dragRaf=0}
  if(drag&&drag.el){
    drag.el.classList.remove("dragging");
    const[x,y]=pxCoord(drag.sq);
    placePiece(drag.el,x,y,false);
  }
  drag=null;
}

bdEl.addEventListener("pointerdown",e=>{
  if(e.button===2){
    e.preventDefault();cacheBoardRect();
    rc={s:sqAtClient(e.clientX,e.clientY),c:e.shiftKey?"red":e.ctrlKey?"yellow":e.altKey?"blue":"green"};
    return;
  }
  if(e.button!==0||S.pp||S.menuOpen||S.drawerOpen||S.colorModalOpen)return;
  cacheBoardRect();
  const sq=sqAtClient(e.clientX,e.clientY);if(!sq)return;
  if(S.dm){
    drag={mode:"draw",sq,x:e.clientX,y:e.clientY,moved:false,id:e.pointerId};
    bdEl.setPointerCapture?.(e.pointerId);
    return;
  }
  if(!sideOK())return;
  if(S.sel&&S.legal.includes(sq)){
    S.dr={a:[],h:{}};ov();
    needPromo(S.sel,sq)?askPromo(S.sel,sq):doMove(S.sel,sq);
    return;
  }
  const p=S.g.get(sq);
  const canDrag=!!(p&&p.color===S.g.turn()&&(S.mode!=="bot"||p.color===S.col));
  if(canDrag){
    const wasSel=S.sel===sq;
    if(!wasSel){
      S.sel=sq;
      S.legal=S.g.moves({square:sq,verbose:true}).map(m=>m.to);
      S.hint=null;S.dr={a:[],h:{}};ov();
      syncGridHighlights();
      SND.click();
    }
    drag={mode:"piece",sq,x:e.clientX,y:e.clientY,moved:false,canDrag:true,wasSel,el:PE[sq],id:e.pointerId};
    bdEl.setPointerCapture?.(e.pointerId);
  }else{
    if(S.sel&&p){
      S.msg="Illegal move for that piece — tap one of the dot indicators.";
      S.bad=true;
      shakeSq(S.sel);
      SND.err();
      S.sel=null;S.legal=[];
      renderUIOnly();
    }else if(S.sel){
      S.sel=null;S.legal=[];S.dr={a:[],h:{}};ov();
      syncGridHighlights();
    }else if(S.dr.a.length||Object.keys(S.dr.h).length){
      S.dr={a:[],h:{}};ov();
    }
  }
});

document.addEventListener("pointermove",e=>{
  if(rc){const t=sqAtClient(e.clientX,e.clientY);S.pv=rc.s&&t?[rc.s,t,rc.c]:null;ov();return}
  if(!drag||e.pointerId!==drag.id)return;
  const dist=Math.hypot(e.clientX-drag.x,e.clientY-drag.y);
  if(drag.mode==="draw"){
    if(dist>8)drag.moved=true;
    if(drag.moved){const t=sqAtClient(e.clientX,e.clientY);S.pv=t?[drag.sq,t,S.dc]:null;ov()}
    return;
  }
  if(!drag.canDrag||!drag.el)return;
  if(!drag.moved&&dist>6){
    drag.moved=true;
    drag.el.classList.add("dragging");
  }
  if(drag.moved){
    dragLastX=e.clientX;dragLastY=e.clientY;
    if(!dragRaf)dragRaf=requestAnimationFrame(flushDragFrame);
  }
});

function handlePointerFinish(e,cancelled){
  if(e.button===2&&rc){
    const t=cancelled?null:sqAtClient(e.clientX,e.clientY);
    if(rc.s&&t)draw(rc.s,t,rc.c);
    rc=null;S.pv=null;ov();return;
  }
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;
  if(dragRaf){cancelAnimationFrame(dragRaf);dragRaf=0}
  if(d.el)d.el.classList.remove("dragging");
  drag=null;S.pv=null;
  if(cancelled){
    if(d.el){const[x,y]=pxCoord(d.sq);placePiece(d.el,x,y,false)}
    S.sel=null;S.legal=[];syncGridHighlights();ov();return;
  }
  const target=sqAtClient(e.clientX,e.clientY);
  if(d.mode==="draw"){
    if(d.moved&&target){S.ds=null;draw(d.sq,target,S.dc)}
    else drawTap(d.sq);
    return;
  }
  if(d.moved){
    if(target&&target!==d.sq&&S.legal.includes(target)){
      if(needPromo(d.sq,target)){
        const[x,y]=pxCoord(d.sq);if(d.el)placePiece(d.el,x,y,false);
        askPromo(d.sq,target);
      }else{
        doMove(d.sq,target);
      }
    }else{
      if(d.el){const[x,y]=pxCoord(d.sq);placePiece(d.el,x,y,false)}
      if(target&&target!==d.sq&&S.g.get(target)){
        S.msg="Illegal move for that piece — tap one of the dot indicators.";
        S.bad=true;shakeSq(d.sq);SND.err();
      }
      S.sel=null;S.legal=[];renderUIOnly();
    }
  }else if(d.wasSel){
    S.sel=null;S.legal=[];syncGridHighlights();
  }
}

document.addEventListener("pointerup",e=>handlePointerFinish(e,false));
document.addEventListener("pointercancel",e=>handlePointerFinish(e,true));
window.addEventListener("blur",endDragCleanup);

document.addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==="Escape"){
    if(S.colorModalOpen){S.colorModalOpen=false;renderUIOnly()}
    else if(S.menuOpen){S.menuOpen=false;renderUIOnly()}
    else if(S.drawerOpen){S.drawerOpen=false;renderUIOnly()}
    else if(S.pp){S.pp=null;renderUIOnly()}
    else{S.dr={a:[],h:{}};S.ds=null;ov()}
  }else if(e.key==="f"||e.key==="F"){S.flip=!S.flip;render()}
  else if(e.key==="ArrowLeft")undo();
  else if(e.key==="ArrowRight")redo();
});

document.addEventListener("input",e=>{
  if(e.target.dataset.a==="vol"){
    P.vol=+e.target.value;save();
    const vv=$("#volv");if(vv)vv.textContent=Math.round(P.vol*100)+"%";
    tone(440,.05);
  }
});

render();
})();
</script>
</body>
</html>
