}

function pxCoord(sq){
  const f=sq.charCodeAt(0)-97,r=+sq[1]-1;
  return[S.flip?7-f:f,S.flip?r:7-r];
}
function xySvg(sq){
  const f=sq.charCodeAt(0)-97,r=+sq[1]-1;
  return[(S.flip?7-f:f)*10+5,(S.flip?r:7-r)*10+5];
}
function clearMoveAnim(el){
  if(!el)return;
  if(el._mvTimer){clearTimeout(el._mvTimer);el._mvTimer=0}
  if(el._mvEnd){el.removeEventListener?.("transitionend",el._mvEnd);el._mvEnd=null}
  el.classList.remove("moving","settle");
  el.style.transitionDuration="";
}
function placePiece(el,x,y,mode,distSq){
  if(!el)return;
  clearMoveAnim(el);
  const nextTf=`translate3d(${x*100}%,${y*100}%,0)`;
  const baseMs=dur();
  if(mode===true||!baseMs){
    el.classList.add("snap");
    el.style.transform=nextTf;
    void el.offsetWidth;
    el.classList.remove("snap");
    return;
  }
  if(el.style.transform===nextTf)return;
  if(el.classList.contains("snap")){
    void el.offsetWidth;
    el.classList.remove("snap");
  }
  if(typeof window!=="undefined"&&typeof window.getComputedStyle==="function"){
    try{void window.getComputedStyle(el).transform}catch(e){}
  }
  void el.offsetWidth;
  if(mode==="settle"){
    el.classList.add("settle");
    el.style.transform=nextTf;
    const done=()=>{clearMoveAnim(el)};
    el._mvEnd=e=>{if(!e||e.propertyName==="transform")done()};
    el.addEventListener?.("transitionend",el._mvEnd);
    el._mvTimer=setTimeout(done,120);
    return;
  }
  const ms=distSq?Math.min(baseMs+95,baseMs+Math.round(distSq*14)):baseMs;
  el.classList.add("moving");
  el.style.transitionDuration=ms+"ms";
  el.style.transform=nextTf;
  const done=()=>{clearMoveAnim(el)};
  el._mvEnd=e=>{if(!e||e.propertyName==="transform")done()};
  el.addEventListener?.("transitionend",el._mvEnd);
  el._mvTimer=setTimeout(done,ms+60);
}

function buildGridIfNeeded(){
  if(gridBuiltFlip===S.flip)return;
  gridBuiltFlip=S.flip;
  const frag=document.createDocumentFragment();
  for(const k in sqMap)delete sqMap[k];
  const mkCoord=(cls,txt)=>{
    const sp=document.createElement("span");
    sp.className="coord "+cls;
    sp.textContent=txt;
    sp.setAttribute("aria-hidden","true");
    return sp;
  };
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const rr=S.flip?7-r:r,cc=S.flip?7-c:c,sq="abcdefgh"[cc]+(8-rr);
    const el=document.createElement("div");
    el.className=((rr+cc)%2?"sq d":"sq l");
    el.dataset.sq=sq;
    const rankTxt=String(8-rr),fileTxt="abcdefgh"[cc];
    if(c===0)el.appendChild(mkCoord("coord-r",rankTxt));
    if(r===7)el.appendChild(mkCoord("coord-f",fileTxt));
    if(c===7)el.appendChild(mkCoord("coord-ro",rankTxt));
    if(r===0)el.appendChild(mkCoord("coord-fo",fileTxt));
    const ind=document.createElement("span");
    ind.className="ind";
    ind.setAttribute("aria-hidden","true");
    el.appendChild(ind);
    sqMap[sq]=el;
    frag.appendChild(el);
  }
  bdEl.textContent="";
  bdEl.appendChild(frag);
}

function findKingSq(g,color){
  const bd=g.board();
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p=bd[r][c];
    if(p&&p.type==="k"&&p.color===color)return"abcdefgh"[c]+(8-r);
  }
  return null;
}

function syncGridHighlights(){
  buildGridIfNeeded();
  const g=S.g;
  const inChk=g.in_check();
  const inMate=g.in_checkmate();
  const ckSq=(inChk||S.chkWarn)?findKingSq(g,g.turn()):null;
  const legalSet=S.legal.length?new Set(S.legal):null;
  for(const sq in sqMap){
    const el=sqMap[sq];
    const isLast=P.fx.hl&&S.last&&(S.last[0]===sq||S.last[1]===sq);
    const isSel=P.fx.hl&&S.sel===sq;
    const isChk=inChk&&sq===ckSq;
    const isWarn=S.chkWarn&&sq===ckSq;
    const isMateKing=inMate&&sq===ckSq;
    const isH1=S.hint&&S.hint[0]===sq;
    const isH2=S.hint&&S.hint.length>1&&S.hint[1]===sq;
    const isMv=legalSet&&legalSet.has(sq);
    const hasPiece=isMv&&!!PE[sq];
    const mask=(isLast?1:0)|(isSel?2:0)|(isChk?4:0)|(isWarn?8:0)|(isMateKing?16:0)|(isH1?32:0)|(isH2?64:0)|((isMv&&!hasPiece)?128:0)|((isMv&&hasPiece)?256:0);
    if(el._cm===mask)continue;
    el._cm=mask;
    el.classList.toggle("last",!!isLast);
    el.classList.toggle("sel",!!isSel);
    el.classList.toggle("chk",!!isChk);
    el.classList.toggle("chk-warn",!!isWarn);
    el.classList.toggle("mate-king",!!isMateKing);
    el.classList.toggle("h1",!!isH1);
    el.classList.toggle("h2",!!isH2);
    el.classList.toggle("mv",!!(isMv&&!hasPiece));
    el.classList.toggle("cap",!!(isMv&&hasPiece));
  }
}

function makePieceEl(type,color,sq){
  const el=document.createElement("div");
  el.className="pp"+(isFaceOppPiece(color)?" face-rot":"");
  el.dataset.pc=color+type;
  el.innerHTML=pieceUse(type,color);
  const[x,y]=pxCoord(sq);
  placePiece(el,x,y,true);
  plEl.appendChild(el);
  return el;
}

const _fxTimers=new Set();
function clearCaptureShatters(){
  for(const tid of _fxTimers)clearTimeout(tid);
  _fxTimers.clear();
  if(plEl){
    for(const node of [...plEl.children]){
      if(node.classList&&node.classList.contains("cap-shatter"))node.remove();
    }
  }
}
function spawnCaptureShatter(sq,victimColor){
  if(!plEl||!P.fx.cap||P.fx.rm||dur()<=0)return;
  const[x,y]=pxCoord(sq);
  const host=document.createElement("div");
  host.className="cap-shatter";
  host.style.transform=`translate3d(${x*100}%,${y*100}%,0)`;
  const isW=victimColor==="w";
  host.style.setProperty("--sh-c",isW?"#fcfaf5":"#292825");
  host.style.setProperty("--sh-b",isW?"#1b1a18":"#ece8de");
  host.style.setProperty("--sh-ring",isW?"rgba(255,215,90,.92)":"rgba(147,189,94,.92)");
  const ring=document.createElement("span");
  ring.className="sh-ring";
  host.appendChild(ring);
  const angles=[-2.8,-2.1,-1.4,-0.7,0.1,0.8,1.5,2.2,2.9];
  for(let i=0;i<angles.length;i++){
    const bit=document.createElement("span");
    bit.className="sh-bit";
    const a=angles[i]+(Math.random()-.5)*.38;
    const dist=16+Math.round(Math.random()*18);
    const sz=4+((i%3)*2);
    bit.style.setProperty("--dx",Math.round(Math.cos(a)*dist)+"px");
    bit.style.setProperty("--dy",Math.round(Math.sin(a)*dist)+"px");
    bit.style.setProperty("--rot",((i%2?1:-1)*(70+Math.round(Math.random()*140)))+"deg");
    bit.style.setProperty("--sz",sz+"px");
    bit.style.setProperty("--br",i%2===0?"1px":"50%");
    host.appendChild(bit);
  }
  plEl.appendChild(host);
  const tid=setTimeout(()=>{
    _fxTimers.delete(tid);
    host.remove();
  },620);
  _fxTimers.add(tid);
}

function syncPieces(anim){
  const g=S.g,fen=g.fen(),isFace=isFaceToFaceMode();
  document.documentElement.style.setProperty("--p-ms",dur()+"ms");
  const fullRebuild=renderedFlip!==S.flip||renderedFace!==isFace||!anim;
  if(renderedFen===fen&&renderedFlip===S.flip&&renderedFace===isFace){
    updateCheckClass();
    return;
  }

  // Fast incremental move update (keeps all stationary pieces untouched!)
  if(!fullRebuild&&anim&&anim.m){
    const m=anim.m,rev=!!anim.rev,instant=!!anim.instant,settle=!!anim.settle;
    const fs=rev?m.to:m.from,ts=rev?m.from:m.to;
    const moving=PE[fs];
    if(moving){
      if(!rev&&m.captured){
        const capSq=m.flags.includes("e")?(m.to[0]+m.from[1]):m.to;
        const victim=PE[capSq];
        const capCol=m.capturedColor||(m.color==="w"?"b":"w");
        if(victim){
          delete PE[capSq];
          if(P.fx.cap&&dur()>0){
            spawnCaptureShatter(capSq,capCol);
            void victim.offsetWidth;
            victim.classList.add("captured");
            const vtid=setTimeout(()=>{_fxTimers.delete(vtid);victim.remove()},200);
            _fxTimers.add(vtid);
          }else victim.remove();
        }
      }
      delete PE[fs];
      PE[ts]=moving;
      if(!rev&&m.promotion){
        moving.dataset.pc=m.color+m.promotion;
        moving.innerHTML=pieceUse(m.promotion,m.color);
      }else if(rev&&m.promotion){
        moving.dataset.pc=m.color+"p";
        moving.innerHTML=pieceUse("p",m.color);
      }
      moving.classList.toggle("face-rot",isFaceOppPiece(m.color));
      const[tx,ty]=pxCoord(ts);
      const fc=fs.charCodeAt(0)-97,fr=+fs[1]-1,tc=ts.charCodeAt(0)-97,tr=+ts[1]-1;
      const distSq=Math.hypot(tc-fc,tr-fr);
      placePiece(moving,tx,ty,settle?"settle":instant,distSq);

      // Castling rook glide
      if(m.piece==="k"&&/[kq]/.test(m.flags)){
        const ks=m.flags.includes("k"),rk=m.from[1];
        const rf=rev?(ks?"f":"d")+rk:(ks?"h":"a")+rk;
        const rt=rev?(ks?"h":"a")+rk:(ks?"f":"d")+rk;
        const rook=PE[rf];
        if(rook){
          delete PE[rf];PE[rt]=rook;
          const[rx,ry]=pxCoord(rt);
          const rDist=Math.abs((rt.charCodeAt(0)-97)-(rf.charCodeAt(0)-97));
          placePiece(rook,rx,ry,false,rDist);
        }
      }

      // Restore captured piece on undo
      if(rev&&m.captured){
        const capSq=m.flags.includes("e")?(m.to[0]+m.from[1]):m.to;
        const restored=makePieceEl(m.captured,m.color==="w"?"b":"w",capSq);
        if(dur()>0){
          restored.style.opacity="0";
          restored.style.transition="opacity 150ms ease";
          void restored.offsetWidth;
          restored.style.opacity="1";
        }
        PE[capSq]=restored;
      }

      updateCheckClass();
      renderedFen=fen;
      renderedFlip=S.flip;
      renderedFace=isFace;
      return;
    }
  }

  // Full board sync (only on reset / flip / mode switch / initial load)
  plEl.textContent="";
  for(const k in PE)delete PE[k];
  const frag=document.createDocumentFragment();
  const bd=g.board();
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p=bd[r][c];if(!p)continue;
    const sq="abcdefgh"[c]+(8-r);
    const el=document.createElement("div");
    el.className="pp"+(isFaceOppPiece(p.color)?" face-rot":"");
    el.dataset.pc=p.color+p.type;
    el.innerHTML=pieceUse(p.type,p.color);
    const[x,y]=pxCoord(sq);
    el.style.transform=`translate3d(${x*100}%,${y*100}%,0)`;
    PE[sq]=el;
    frag.appendChild(el);
  }
  plEl.appendChild(frag);
  updateCheckClass();
  renderedFen=fen;
  renderedFlip=S.flip;
  renderedFace=isFace;
}

function updateCheckClass(){
  const g=S.g,inChk=g.in_check(),inMate=g.in_checkmate(),turn=g.turn();
  const tk=turn+"k";
  for(const sq in PE){
    const el=PE[sq];
    const isTargetKing=el.dataset.pc===tk;
    const chk=inChk&&isTargetKing,mk=inMate&&isTargetKing;
    if(el._chk!==chk){el._chk=chk;el.classList.toggle("chk",chk)}
    if(el._mk!==mk){el._mk=mk;el.classList.toggle("mate-king",mk)}
  }
}

/* ---------- Drawing Overlay & Dynamic Clear Sync ---------- */
let _ovCache="",_ovRaf=0;
function scheduleOv(){
  if(_ovRaf)return;
  _ovRaf=requestAnimationFrame(()=>{_ovRaf=0;ov()});
}
function ov(){
  const e=$("#ov");if(!e)return;
  let h="";const D=S.dr;
  if(P.fx.hl){
    for(const[s,c]of Object.entries(D.h)){
      const[x,y]=xySvg(s);
      h+=`<rect x="${x-5}" y="${y-5}" width="10" height="10" fill="${DC[c]}" opacity=".5"/>`;
    }
    if(S.ds){
      const[x,y]=xySvg(S.ds);
      h+=`<circle cx="${x}" cy="${y}" r="4.2" fill="none" stroke="${DC[S.dc]}" stroke-width=".85" stroke-dasharray="1.6 1.2"/>`;
    }
  }
  if(P.fx.arr||S.mode==="coach"||S.hintArrow||S.replay){
    const L=P.fx.arr?[...D.a]:[];
    if(P.fx.arr&&S.pv&&S.pv[0]!==S.pv[1])L.push({a:S.pv[0],b:S.pv[1],c:S.pv[2],pv:1});
    if(S.mode==="coach"&&S.coachArrows.length)for(const a of S.coachArrows)L.push(a);
    if(S.hintArrow&&(S.mode==="basic"||S.mode==="bot"||S.mode==="sandbox"))L.push(S.hintArrow);
    if(S.replay){
      const curF=S.replay.frames[S.replay.idx];
      if(curF&&curF.event&&curF.event.arrow)L.push(curF.event.arrow);
    }
    for(const r of L){
      const col=DC[r.c]||r.c;
      const[x1,y1]=xySvg(r.a),[x2,y2]=xySvg(r.b),dx=x2-x1,dy=y2-y1,kn=Math.abs(dx*dy)===200;
      const[cx,cy]=kn?(Math.abs(dx)>Math.abs(dy)?[x2,y1]:[x1,y2]):[x1,y1];
      const l=Math.hypot(x2-cx,y2-cy);if(!l)continue;
      const ux=(x2-cx)/l,uy=(y2-cy)/l,bx=x2-ux*3.4,by=y2-uy*3.4;
      h+=`<g fill="${col}" stroke="${col}" opacity="${r.pv?.55:(r.hint?.92:(r.coach?.82:.86))}"><polyline points="${x1},${y1} ${cx},${cy} ${bx},${by}" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><polygon stroke="none" points="${x2},${y2} ${bx-uy*2.3},${by+ux*2.3} ${bx+uy*2.3},${by-ux*2.3}"/></g>`;
    }
  }
  if(h===_ovCache)return;
  _ovCache=h;
  e.innerHTML=h;
}
function renderDrawBar(){
  const db=$("#draw-bar");
  if(!db)return;
  db.hidden=!S.dm;
  if(!S.dm)return;
  const showClr=hasDrawMarks();
  db.innerHTML=
    `<div class="sw-row">${["green","red","blue","yellow"].map(k=>`<button data-a="dc" data-c="${k}" class="sw" aria-label="Draw ${k}" style="background:${DC[k]};${S.dc===k?"outline:2.5px solid var(--tx);outline-offset:2px":""}"></button>`).join("")}</div>`+
    `<div class="draw-acts">`+
      `<button data-a="cd" ${showClr?"":"hidden"}>${t("clear")}</button>`+
      `<button data-a="dm" class="pri">${t("done")}</button>`+
    `</div>`;
}
function draw(a,b,c){
  const D=S.dr;
  if(a===b){
    if(!P.fx.hl)return;
    D.h[a]===c?delete D.h[a]:D.h[a]=c;
  }else{
    if(!P.fx.arr)return;
    const i=D.a.findIndex(r=>r.a===a&&r.b===b);
    if(i>=0){const same=D.a[i].c===c;D.a.splice(i,1);if(!same)D.a.push({a,b,c})}
    else D.a.push({a,b,c});
  }
  ov();
  renderDrawBar();
}
function drawTap(sq){
  if(!S.ds){S.ds=sq;SND.click()}
  else{draw(S.ds,sq,S.dc);S.ds=null}
  ov();
  renderDrawBar();
}

  S.redo=[];S.solved=false;
  S.pzStep=0;S.pzBusy=false;
  S.bad=false;S.msgSpec=null;S.ex="";S.exSpec=null;S.tried=false;S.over="";S.overSpec=null;

  S.coachTrapPending=null;S.coachTrapArmed=null;
}
function computeCapturedState(){
  if(S.replay&&S.replay.frames[S.replay.idx]){
    const rc=S.replay.frames[S.replay.idx].caps;
    if(rc)return rc;
  }
  const hist=S.g&&typeof S.g.history==="function"?S.g.history({verbose:true}):[];
  const hasVerbose=Array.isArray(hist)&&hist.length>0&&typeof hist[0]==="object";
  if(!hasVerbose&&S.restoredCaps){
    return{
      w:Array.isArray(S.restoredCaps.w)?S.restoredCaps.w:[],
      b:Array.isArray(S.restoredCaps.b)?S.restoredCaps.b:[],
      lastGlobalPly:typeof S.restoredCaps.lastGlobalPly==="number"?S.restoredCaps.lastGlobalPly:-1
    };
  }
  const byCapturer={w:[],b:[]};
  let lastGlobalPly=-1;
  if(hasVerbose){
    for(let i=0;i<hist.length;i++){
      const m=hist[i];
      if(m&&m.captured){
        const capCol=m.capturedColor||(m.color==="w"?"b":"w");
        const side=m.color==="b"?"b":"w";
        byCapturer[side].push({type:m.captured,color:capCol,ply:i});
        lastGlobalPly=i;
      }
    }
  }
  return{w:byCapturer.w,b:byCapturer.b,lastGlobalPly};
}
function saveMatchState(){
  try{
    if(!S.g||S.replay)return;
    if(S.mode!=="basic"&&S.mode!=="bot"&&S.mode!=="coach"&&S.mode!=="sandbox")return;
    const payload={
      v:1,
      mode:S.mode,
      fen:S.g.fen(),
      turn:S.g.turn(),
      pgn:typeof S.g.pgn==="function"?S.g.pgn():"",
      caps:computeCapturedState(),
      col:S.col,
      basicP2:S.basicP2,

      diff:P.diff,
      last:S.last,
      over:S.over,

function restoreMatchState(){
  try{
    const raw=localStorage.getItem(MATCH_KEY);
    if(!raw)return false;
    const d=JSON.parse(raw);
    if(!d||!d.mode||!d.fen)return false;
    S.restoredCaps=d.caps&&typeof d.caps==="object"?d.caps:null;
    if(d.mode==="sandbox"&&Array.isArray(d.sbBoard)&&d.sbBoard.length===8){
      S.mode="sandbox";
      S.sbCfg.rules=cloneSbRules(d.sbRules||defaultSbRules());
      S.sbCfg.opp="same";
      S.col="w";
      const fp=String(d.fen).split(" ");
      S.g=createSandboxGame(d.sbBoard,S.sbCfg.rules,{turn:d.turn||fp[1],ep:fp[3],half:fp[4],full:fp[5]});
      S.flip=false;
    }else if(d.mode==="basic"||d.mode==="bot"||d.mode==="coach"){
      const g=new Chess();
      let loaded=false;
      if(d.pgn&&typeof g.load_pgn==="function"){
        try{loaded=g.load_pgn(d.pgn)&&g.fen()===d.fen}catch(e){loaded=false}
      }
      if(!loaded){
        const ok=typeof g.load==="function"?g.load(d.fen):false;
        if(!ok){
          const g2=new Chess(d.fen);
          if(!g2||!g2.fen())return false;
          S.g=g2;
        }else S.g=g;
      }else{
        S.g=g;
        S.restoredCaps=null;
      }
      S.mode=d.mode;
      S.col=(d.col==="b"||d.col==="w")?d.col:"w";
      if(d.basicP2==="face"||d.basicP2==="same")S.basicP2=d.basicP2;
      if(d.diff&&VALID_DIFFS.has(d.diff))P.diff=d.diff;
      if(isAutoFlipTurn()){
        S.flip=S.g.turn()==="b";
      }else if(S.mode==="bot"){
        S.flip=S.col==="b";
      }else{
        S.flip=false;
      }
    }else{
      return false;
    }
    S.last=Array.isArray(d.last)&&d.last.length===2?d.last:null;
    S.over=typeof d.over==="string"?d.over:"";
    S.overSpec=d.overSpec||null;
    S.mateWin=d.mateWin||"";
    S.mateReason=d.mateReason||"";
    S.mateModalOpen=false;
    if(d.exSpec&&d.exSpec.m)S.exSpec=d.exSpec;
    if(S.mode==="coach"&&d.coachKey){
      S.coachTone=d.coachTone||"";
      setCoach(d.coachKey,d.coachArgs||null,true);
    }
    refreshTranslatedState();
    return true;
  }catch(e){
    return false;
  }
}

function applySandboxPreset(name){

      if(b[row][c]&&b[row][c].type!=="k")b[row][c]={type:"n",color:b[row][c].color};

    for(let c=0;c<8;c++){b[6][c]={type:"r",color:"w"};b[1][c]={type:"r",color:"b"}}
  }else if(name==="hybrid"){
    r.q.kn=true;r.r.kn=true;r.r.leap=true;r.b.kn=true;r.p.step=true;r.ignoreCheck=true;
  }
  S.sbCfg.board=b;S.sbCfg.rules=r;S.sbCfg.err="";

function sbBulkReplace(target,pieceType){
  const b=S.sbCfg.board,side=S.sbCfg.bulkSide;
  const doW=side==="both"||side==="w",doB=side==="both"||side==="b";
  if(target==="pawns"){
    if(doW)for(let c=0;c<8;c++)b[6][c]={type:pieceType,color:"w"};
    if(doB)for(let c=0;c<8;c++)b[1][c]={type:pieceType,color:"b"};
  }else if(target==="back"){
    const std=["r","n","b","q","k","b","n","r"];
    for(let c=0;c<8;c++){
      if(c===4)continue;
      if(doW)b[7][c]={type:pieceType==="std"?std[c]:pieceType,color:"w"};
      if(doB)b[0][c]={type:pieceType==="std"?std[c]:pieceType,color:"b"};
    }
  }
  S.sbCfg.err="";
  renderUIOnly();
}

/* ---------- Post-Game Replay & Smart Match Analyzer (Local Audio Engine) ---------- */
const RP_CP={p:100,n:320,b:330,r:500,q:900,k:5000};
const RP_PT={p:1,n:3,b:3,r:5,q:9,k:0};
function evalBoardCpW(bd){
  let s=0;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const x=bd[r][c];if(!x)continue;
    let v=RP_CP[x.type]||0;
    if(x.type==="p")v+=(x.color==="w"?6-r:r-1)*6;
    if(c>1&&c<6&&r>1&&r<6&&"pnb".includes(x.type))v+=10;
    s+=x.color==="w"?v:-v;
  }
  return s;
}
function cloneAnalyzerGame(frame){
  if(frame.sbSnap){
    return createSandboxGame(frame.sbSnap.bd,frame.sbRules,{turn:frame.sbSnap.turn,ep:frame.sbSnap.ep,half:frame.sbSnap.half,full:frame.sbSnap.full});
  }
  return new Chess(frame.fen);
}
function captureRecaptureNet(g,m){
  const capVal=m.captured?(RP_CP[m.captured]||0):0;
  const moverVal=RP_CP[m.piece]||0;
  const res=g.move({from:m.from,to:m.to,promotion:m.promotion||"q"});
  if(!res)return 0;
  let oppBestGain=0;
  if(g.in_checkmate&&g.in_checkmate()){g.undo();return -9000}
  const oppCaps=g.moves({verbose:true}).filter(om=>om.captured&&om.to===m.to);
  if(oppCaps.length){
    let minAtk=Infinity;
    for(const om of oppCaps){const av=RP_CP[om.piece]||0;if(av<minAtk)minAtk=av}
    const r2=g.move({from:oppCaps[0].from,to:oppCaps[0].to,promotion:oppCaps[0].promotion||"q"});
    let reCap=0;
    if(r2){
      const myRe=g.moves({verbose:true}).filter(rm=>rm.captured&&rm.to===m.to);
      if(myRe.length&&minAtk<Infinity)reCap=minAtk;
      g.undo();
    }
    oppBestGain=Math.max(0,moverVal-reCap);
  }
  g.undo();
  return capVal-oppBestGain;
}
function maxHangingLossAfter(frame,side){
  const g=cloneAnalyzerGame(frame);
  if(g.turn()===side)return 0;
  const caps=g.moves({verbose:true}).filter(om=>om.captured);
  let maxLoss=0;
  for(const om of caps){
    const victim=RP_CP[om.captured]||0;
    const atk=RP_CP[om.piece]||0;
    const r=g.move({from:om.from,to:om.to,promotion:om.promotion||"q"});
    if(!r)continue;
    if(g.in_checkmate&&g.in_checkmate()){g.undo();return 5000}
    const defended=g.moves({verbose:true}).some(rm=>rm.captured&&rm.to===om.to);
    g.undo();
    const loss=defended?Math.max(0,victim-atk):victim;
    if(loss>maxLoss)maxLoss=loss;
  }
  return maxLoss;
}
function detectBrilliantQuiet(prevFrame,curFrame,m,plyIdx){
  if(!m||m.captured||curFrame.inMate)return null;
  if(plyIdx<=3&&m.piece==="p")return null;
  // Ensure the quiet move didn't just hang itself uncompensated
  const squareThreat=(()=>{
    const g=cloneAnalyzerGame(curFrame);
    const caps=g.moves({verbose:true}).filter(om=>om.captured&&om.to===m.to);
    if(!caps.length)return 0;
    let minAtk=Infinity;
    for(const om of caps){const av=RP_CP[om.piece]||0;if(av<minAtk)minAtk=av}
    const r=g.move({from:caps[0].from,to:caps[0].to,promotion:caps[0].promotion||"q"});
    if(!r)return 0;
    const re=g.moves({verbose:true}).some(rm=>rm.captured&&rm.to===m.to);
    g.undo();
    const mv=RP_CP[m.piece]||0;
    return re?Math.max(0,mv-minAtk):mv;
  })();

  // Check 1: Quiet Fork (piece attacks >= 2 high-value or undefended enemy pieces from m.to)
  if(m.piece!=="k"){
    const fp=curFrame.fen.split(" ");
    if(!curFrame.sbSnap){
      fp[1]=m.color;fp[3]="-";
      try{
        const gFork=new Chess(fp.join(" "));
        const targets=gFork.moves({verbose:true}).filter(fm=>fm.from===m.to&&fm.captured&&fm.captured!=="p");
        const uniq=new Map();
        for(const tg of targets)if(!uniq.has(tg.to))uniq.set(tg.to,tg.captured);
        let strongTargets=0;
        for(const tp of uniq.values()){
          if((RP_CP[tp]||0)>(RP_CP[m.piece]||0)||(RP_CP[tp]||0)>=500)strongTargets++;
        }
        if(strongTargets>=2||(uniq.size>=2&&squareThreat<=0)){
          return {kind:"brilliant",piece:m.piece,to:m.to,reasonKey:"fork",arrow:{a:m.from,b:m.to,c:"#14b8a6",replay:1}};
        }
      }catch(e){}
    }
  }
  // Check 2: Immediate Mate Threat created quietly
  if(!curFrame.sbSnap&&!curFrame.inCheck){
    const fp=curFrame.fen.split(" ");
    fp[1]=m.color;fp[3]="-";
    try{
      const gMt=new Chess(fp.join(" "));
      const legal=gMt.moves({verbose:true});
      for(const lm of legal){
        gMt.move(lm);
        const mk=gMt.in_checkmate();
        gMt.undo();
        if(mk&&squareThreat<=100){
          return {kind:"brilliant",piece:m.piece,to:m.to,reasonKey:"mateThreat",arrow:{a:m.from,b:m.to,c:"#14b8a6",replay:1}};
        }
      }
    }catch(e){}
  }
  // Check 3: Sharp Quiet Tactical Check setting up winning pressure
  if(curFrame.inCheck&&m.piece!=="p"&&m.piece!=="k"&&plyIdx>=5&&squareThreat<=50){
    const oppHang=maxHangingLossAfter(prevFrame,m.color);
    if(oppHang===0)return {kind:"brilliant",piece:m.piece,to:m.to,reasonKey:"strategy",arrow:{a:m.from,b:m.to,c:"#14b8a6",replay:1}};
  }
  return null;
}
function analyzeReplayFrames(frames){
  const N=frames.length-1;
  const events=new Array(frames.length).fill(null);
  const consumed=new Set();
  if(N<=0)return events;

  // Pass 1: Genius Sacrifices / Gambits / Delayed Rook-Bait Trap / Multi-Piece Exchanges
  for(let i=1;i<=N;i++){
    if(consumed.has(i))continue;
    const m=frames[i].move,side=m.color;
    const sacCp=RP_CP[m.piece]||0,capCp=m.captured?(RP_CP[m.captured]||0):0;
    const isAlienF7=(m.piece==="n"&&(m.to==="f7"||m.to==="f2")&&i<=14);
    const nextM=(i+1<=N)?frames[i+1].move:null;
    const replyM=(i+2<=N)?frames[i+2].move:null;
    const nextRecaptured=!!(nextM&&nextM.captured&&nextM.to===m.to);
    const sacrificedIntoAttack=(sacCp>=300&&(nextRecaptured||isAlienF7)&&capCp<sacCp);
    const sacrificedOnSquare=(sacCp>=300&&nextRecaptured&&capCp<sacCp);

    // Delayed Sacrifice Trap: e.g. places Rook onto sq -> opponent takes -> immediate counter-check/mate/winning strike!
    if(sacCp>=300&&nextRecaptured&&nextM.captured===m.piece&&replyM&&replyM.color===side){
      const counterF=frames[i+2];
      const counterNet=(counterF.evalCpW-frames[i-1].evalCpW)*(side==="w"?1:-1);
      const isCounterTrap=counterF.inMate||counterF.inCheck||(replyM.captured&&(RP_CP[replyM.captured]||0)>=300&&counterNet>=-50);
      if(isCounterTrap){
        events[i]={
          kind:"genius",
          delayedTrap:true,
          sacPiece:m.piece,
          sq:m.to,
          arrow:{a:m.from,b:m.to,c:"#f59e0b",replay:1}
        };
        for(let k=i;k<=Math.min(N,i+2);k++)consumed.add(k);
        continue;
      }
    }

    if(sacrificedIntoAttack||sacrificedOnSquare){
      const won=[],lost=[];
      let bestPayoffIdx=i,payoffNet=0,mateWon=false;
      const maxJ=Math.min(N,i+6);
      for(let j=i;j<=maxJ;j++){
        const mj=frames[j].move;
        if(mj.color===side){
          if(mj.captured)won.push(mj.captured);
          if(frames[j].inMate){mateWon=true;bestPayoffIdx=j;break}
        }else{
          if(mj.captured)lost.push(mj.captured);
        }
        const net=(frames[j].evalCpW-frames[i-1].evalCpW)*(side==="w"?1:-1);
        const majorWon=won.filter(t=>(RP_PT[t]||0)>=3);
        const ptsNet=won.reduce((a,t)=>a+(RP_PT[t]||0),0)-lost.reduce((a,t)=>a+(RP_PT[t]||0),0);
        if(j>=i+2&&(mateWon||(ptsNet>=0&&net>=-20&&(majorWon.length>=2||(won.includes("q")&&net>=0)||net>=220))||(isAlienF7&&net>=80))){
          bestPayoffIdx=j;payoffNet=net;
          if((majorWon.length>=2&&ptsNet>=0)||mateWon)break;
        }
      }
      const wonMajor=won.filter(t=>(RP_PT[t]||0)>=3).sort((a,b)=>(RP_PT[b]||0)-(RP_PT[a]||0));
      const finalPtsNet=won.reduce((a,t)=>a+(RP_PT[t]||0),0)-lost.reduce((a,t)=>a+(RP_PT[t]||0),0);
      if(bestPayoffIdx>i&&(mateWon||(finalPtsNet>=0&&payoffNet>=-20&&(wonMajor.length>=2||payoffNet>=250))||(isAlienF7&&payoffNet>=80))){
        let gambitName="Alien Gambit";
        if(!isAlienF7&&m.piece==="b"&&(m.to==="h7"||m.to==="h2"))gambitName="Greek Gift";
        else if(!isAlienF7&&i<=10)gambitName=(m.piece==="n"?"Stafford Gambit":"Tactical Gambit");
        events[i]={
          kind:"genius",
          sacPiece:m.piece,
          wonPieces:wonMajor.slice(0,2),
          gambitName,
          alien:true,
          arrow:{a:m.from,b:m.to,c:"#f59e0b",replay:1}
        };
        for(let k=i;k<=bestPayoffIdx;k++)consumed.add(k);
      }
    }
  }

  // Pass 2: Fair Trades, Bad Trades (-1 pt), Blunders & Pure Idiot Catastrophes
  for(let i=1;i<=N;i++){
    if(events[i]||consumed.has(i))continue;
    const m=frames[i].move,side=m.color;
    const nextM=(i+1<=N)?frames[i+1].move:null;

    // Multi-ply / reciprocal capture exchange (2..4 consecutive captures)
    if(m.captured&&nextM&&nextM.captured&&!consumed.has(i+1)&&(nextM.to===m.to||nextM.color!==side)){
      let endJ=i+1;
      let wonPts=(RP_PT[m.captured]||0),lostPts=(RP_PT[nextM.captured]||0);
      let firstWon=m.captured,firstLost=nextM.captured;
      for(let k=i+2;k<=Math.min(N,i+3);k++){
        if(consumed.has(k))break;
        const mk=frames[k].move;
        if(!mk.captured)break;
        if(mk.to!==m.to&&mk.to!==frames[k-1].move.to)break;
        endJ=k;
        if(mk.color===side)wonPts+=(RP_PT[mk.captured]||0);
        else lostPts+=(RP_PT[mk.captured]||0);
      }
      const netPts=wonPts-lostPts;
      if(netPts===0&&wonPts>0){
        const endM=frames[endJ].move;
        events[endJ]={kind:"fairTrade",p1:firstWon,p2:firstLost,arrow:{a:endM.from,b:endM.to,c:"#22c55e",replay:1}};
        for(let k=i;k<=endJ;k++)consumed.add(k);
        continue;
      }
      if(netPts===-1){
        events[i]={kind:"badTrade",piece:m.piece,arrow:{a:m.from,b:m.to,c:"#f97316",replay:1}};
        for(let k=i;k<=endJ;k++)consumed.add(k);
        continue;
      }
      if(netPts<=-5){
        events[i]={kind:"pureIdiot",piece:m.piece,sub:"loss",arrow:{a:m.from,b:m.to,c:"#ff1e3c",replay:1}};
        for(let k=i;k<=endJ;k++)consumed.add(k);
        continue;
      }
      if(netPts<=-2){
        events[i]={kind:"blunder",piece:m.piece,sub:"loss",arrow:{a:m.from,b:m.to,c:"#ef4444",replay:1}};
        for(let k=i;k<=endJ;k++)consumed.add(k);
        continue;
      }
    }

    // Check immediate hanging/loss threat created by move m
    if(!frames[i].inMate){
      const prevHang=maxHangingLossAfter(frames[i-1],side);
      const afterHang=maxHangingLossAfter(frames[i],side);
      const capPts=m.captured?(RP_CP[m.captured]||0):0;
      const netGainCp=capPts-afterHang;
      // Blundered straight into mate-in-1 -> Pure Idiot!
      if(nextM&&i+1<=N&&frames[i+1].inMate){
        events[i]={kind:"pureIdiot",piece:m.piece,sub:"mate",arrow:{a:m.from,b:m.to,c:"#ff1e3c",replay:1}};
        consumed.add(i);continue;
      }
      if(m.captured&&afterHang>0){
        if(netGainCp<=-75&&netGainCp>=-170){
          events[i]={kind:"badTrade",piece:m.piece,arrow:{a:m.from,b:m.to,c:"#f97316",replay:1}};
          consumed.add(i);continue;
        }
        if(netGainCp<=-450){
          events[i]={kind:"pureIdiot",piece:m.piece,sub:"loss",arrow:{a:m.from,b:m.to,c:"#ff1e3c",replay:1}};
          consumed.add(i);continue;
        }
        if(netGainCp<=-175){
          events[i]={kind:"blunder",piece:m.piece,sub:"loss",arrow:{a:m.from,b:m.to,c:"#ef4444",replay:1}};
          consumed.add(i);continue;
        }
      }
      if(!m.captured&&(afterHang>=450&&afterHang>prevHang+220)){
        events[i]={kind:"pureIdiot",piece:m.piece,sub:"hang",arrow:{a:m.from,b:m.to,c:"#ff1e3c",replay:1}};
        consumed.add(i);continue;
      }
      if(!m.captured&&(afterHang>=260&&afterHang>prevHang+150)){
        events[i]={kind:"blunder",piece:m.piece,sub:"hang",arrow:{a:m.from,b:m.to,c:"#ef4444",replay:1}};
        consumed.add(i);continue;
      }
    }
  }

  // Pass 3: Brilliant Quiet Moves (Strict Smart Filtering — skip ordinary quiet moves)
  for(let i=1;i<=N;i++){
    if(events[i]||consumed.has(i))continue;
    const br=detectBrilliantQuiet(frames[i-1],frames[i],frames[i].move,i);
    if(br)events[i]=br;
  }
  return events;
}
function formatReplayEvent(ev){
  if(!ev)return null;
  const isId=P.lang==="id";
  if(ev.kind==="genius"){
    const sac=pieceLabelWord(ev.sacPiece);
    if(ev.delayedTrap){
      return{
        cls:"genius",
        badge:t("replayGeniusBadge"),
        text:isId
          ?`Pure Jenius! Kamu sengaja menaruh ${sac} di ${ev.sq} untuk dikorbankan, lalu menjebak balik musuh!`
          :`Pure Genius! You intentionally baited your ${sac} onto ${ev.sq} as a sacrifice, then sprung a brutal counter-trap!`
      };
    }
    const gName=ev.gambitName||"Alien Gambit";
    const hasTwo=Array.isArray(ev.wonPieces)&&ev.wonPieces.length>=2;
    if(hasTwo){
      const w1=pieceLabelWord(ev.wonPieces[0]),w2=pieceLabelWord(ev.wonPieces[1]);
      return{
        cls:"genius",
        badge:t("replayGeniusBadge"),
        text:isId
          ?`Sungguh jenius! Kamu baru saja melakukan ${gName} dengan mengorbankan ${sac} untuk merebut ${w1} dan ${w2} lawan!`
          :`Pure genius! You just pulled off the ${gName} — sacrificing your ${sac} to capture the opponent's ${w1} and ${w2}!`
      };
    }
    return{
      cls:"genius",
      badge:t("replayGeniusBadge"),
      text:isId
        ?`Sungguh jenius! Kamu baru saja melakukan ${gName} dengan mengorbankan ${sac} untuk serangan mematikan!`
        :`Pure genius! You just unleashed the ${gName} by sacrificing your ${sac} for a decisive attack!`
    };
  }
  if(ev.kind==="pureIdiot"){
    const pc=pieceLabelWord(ev.piece);
    const subTxt=ev.sub==="mate"
      ?(isId?`Blunder PURE IDIOT!! Langkah ${pc} ini langsung nyerahin skakmat gratis ke lawan!`:`PURE IDIOT disaster!! Moving that ${pc} hands opponent an instant checkmate!`)
      :(isId?`PURE IDIOT alert!! ${pc} ini blunder fatal dan membuang perwira besar secara cuma-cuma!`:`PURE IDIOT alert!! Moving that ${pc} throws away massive material on a silver platter!`);
    return{
      cls:"pureIdiot",
      badge:t("replayPureIdiotBadge"),
      text:subTxt
    };
  }
  if(ev.kind==="badTrade"){
    return{
      cls:"badTrade",
      badge:t("replayBadTradeBadge"),
      text:isId
        ?"Wah, pertukaran ini salah, kamu minus satu poin!"
        :"Whoa, bad trade here — you are minus one point!"
    };
  }
  if(ev.kind==="blunder"){
    const pc=pieceLabelWord(ev.piece);
    return{
      cls:"blunder",
      badge:t("replayBlunderBadge"),
      text:isId
        ?`Gerakan blunder! ${pc} ini kehilangan keunggulan penting.`
        :`Blunder move! That ${pc} gives away crucial material.`
    };
  }
  if(ev.kind==="fairTrade"){
    const p1=pieceLabelWord(ev.p1),p2=pieceLabelWord(ev.p2);
    return{
      cls:"fairTrade",
      badge:t("replayFairTradeBadge"),
      text:isId
        ?(p1===p2?`Pertukaran poin yang adil (${p1} vs ${p2}).`:`Pertukaran poin yang adil antara ${p1} dan ${p2}.`)
        :`Fair point trade — equal ${p1} for ${p2} exchange.`
    };
  }
  if(ev.kind==="brilliant"){
    const pc=pieceLabelWord(ev.piece),sq=ev.to;
    const reason=isId
      ?(ev.reasonKey==="fork"?"mengancam dua perwira lawan sekaligus":(ev.reasonKey==="mateThreat"?"membuka ancaman skakmat yang mematikan":"menciptakan tekanan strategis yang sangat kuat"))
      :(ev.reasonKey==="fork"?"forks two enemy pieces simultaneously":(ev.reasonKey==="mateThreat"?"creates a deadly checkmate threat":"sets up powerful strategic pressure"));
    return{
      cls:"brilliant",
      badge:t("replayBrilliantBadge"),
      text:isId
        ?`Langkah brilian yang tenang! ${pc} ke ${sq} ${reason}.`
        :`Brilliant quiet move! ${pc} to ${sq} ${reason}.`
    };
  }
  return null;
}
function stopReplayAuto(){
  if(S.replayTimer){clearTimeout(S.replayTimer);S.replayTimer=0}
  if(S.replay)S.replay.playing=false;
}
function enterReplayMode(){
  if(!S.g)return;
  const origMoves=S.g.history({verbose:true});
  if(!origMoves||!origMoves.length)return;
  cancelAI();
  clearCaptureShatters();
  stopReplayAuto();
  S.mateModalOpen=false;S.drawerOpen=false;S.menuOpen=false;
  const orig={
    g:S.g,mode:S.mode,col:S.col,flip:S.flip,last:S.last,
    over:S.over,overSpec:S.overSpec,mateWin:S.mateWin,mateReason:S.mateReason
  };
  let rg;
  const isSb=!!S.g.isSandbox;
  if(isSb){
    const ss=S.g.getStartSnap?S.g.getStartSnap():{bd:S.sbCfg.board,turn:"w",ep:null,half:0,full:1};
    rg=createSandboxGame(ss.bd,S.g.rules,{turn:ss.turn,ep:ss.ep,half:ss.half,full:ss.full});
  }else{
    rg=new Chess();
  }
  const makeSnap=(plyMove,capsState)=>({
    fen:rg.fen(),
    move:plyMove,
    board:rg.board(),
    evalCpW:evalBoardCpW(rg.board()),
    inCheck:rg.in_check(),
    inMate:rg.in_checkmate(),
    isWin:!!(rg.in_checkmate()||(rg.isKingCaptured&&rg.isKingCaptured())||(rg.isNoPieces&&rg.isNoPieces())),
    caps:{w:capsState.w.slice(),b:capsState.b.slice(),lastGlobalPly:capsState.lastGlobalPly},
    sbSnap:isSb?{bd:cloneSbGrid(rg.board()),turn:rg.turn(),ep:null,half:0,full:1}:null,
    sbRules:isSb?S.g.rules:null,
    event:null
  });
  const capsTrack={w:[],b:[],lastGlobalPly:-1};
  const frames=[makeSnap(null,capsTrack)];
  for(let i=0;i<origMoves.length;i++){
    const m=origMoves[i];
    const mv=rg.move({from:m.from,to:m.to,promotion:m.promotion||"q"});
    if(!mv)break;
    if(mv.captured){
      const capCol=mv.capturedColor||(mv.color==="w"?"b":"w");
      const side=mv.color==="b"?"b":"w";
      capsTrack[side].push({type:mv.captured,color:capCol,ply:i});
      capsTrack.lastGlobalPly=i;
    }
    frames.push(makeSnap(mv,capsTrack));
  }
  const events=analyzeReplayFrames(frames);
  const notableIndices=[];
  for(let i=0;i<frames.length;i++){
    frames[i].event=events[i];
    if(events[i])notableIndices.push(i);
  }
  if(S.mode==="basic"&&S.basicP2==="same")S.flip=false;
  S.replay={orig,frames,idx:0,playing:false,notableIndices};
  stepReplay(0,false);
}
function stepReplay(targetIdx,playEventSfx=true){
  if(!S.replay)return;
  const rp=S.replay;
  const prevIdx=rp.idx;
  const nextIdx=Math.max(0,Math.min(rp.frames.length-1,targetIdx));
  rp.idx=nextIdx;
  const f=rp.frames[nextIdx];
  S.g=cloneAnalyzerGame(f);
  S.sel=null;S.legal=[];
  S.last=f.move?[f.move.from,f.move.to]:null;
  S.ex=f.move?buildExplainText(f.move,f.inMate,f.inCheck,""):"";
  let anim=null;
  if(nextIdx===prevIdx+1&&f.move)anim={m:f.move,rev:false};
  else if(nextIdx===prevIdx-1&&rp.frames[prevIdx]&&rp.frames[prevIdx].move)anim={m:rp.frames[prevIdx].move,rev:true};
  render(anim);
  if(playEventSfx&&f){
    if(f.isWin)SND.mate();
    else if(f.event){
      const k=f.event.kind;
      if(k==="genius")SND.rpGenius();
      else if(k==="pureIdiot")SND.rpPureIdiot();
      else if(k==="blunder")SND.rpBlunder();
      else if(k==="badTrade")SND.rpBadTrade();
      else if(k==="fairTrade")SND.rpFairTrade();
      else if(k==="brilliant")SND.rpBrilliant();
    }
  }
}
function jumpNextNotable(){
  if(!S.replay)return;
  stopReplayAuto();
  const rp=S.replay;
  if(!rp.notableIndices.length)return;
  const nxt=rp.notableIndices.find(idx=>idx>rp.idx);
  stepReplay(nxt!==undefined?nxt:rp.notableIndices[0],true);
}
function toggleReplayAuto(){
  if(!S.replay)return;
  if(S.replay.playing){
    stopReplayAuto();
    renderUIOnly();
    return;
  }
  if(S.replay.idx>=S.replay.frames.length-1)stepReplay(0,false);
  S.replay.playing=true;
  renderUIOnly();
  const advance=()=>{
    if(!S.replay||!S.replay.playing)return;
    if(S.replay.idx>=S.replay.frames.length-1){
      stopReplayAuto();
      renderUIOnly();
      return;
    }
    stepReplay(S.replay.idx+1,true);
    const curEv=S.replay.frames[S.replay.idx].event;
    const waitMs=curEv?2600:950;
    S.replayTimer=setTimeout(advance,waitMs);
  };
  S.replayTimer=setTimeout(advance,650);
}
function exitReplayMode(skipRender){

  S.replay=null;
  S.g=o.g;S.mode=o.mode;S.col=o.col;S.flip=o.flip;

}

/* ---------- Non-Blocking Bot / Coach AI Workers ---------- */
function runWorkerOp(payload,fallbackFn,cb){
  const w=ensureWorker();
  if(w){
    const onMsg=e=>{
      if(e.data.id!==payload.id)return;
      w.removeEventListener("message",onMsg);
      w.removeEventListener("error",onErr);
      cb(e.data);
    };
    const onErr=()=>{
      w.removeEventListener("message",onMsg);
      w.removeEventListener("error",onErr);
      aiWorker=null;
      fallbackFn();
    };
    w.addEventListener("message",onMsg);
    w.addEventListener("error",onErr,{once:true});
    w.postMessage(payload);
  }else fallbackFn();
}

const ID_VAL={p:1,n:3,b:3,r:5,q:9,k:100};

function getBotDelayMs(diff,isCoach){
  if(isCoach)return 3000;
  if(diff==="easy"){
    return Math.random()<0.78?(3400+Math.round(Math.random()*2100)):(1800+Math.round(Math.random()*1100));
  }
  if(diff==="medium")return 2600+Math.round(Math.random()*1600);
  if(diff==="hard")return 1700+Math.round(Math.random()*1300);
  if(diff==="nightmare")return 1100+Math.round(Math.random()*1100);
  return 900+Math.round(Math.random()*1000);
}

function findCoachThreat(){
  const g=S.g;
  if(g.in_check())return null;
  const parts=g.fen().split(" ");
  parts[1]=g.turn()==="w"?"b":"w";
  parts[3]="-";
  let gOpp;
  try{gOpp=new Chess(parts.join(" "))}catch(e){return null}
  const caps=gOpp.moves({verbose:true}).filter(m=>m.captured);
  if(!caps.length)return null;
  let best=null,bestScore=0;
  for(const c of caps){
    const gain=ID_VAL[c.captured]-ID_VAL[c.piece]*0.3;
    if(gain>bestScore){bestScore=gain;best=c}
  }
  return best&&bestScore>=2?{from:best.from,to:best.to,atk:best.piece,tgt:best.captured}:null;
}

function triggerBotMove(){
  const isCoach=S.mode==="coach";
  if(S.busy||(S.mode!=="bot"&&!isCoach)||S.over||S.g.turn()===S.col)return;
  const tk=++S.tok,fen=S.g.fen(),diff=isCoach?"medium":P.diff;
  const startedAt=performance.now();
  const targetDelay=getBotDelayMs(diff,isCoach);
  S.busy=true;
  renderUIOnly();

  const finishWithMove=uci=>{
    if(tk!==S.tok||S.g.fen()!==fen||(S.mode!=="bot"&&S.mode!=="coach"))return;
    const elapsed=performance.now()-startedAt;
    const wait=Math.max(0,targetDelay-elapsed);
    S.aiTimer=setTimeout(()=>{
      S.aiTimer=0;
      if(tk!==S.tok||S.g.fen()!==fen||(S.mode!=="bot"&&S.mode!=="coach"))return;
      const ms=S.g.moves({verbose:true});
      const mv=(uci&&ms.find(m=>(m.from+m.to+(m.promotion||""))===uci))||ms[0];
      S.busy=false;
      if(!mv){render();return}
      const m=S.g.move({from:mv.from,to:mv.to,promotion:mv.promotion});
      if(!m){render();return}
      S.last=[m.from,m.to];
      S.bad=false;
      setMsg("");
      setExplain(m,S.g,isCoach?"Coach: ":"Bot: ");
      if(isCoach){
        const tp=S.coachTrapPending;
        if(tp&&m.to===tp.toSq&&m.captured===tp.piece&&S.g.history().length===tp.ply+1){
          S.coachTrapArmed={piece:tp.piece,toSq:tp.toSq,ply:S.g.history().length};
        }else{
          S.coachTrapArmed=null;
        }
        S.coachTrapPending=null;
        const thr=findCoachThreat();
        if(S.g.in_check()){
          S.coachTone="warn";
          S.coachArrows=[];
          setCoach("coachCheckWarn");
        }else if(thr){
          S.coachTone="warn";
          S.coachArrows=[{a:thr.from,b:thr.to,c:"#ef4444",coach:1}];
          setCoach("coachThreat",{tgtType:thr.tgt,atkType:thr.atk});
        }else if(m.captured){
          S.coachTone="";
          S.coachArrows=[];
          setCoach("coachCaptured",{capType:m.captured});
        }else{
          S.coachTone="";
          S.coachArrows=[];
          setCoach("coachMoved");
        }
      }
      snd(kind(m,S.g));clrDraw();endCheck();
      saveMatchState();
      render({m});
    },wait);
  };

  runWorkerOp({id:tk,fen,diff},()=>runFallbackAsync(fen,diff,uci=>finishWithMove(uci)),d=>finishWithMove(d.uci));
}

function formatCoachDir(dirCode){
  const isId=P.lang==="id";
  if(dirCode==="knight")return isId?"lewat lompatan kuda":"via a knight leap";
  if(dirCode==="file")return isId?"dari lajur vertikal":"down the file";
  if(dirCode==="rank")return isId?"dari baris mendatar":"along the rank";
  return isId?"dari arah diagonal":"down the diagonal";
}

function evaluateCoachMove(fenBefore,m){
  const tk=++S.tok,fenAfter=S.g.fen(),startedAt=performance.now();
  S.busy=true;
  S.coachTone="";
  setCoach("coachChecking");
  renderUIOnly();
  const armedTrap=S.coachTrapArmed;
  S.coachTrapArmed=null;
  S.coachTrapPending=null;
  const apply=res=>{
    if(tk!==S.tok||S.mode!=="coach"||S.g.fen()!==fenAfter)return;
    const wait=Math.max(0,3000-(performance.now()-startedAt));
    S.aiTimer=setTimeout(()=>{
      S.aiTimer=0;
      if(tk!==S.tok||S.mode!=="coach"||S.g.fen()!==fenAfter)return;
      S.busy=false;
      const loss=res?res.loss:0;
      const ply=S.g.history().length;
      const isTrapPayoff=!!(armedTrap&&ply===armedTrap.ply+1&&(S.g.in_check()||S.g.in_checkmate()||(m.captured&&loss<120)));

      if(isTrapPayoff){
        S.coachTone="genius";
        S.coachArrows=[];
        setCoach("coachDelayedTrap",{piece:pieceLabelWord(armedTrap.piece),sq:armedTrap.toSq});
        renderUIOnly();
        if(!S.over)triggerBotMove();
        return;
      }

      if((loss>=120||res?.isMateBlunder)&&!S.over){
        const pun=res.punishUci||"";
        const pf=res.punFrom||(pun?pun.slice(0,2):"");
        const pt=res.punTo||(pun?pun.slice(2,4):"");
        const isPureIdiot=!!(res.isMateBlunder||loss>=450||(res.tgtType&&"qr".includes(res.tgtType)&&loss>=360));
        S.coachTone=isPureIdiot?"pure-idiot":"warn";
        S.coachArrows=(pf&&pt)?[{a:pf,b:pt,c:isPureIdiot?"#ff1e3c":"#ef4444",coach:1}]:[];
        if(res.tgtType===m.piece&&pt===m.to&&"qrbn".includes(m.piece)){
          S.coachTrapPending={piece:m.piece,toSq:m.to,color:m.color,ply};
        }
        const dirText=formatCoachDir(res.punDir||"diag");
        if(isPureIdiot){
          setCoach("coachPureIdiot",{
            pieceType:m.piece,
            to:m.to,
            tgtType:res.tgtType||m.piece,
            atkType:res.atkType||"q",
            punFrom:pf||"?",
            punTo:pt||m.to,
            dir:dirText
          });
        }else if(res.missedWin){
          setCoach("coachMissedWin",{pieceType:m.piece,to:m.to});
        }else if(res.tgtType&&res.atkType){
          if(pt===m.to&&pf){
            setCoach("coachBlunderSpecific",{
              pieceType:m.piece,
              to:m.to,
              tgtType:res.tgtType,
              atkType:res.atkType,
              punFrom:pf,
              punTo:pt,
              dir:dirText
            });
          }else{
            setCoach("coachBlunderCap",{tgtType:res.tgtType,atkType:res.atkType});
          }
        }else if(res.isCheck){
          setCoach("coachBlunderCheck");
        }else{
          setCoach("coachBlunderPos");
        }
        S.coachPending={punishUci:pun};
        renderUIOnly();
      }else{
        S.coachTone="good";
        S.coachArrows=[];
        if(m.promotion){
          setCoach("coachGoodPromo");
        }else if(S.g.in_check()&&(res?.playedSc||0)>=220){
          S.coachTone="genius";
          setCoach("coachGoodBrilliant",{pieceType:m.piece,to:m.to});
        }else if(S.g.in_check()){
          setCoach("coachGoodCheck");
        }else if(m.captured){
          setCoach("coachGoodCap");
        }else if(ply<=8&&loss>=45&&loss<120&&"pn".includes(m.piece)){
          setCoach("coachGambit");
        }else if(ply<=12&&m.piece==="k"&&/[kq]/.test(m.flags)){
          setCoach("coachOpenCastle");
        }else if(ply<=6&&m.piece==="q"){
          setCoach("coachOpenQueenEarly");
        }else if(ply<=8&&m.piece==="p"&&"de".includes(m.to[0])&&"45".includes(m.to[1])){
          setCoach("coachOpenCenter");
        }else if(ply<=10&&"nb".includes(m.piece)&&m.from[1]===(m.color==="w"?"1":"8")){
          setCoach("coachOpenDev");
        }else if(loss<=12&&ply>=8){
          setCoach("coachGoodBrilliant",{pieceType:m.piece,to:m.to});
        }else if(loss<35){
          setCoach("coachGoodBest");
        }else{
          setCoach("coachGoodSolid");
        }
        renderUIOnly();
        if(!S.over)triggerBotMove();
      }
    },wait);
  };
  runWorkerOp({id:tk,op:"coachEval",fenBefore,fenAfter},()=>runCoachEvalFallback(fenBefore,fenAfter,apply),d=>apply(d.res));
}

/* ---------- Fast Coaching Explanations ---------- */
function buildExplainText(m,inMate,inChk,prefix){
  let s=t("exMove",{piece:pcName(m.piece),from:m.from,to:m.to});
  if(m.captured)s+=t("exCap",{cap:pcName(m.captured)});
  if(/[kq]/.test(m.flags)&&m.piece==="k")s+=t("exCastle");
  if(m.flags.includes("e"))s+=t("exEp");
  if(m.promotion)s+=t("exPromo",{promo:pcName(m.promotion)});
  if(inMate)s+=t("exMate");
  else if(inChk)s+=t("exChk");
  if("de".includes(m.to[0])&&"45".includes(m.to[1]))s+=t("exCenter");
  if("nb".includes(m.piece)&&m.from[1]===(m.color==="w"?"1":"8"))s+=t("exDev");
  if(P.beg){
    const san=m.san,pn=pcName(m.piece);
    s+=t("exNoteStart",{san})+(san[0]==="O"?t("exNoteCastle"):(/[NBRQK]/.test(san[0])?pn[0].toUpperCase()+pn.slice(1):(san.includes("x")?t("exNotePawnCap"):t("exNotePawnMove")))+(san.includes("x")?t("exNoteCap"):"")+(san.includes("+")?t("exNoteChk"):"")+(san.includes("#")?t("exNoteMate"):"")+".");
  }
  return (prefix||"")+s;
}
function setExplain(m,g,prefix){
  if(!m){S.exSpec=null;S.ex="";return}
  S.exSpec={m,inMate:g.in_checkmate(),inChk:g.in_check(),prefix:prefix||""};
  S.ex=buildExplainText(m,S.exSpec.inMate,S.exSpec.inChk,S.exSpec.prefix);
}

/* ---------- Moves, Promotion Modal, Check/Pin Validation, Undo/Redo ---------- */
const needPromo=(f,t)=>S.g.moves({square:f,verbose:true}).some(m=>m.to===t&&m.promotion);
function askPromo(f,t,fromDrag){
  const pc=S.g.get(f);if(!pc)return;
  S.pp={f,t,c:pc.color,fromDrag:!!fromDrag};
  S.ppAt=performance.now();
  S.sel=null;S.legal=[];
  renderUIOnly();
}

function reportInvalidAttempt(fromSq,targetSq){
  const g=S.g;
  const pseudo=isPseudoLegalMove(g,fromSq,targetSq);
  if(g.in_check()||pseudo){
    triggerCheckPinWarning(g.in_check()?"errKingCheck":"errKingPin");
    SND.err();
    return true;
  }
  if(targetSq&&g.get(targetSq)){
    setMsg("errIllegal");
    S.bad=true;
    SND.err();
    return true;
  }
  return false;
}

function doMove(f,t,pr,fromDrag){
  if(!pr&&needPromo(f,t)){
    askPromo(f,t,fromDrag);
    return;
  }
  const g=S.g;
  const fenBefore=S.mode==="coach"?g.fen():"";
  const m=g.move({from:f,to:t,promotion:pr});
  if(!m)return;
  clearCheckWarn();
  S.coachTok++;S.coachArrows=[];S.coachPending=null;
  S.sel=null;S.legal=[];S.redo=[];S.hint=null;S.hintArrow=null;S.hm="";S.hmSpec=null;S.last=[f,t];
  setExplain(m,g,"");
  const sk=kind(m,g),L=g.history().length;
  S.bad=false;
  if(S.mode==="bot"||S.mode==="coach")setMsg("");
  let animObj={m,settle:!!fromDrag};

  if(S.mode==="learn"){
    const s=cur();
    const matched=(m.from===s.best.slice(0,2)&&s.acc.includes(m.to))||(s.accMate&&g.in_checkmate());
    if(matched){
      S.solved=true;
      P.done[S.li+"-"+S.si]=1;save();
      const allDone=S.si===LS[S.li].s.length-1&&LS[S.li].s.every((_,i)=>P.done[S.li+"-"+i]);
      S.msgSpec={type:"lessonSolved",allDone};
      S.msg=s.why+" ✓"+(allDone?t("lessonComplete"):"");
      SND.ok();
    }else{
      g.undo();S.last=null;setExplain(null);S.bad=true;animObj=null;
      setMsg(m.from!==s.best.slice(0,2)?"errLessonPiece":"errLessonGoal");
      SND.err();
    }
  }else if(S.mode==="puz"){
    const pzList=getTodayPuzzles(),p=pzList[S.pi];
    if(p.seq){
      const exp=p.seq[S.pzStep*2];
      if(f+t===exp){
        if(S.pzStep===0){
          S.pzStep=1;S.pzBusy=true;
          setMsg("puzGreatStart");
          snd(sk);clrDraw();render(animObj);
          const tk=S.tok;
          setTimeout(()=>{
            if(tk!==S.tok||S.mode!=="puz"||!S.pzBusy)return;
            const r=p.seq[1];
            const om=S.g.move({from:r.slice(0,2),to:r.slice(2,4),promotion:"q"});
            S.pzBusy=false;
            if(om){
              S.last=[om.from,om.to];
              setMsg("puzFinishCombo");
              snd(kind(om,S.g));
              render({m:om});
            }else renderUIOnly();
          },360);
          return;
        }else{
          S.msgSpec={type:"puzSolved",san:m.san};
          S.msg=pWhy(p)+" ✓";
          S.solved=true;
          recordPz(true);
          SND.ok();
        }
      }else{
        g.undo();S.last=null;setExplain(null);S.bad=true;animObj=null;
        setMsg("puzWrongCombo",{san:m.san});
        SND.err();
        recordPz(false);
      }
    }else{
      const ok=p.sol?(f+t===p.sol):m.san.endsWith("#");
      if(ok){
        S.msgSpec={type:"puzSolved",san:m.san};
        S.msg=(pWhy(p)||t("puzDefaultMate",{san:m.san}))+" ✓";
        S.solved=true;
        recordPz(true);
        SND.ok();
      }else{
        g.undo();S.last=null;setExplain(null);S.bad=true;animObj=null;
        setMsg("puzWrongSol",{san:m.san});
        SND.err();
        recordPz(false);
      }
    }
  }else{
    endCheck();
  }

  if(g.history().length===L){
    const pendingAutoFlip=isAutoFlipTurn()&&!S.over&&(g.turn()==="b")!==S.flip;
    cancelFlipTimer();
    snd(sk);clrDraw();
    saveMatchState();
    render(animObj);
    if(pendingAutoFlip){
      const tk=S.tok;
      const baseMs=dur();
      const distSq=Math.hypot(t.charCodeAt(0)-f.charCodeAt(0),(+t[1])-(+f[1]));
      const slideMs=!baseMs?0:(fromDrag?95:Math.min(baseMs+95,baseMs+Math.round(distSq*14)));
      const pauseMs=(P.fx.rm||!P.fx.anim)?40:280;
      S.flipBusy=true;
      S.flipTimer=setTimeout(()=>{
        S.flipTimer=0;
        if(tk!==S.tok||S.over||!isAutoFlipTurn()){S.flipBusy=false;return}
        const nextFlip=S.g.turn()==="b";
        if(nextFlip!==S.flip){
          triggerBoardRotateAnim(nextFlip,tk);
        }else{
          S.flipBusy=false;
        }
      },slideMs+pauseMs);
    }
    if(S.mode==="bot"&&!S.over)triggerBotMove();
    else if(S.mode==="coach"&&!S.over)evaluateCoachMove(fenBefore,m);
  }else{
    render();
    shakeSq(f);
  }
}

function shakeSq(sq){
  if(P.fx.rm||!P.fx.anim)return;
  const el=PE[sq];if(!el)return;
  const[x,y]=pxCoord(sq);
  el.animate([
    {transform:`translate3d(${x*100}%,${y*100}%,0)`},
    {transform:`translate3d(calc(${x*100}% - 6px),${y*100}%,0)`},
    {transform:`translate3d(calc(${x*100}% + 6px),${y*100}%,0)`},
    {transform:`translate3d(${x*100}%,${y*100}%,0)`}
  ],{duration:240});
}

function recordPz(ok){
  const pzList=getTodayPuzzles(),p=pzList[S.pi],z=P.pz,ds=getDailyState(),day=todayKey();
  if(ok){
    if(!ds.done[S.pi])ds.done[S.pi]=true;
    if(allDoneToday()&&z.lastDay!==day){
      const prevDay=z.lastDay;
      z.lastDay=day;
      z.st=(prevDay===yesterdayKey())?(z.st||0)+1:1;
    }
    if(!S.tried){
      z.a++;z.cat[p.c]=z.cat[p.c]||{a:0,s:0};z.cat[p.c].a++;
      z.s++;z.cat[p.c].s++;
      z.r+=12;
    }
    S.tried=true;save();
    return;
  }
  if(S.tried)return;
  z.a++;z.cat[p.c]=z.cat[p.c]||{a:0,s:0};z.cat[p.c].a++;
  z.r=Math.max(400,z.r-8);
  S.tried=true;save();
}

function endCheck(){
  const g=S.g;let key="",vars=null,res=null;
  const kingCap=(g.isKingCaptured&&g.isKingCaptured())||"";
  const noPcs=(g.isNoPieces&&g.isNoPieces())||"";
  if(kingCap){
    key="overKingCap";vars={wn:kingCap};
    S.mateWin=kingCap;S.mateReason="kingCap";
    S.mateModalOpen=true;
  }else if(noPcs){
    key="overNoPieces";vars={wn:noPcs};
    S.mateWin=noPcs;S.mateReason="noPieces";
    S.mateModalOpen=true;
  }else if(g.in_checkmate()){
    const wn=g.turn()==="w"?"b":"w";
    key="overMate";vars={wn};
    res=wn===S.col?"w":"l";
    S.mateWin=wn;S.mateReason="";
    if(S.mode==="basic"||S.mode==="bot"||S.mode==="coach"||S.mode==="sandbox")S.mateModalOpen=true;
  }
  else if(g.in_stalemate()){key="overStale";res="d"}
  else if(g.in_threefold_repetition()){key="overRep";res="d"}
  else if(g.insufficient_material()){key="overInsuff";res="d"}
  else if(g.in_draw()){key="over50";res="d"}
  if(key){
    S.overSpec={key,vars};
    S.over=t(key,vars&&vars.wn?{winner:t(vars.wn==="w"?"white":"black")}:undefined);
    if(S.mode==="bot"&&res){P.g[res]++;save()}
    if(S.mode==="coach"){
      S.coachArrows=[];
      if(g.in_checkmate()){
        const wn=g.turn()==="w"?"b":"w";
        S.coachTone=wn===S.col?"good":"warn";
        setCoach(wn===S.col?"coachMateWin":"coachMateLose");
      }else{
        S.coachTone="";
        setCoach("coachDraw");
      }
    }
  }
  return !!key;
}

function undo(){
  if(S.busy||S.pzBusy||S.flipBusy)cancelAI();
  else cancelFlipTimer();
  clearCheckWarn();
  S.pp=null;S.mateModalOpen=false;S.mateWin="";S.mateReason="";
  S.coachPending=null;S.coachArrows=[];S.coachTone="";
  const g=S.g;
  if(!g.history().length)return;
  const vsAiTurn=(S.mode==="bot"||S.mode==="coach")&&g.turn()===S.col&&g.history().length>=2;
  let n=vsAiTurn?2:1;
  if(S.mode==="puz"&&S.pzStep===1&&g.history().length>=2){n=2;S.pzStep=0}
  S.over="";S.overSpec=null;
  let lastAnim=null,undone=0;
  while(n--&&g.history().length){
    const m=g.undo();S.redo.push(m);
    lastAnim={m,rev:true};undone++;
  }
  if(isAutoFlipTurn())S.flip=g.turn()==="b";
  S.solved=false;S.sel=null;S.legal=[];S.hint=null;S.hintArrow=null;S.hm="";S.hmSpec=null;S.bad=false;
  if(S.mode==="learn"){S.msgSpec={type:"lessonStep"};S.msg=cur().tx;}
  else if(S.mode==="puz"){S.msgSpec={type:"puzPrompt"};S.msg=pText(getTodayPuzzles()[S.pi]);}
  else if(S.mode==="coach"){setMsg("");setCoach("coachUndone");}
  else setMsg("");
  clrDraw();
  const h=g.history({verbose:true}).pop();
  S.last=h?[h.from,h.to]:null;
  setExplain(h,g,"");
  SND.click();
  saveMatchState();
  render(undone===1?lastAnim:null);
}

function redo(){
  if(S.busy||S.pzBusy||S.flipBusy)cancelAI();
  else cancelFlipTimer();
  clearCheckWarn();
  const g=S.g,o=S.redo.pop();if(!o)return;
  const m=g.move({from:o.from,to:o.to,promotion:o.promotion||"q"});
  if(!m)return;
  let lastM=m,redone=1;
  const isVsAi=(S.mode==="bot"||S.mode==="coach");
  if(isVsAi&&!g.game_over()&&g.turn()!==S.col&&S.redo.length){
    const o2=S.redo.pop();
    const m2=g.move({from:o2.from,to:o2.to,promotion:o2.promotion||"q"});
    if(m2){lastM=m2;redone++}
  }
  if(isAutoFlipTurn())S.flip=g.turn()==="b";
  S.coachPending=null;S.coachArrows=[];S.hintArrow=null;S.hm="";S.hmSpec=null;
  S.last=[lastM.from,lastM.to];
  setExplain(lastM,g,"");
  if(S.mode==="learn"||S.mode==="puz")S.solved=true;
  endCheck();
  snd(kind(lastM,g));clrDraw();
  saveMatchState();
  render(redone===1?{m:lastM}:null);
  if((S.mode==="bot"||S.mode==="coach")&&!S.over&&g.turn()!==S.col)triggerBotMove();
}

function coachHint(){
  if(S.mode!=="coach"||S.over||S.busy)return;
  const fen=S.g.fen(),id=++S.coachTok;
  const show=uci=>{
    if(id!==S.coachTok||S.mode!=="coach"||S.g.fen()!==fen||!uci)return;
    const ms=S.g.moves({verbose:true});
    const o=ms.find(m=>(m.from+m.to+(m.promotion||""))===uci);
    if(!o)return;
    const thr=findCoachThreat();
    S.hint=[o.from];
    S.coachArrows=thr?[{a:thr.from,b:thr.to,c:"#ef4444",coach:1}]:[];
    S.coachHintUsed=true;
    S.coachTone=thr?"warn":"";
    if(thr){
      setCoach("coachHintThreat",{tgtType:thr.tgt,atkType:thr.atk,pieceType:o.piece});
    }else if(o.san==="O-O"||o.san==="O-O-O"){
      setCoach("coachHintCastle");
    }else if(o.captured){
      setCoach("coachHintCap",{pieceType:o.piece});
    }else if(o.san.includes("+")){
      setCoach("coachHintCheck",{pieceType:o.piece});
    }else{
      setCoach("coachHintActive",{pieceType:o.piece});
    }
    renderUIOnly();
  };
  runWorkerOp({id,fen,diff:"hard"},()=>runFallbackAsync(fen,"hard",show),d=>show(d.uci));
}

function hint(){
  SND.click();
  if(S.mode==="coach"){coachHint();return}
  if(S.mode==="sandbox"){
    if(S.over||S.busy)return;
    const o=sbPickBotMove(S.g);
    if(!o)return;
    S.hint=null;
    S.hintArrow={a:o.from,b:o.to,c:"#4b9bff",hint:1};
    S.hmSpec={type:"std",san:o.san,piece:o.piece,to:o.to};
    S.hm=t("hintSuggested",{san:o.san,piece:pcName(o.piece),to:o.to});
    S.h=3;
    renderUIOnly();
    return;
  }
  if(S.mode==="basic"||S.mode==="bot"){
    if(S.over||S.busy)return;
    const fen=S.g.fen();
    const showHint=uci=>{
      if(S.g.fen()!==fen||!uci)return;
      const ms=S.g.moves({verbose:true});
      const o=ms.find(m=>(m.from+m.to+(m.promotion||""))===uci);
      if(!o)return;
      S.hint=null;
      S.hintArrow={a:o.from,b:o.to,c:"#4b9bff",hint:1};
      S.hmSpec={type:"std",san:o.san,piece:o.piece,to:o.to};
      S.hm=t("hintSuggested",{san:o.san,piece:pcName(o.piece),to:o.to});
      S.h=3;
      renderUIOnly();
    };
    const id=++S.tok;
    runWorkerOp({id,fen,diff:"hard"},()=>runFallbackAsync(fen,"hard",showHint),d=>showHint(d.uci));
    return;
  }
  let b,ideaKey,ideaText,whyText;
  if(S.mode==="learn"){const s=cur();b=[s.best.slice(0,2),s.best.slice(2)];ideaText=s.idea;whyText=s.why}
  else{
    const p=getTodayPuzzles()[S.pi];
    if(p.seq){
      const mv=p.seq[S.pzStep*2];
      b=[mv.slice(0,2),mv.slice(2)];
      ideaKey="hintIdeaCombo";
      whyText=pWhy(p);
    }else if(p.sol){
      b=[p.sol.slice(0,2),p.sol.slice(2)];
      ideaKey="hintIdeaTactic";
      whyText=pWhy(p);
    }else{
      const m=mateMove(p.fen);
      b=[m.from,m.to];
      ideaKey="hintIdeaMate";
      whyText=pWhy(p)||t("puzDefaultMate",{san:m.san});
    }
  }
  S.h=Math.min(4,S.h+1);
  S.hmSpec={type:"lp",h:S.h,ideaKey};
  const idea=ideaKey?t(ideaKey):ideaText;
  S.hm=["",idea,t("hintPiece"),t("hintSquares"),t("hintSolution",{why:whyText})][S.h];
  S.hint=S.h===2?[b[0]]:S.h>=3?b:null;
  renderUIOnly();
}

function refreshTranslatedState(){
  if(S.coachKey)setCoach(S.coachKey,S.coachArgs,true);
  if(S.exSpec)S.ex=buildExplainText(S.exSpec.m,S.exSpec.inMate,S.exSpec.inChk,S.exSpec.prefix);
  if(S.overSpec)S.over=t(S.overSpec.key,S.overSpec.vars&&S.overSpec.vars.wn?{winner:t(S.overSpec.vars.wn==="w"?"white":"black")}:undefined);
  if(S.msgSpec){
    if(S.msgSpec.type==="lessonStep")S.msg=cur().tx;
    else if(S.msgSpec.type==="lessonSolved")S.msg=cur().why+" ✓"+(S.msgSpec.allDone?t("lessonComplete"):"");
    else if(S.msgSpec.type==="puzPrompt")S.msg=pText(getTodayPuzzles()[S.pi]);
    else if(S.msgSpec.type==="puzSolved"){const p=getTodayPuzzles()[S.pi];S.msg=(pWhy(p)||t("puzDefaultMate",{san:S.msgSpec.san}))+" ✓";}
    else if(S.msgSpec.key)S.msg=t(S.msgSpec.key,S.msgSpec.vars);
  }
  if(S.hmSpec){
    if(S.hmSpec.type==="std")S.hm=t("hintSuggested",{san:S.hmSpec.san,piece:pcName(S.hmSpec.piece),to:S.hmSpec.to});
    else if(S.hmSpec.type==="lp"){
      const p=S.mode==="puz"?getTodayPuzzles()[S.pi]:null;
      const whyText=S.mode==="learn"?cur().why:(pWhy(p)||"");
      const idea=S.hmSpec.ideaKey?t(S.hmSpec.ideaKey):cur().idea;
      S.hm=["",idea,t("hintPiece"),t("hintSquares"),t("hintSolution",{why:whyText})][S.hmSpec.h];
    }
  }
  if(S.copiedLabel)S.copied=t("copied",{label:S.copiedLabel});
  $("#menu-pop").setAttribute("aria-label",t("menuAria"));
  $("#drawer").setAttribute("aria-label",t("drawerAria"));
  $("#botbar").setAttribute("aria-label",t("navAria"));
}

function currentBotMeta(){return BOT_MODES.find(b=>b.id===P.diff)||BOT_MODES[0]}
function modeLabel(){
  if(S.replay)return `${t("replayTitle")} (${S.replay.idx}/${S.replay.frames.length-1})`;

    const bm=currentBotMeta();

  if(S.mode==="coach")return t("modeCoachHdr");

function renderStatusAndBanner(){
  const g=S.g,turnW=g.turn()==="w";
  let stText=turnW?t("whiteToMove"):t("blackToMove");
  let stSub=g.in_check()?t("check"):"";
  const bm=currentBotMeta();
  if(S.over){stText=S.over;stSub=t("gameOver")}
  else if(S.mode==="bot"||S.mode==="coach"){
    const lbl=S.mode==="coach"?t("coachGemini"):(P.diff==="mittens"?`<span class="mittens-pill">Mittens</span>`:botName(bm));
    if(S.busy){
      stText=S.mode==="coach"?t("coachThinking"):t("botThinking");
      stSub=lbl;
    }else{
      stText=g.turn()===S.col?t("yourTurn"):(S.mode==="coach"?t("coachTurn"):t("botTurn"));
      stSub=g.in_check()?t("check"):lbl;
    }
  }else if(S.mode==="sandbox"){
    if(S.over)stText=S.over;
    else if(S.busy){stText=t("botThinking");stSub=t("sandboxMode");}
    if(!S.over)stSub=`<button data-a="mode-sandbox" class="status-pill-btn">${t("sandboxRulesBtn")}</button>`;
  }else if(S.mode==="learn"){
    stText=`${lTitle(S.li)} · ${S.si+1}/${LS[S.li].s.length}`;
    stSub=S.solved?t("solved"):"";
  }else if(S.mode==="puz"){
    const p=getTodayPuzzles()[S.pi];
    stText=`${t("levelLabel",{lvl:S.pi+1,diff:pDiff(p),cat:pCat(p)})}`;
    stSub=S.solved?t("solved"):(turnW?t("white"):t("black"));
  }
  const isFaceTurn=isFaceToFaceMode()&&!S.replay;
  const isFaceTopTurn=isFaceTurn&&!S.over&&(turnW===S.flip);
  const sbEl=$("#status-bar");
  if(sbEl){
    sbEl.classList.toggle("turn-live",!S.over&&!S.replay);
    sbEl.classList.toggle("turn-face",!S.over&&isFaceTurn);
    sbEl.classList.toggle("face-top",isFaceTopTurn);
    sbEl.classList.toggle("in-check",!S.over&&g.in_check());
  }
  const pvEl=$("#play-view");
  if(pvEl){
    pvEl.classList.toggle("face-layout",isFaceTurn);
  }
  setHtmlIfChanged(sbEl,
    `<div class="status-main"><span class="turn-dot ${turnW?"w":"b"} ${S.busy?"thinking":""}"></span><span class="status-txt">${stText}</span></div>`+
    `${stSub?`<span class="status-sub">${stSub}</span>`:""}`
  );

  renderCoachBox();

  const ban=$("#banner");
  if(S.replay){ban.hidden=true;return}
  const showLearnPuz=S.mode==="learn"||S.mode==="puz";
  const text=S.hm&&S.h?S.hm:(S.over&&(S.mode==="bot"||S.mode==="coach"||S.mode==="sandbox")&&!S.msg?`${S.over}. ${t("playAgain")}`:(S.over&&S.mode==="basic"&&S.g.history().length?S.over:S.msg));
  if(!showLearnPuz&&!text){ban.hidden=true;return}
  ban.hidden=false;
  const bCls=(S.hm&&S.h)?"hint":(S.bad?"bad":"");
  if(ban.className!==bCls)ban.className=bCls;
  let acts="";
  if(S.mode==="learn"){
    acts+=`<button data-a="next" class="${S.solved?"pri":""}" ${S.solved?"":"disabled"}>${t("nextStep")}</button>`+
          `<button data-a="go-me">${t("learningHub")}</button>`;
  }else if(S.mode==="puz"){
    const doneAll=allDoneToday();
    const nxt=S.pi+1;
    const canNext=nxt<3&&(S.solved||isPuzzleUnlocked(nxt));
    if(doneAll){
      acts+=`<span class="mu" style="font-weight:700;align-self:center">${t("nextPuzzlesIn")} <b id="banner-cd" style="color:var(--ac)">${formatMidnightCountdown()}</b></span>`;
    }else if(nxt<3){
      acts+=`<button data-a="npz" class="${S.solved?"pri":""}" ${canNext?"":"disabled"}>${t("nextLevel",{lvl:nxt+1})}</button>`;
    }
    acts+=`<button data-a="go-me">${t("allDailies")}</button>`;
  }else if(S.over&&(S.mode==="basic"||S.mode==="bot"||S.mode==="coach"||S.mode==="sandbox")){
    if(S.g.history().length>0)acts+=`<button data-a="start-replay" class="pri">${t("replayMatch")}</button>`;
    acts+=`<button data-a="restart" class="${S.g.history().length>0?"":"pri"}">${S.mode==="coach"?t("newCoachGame"):(S.mode==="sandbox"?t("newSandboxMatch"):(S.mode==="basic"?t("restartGame"):t("newBotMatch")))}</button>`;
    if(S.mode==="sandbox")acts+=`<button data-a="mode-sandbox">${t("editSandboxRules")}</button>`;
  }
  setHtmlIfChanged(ban,`<div class="banner-top"><span>${text}</span></div>${acts?`<div class="banner-actions">${acts}</div>`:""}`);
}

const CAP_ORDER={q:0,r:1,b:2,n:3,p:4,k:5};
function renderCapturedTray(){
  const topTray=$("#cap-top"),tray=$("#cap-tray");
  if(!tray)return;
  const caps=computeCapturedState();
  const sumPts=arr=>arr.reduce((a,c)=>a+(ID_VAL[c.type]||0),0);
  const buildBox=(side,lbl,adv)=>{
    const list=caps[side].slice().sort((a,b)=>(CAP_ORDER[a.type]??9)-(CAP_ORDER[b.type]??9));
    const latestSidePly=caps[side].reduce((mx,c)=>Math.max(mx,c.ply??-1),-1);
    const itemsHtml=list.length
      ?list.map(c=>`<span class="cap-pc${c.ply===latestSidePly?" cap-latest":""}" aria-label="${pcName(c.type)}">${pieceUse(c.type,c.color)}</span>`).join("")
      :`<span class="cap-empty">${t("capNone")}</span>`;
    return `<div class="cap-box"><span class="cap-meta"><span class="cap-dot ${side}"></span><span>${lbl}</span>${adv>0?`<span class="cap-adv">+${adv}</span>`:""}</span><div class="cap-list">${itemsHtml}</div></div>`;
  };

  if(isDualFaceGraveyard()){
    const topSide=S.flip?"w":"b";
    const botSide=topSide==="w"?"b":"w";
    const topLbl=topSide==="w"?t("capWhite"):t("capBlack");
    const botLbl=botSide==="w"?t("capWhite"):t("capBlack");
    const topPts=sumPts(caps[topSide]),botPts=sumPts(caps[botSide]);
    if(topTray){
      topTray.hidden=false;
      setHtmlIfChanged(topTray,buildBox(topSide,topLbl,topPts-botPts));
    }
    tray.hidden=false;
    setHtmlIfChanged(tray,buildBox(botSide,botLbl,botPts-topPts));
    return;
  }

  if(topTray){
    topTray.hidden=true;
    setHtmlIfChanged(topTray,"");
  }
  tray.hidden=false;

  if(S.mode==="bot"||S.mode==="coach"){
    const playerSide=S.col==="b"?"b":"w";
    const oppSide=playerSide==="w"?"b":"w";
    const lbl=P.name||t("capYou");
    const adv=sumPts(caps[playerSide])-sumPts(caps[oppSide]);
    setHtmlIfChanged(tray,buildBox(playerSide,lbl,adv));
    return;
  }

  if(S.mode==="basic"||S.mode==="sandbox"){
    const activeSide=S.g.turn()==="b"?"b":"w";
    const oppSide=activeSide==="w"?"b":"w";
    const lbl=activeSide==="w"?t("capWhite"):t("capBlack");
    const adv=sumPts(caps[activeSide])-sumPts(caps[oppSide]);
    setHtmlIfChanged(tray,buildBox(activeSide,lbl,adv));
    return;
  }

  const pSide=S.flip?"b":"w";
  const oSide=pSide==="w"?"b":"w";
  setHtmlIfChanged(tray,buildBox(pSide,pSide==="w"?t("capWhite"):t("capBlack"),sumPts(caps[pSide])-sumPts(caps[oSide])));
}

    `<span class="m-icos">${pieceUse(m.piece,m.color)}${m.captured?pieceUse(m.captured,capCol):""}</span>`;
}

const PGN_MODERN_NAMES={p:"Pawn",n:"Knight",b:"Bishop",r:"Rook",q:"Queen",k:"King"};
function formatModernMoveToken(m){
  if(!m||typeof m!=="object")return String(m||"");
  const pname=PGN_MODERN_NAMES[m.piece]||"Piece";
  const promo=m.promotion?`=${PGN_MODERN_NAMES[m.promotion]||m.promotion.toUpperCase()}`:"";
  const chk=(m.san&&m.san.endsWith("#"))?"#":((m.san&&m.san.endsWith("+"))?"+":"");
  return `${m.to}(${pname})${promo}${chk}`;
}
function formatPgnExport(style){
  const g=S.g;if(!g)return "";
  const hist=g.history({verbose:true});
  if(style==="modern"){
    const parts=[];
    for(let i=0;i<hist.length;i+=2){
      const wTok=formatModernMoveToken(hist[i]);
      const bTok=hist[i+1]?" "+formatModernMoveToken(hist[i+1]):"";
      parts.push(`${i/2+1}. ${wTok}${bTok}`);
    }
    return parts.join(" ");
  }
  const raw=typeof g.pgn==="function"?g.pgn():"";
  if(raw)return raw;
  const parts=[];
  for(let i=0;i<hist.length;i+=2){
    const wTok=hist[i].san||"";
    const bTok=hist[i+1]?" "+(hist[i+1].san||""):"";
    parts.push(`${i/2+1}. ${wTok}${bTok}`);
  }
  return parts.join(" ");
}

/* ---------- Unified 60fps Drag-and-Drop + Tap + Keyboard ---------- */
let bdRect=null,_rectRaf=0;
function cacheBoardRect(){
  const r=bdEl.getBoundingClientRect();
  if(r.width>0)bdRect=r;
}
function scheduleBoardRect(){
  if(_rectRaf)return;
  _rectRaf=requestAnimationFrame(()=>{_rectRaf=0;cacheBoardRect()});
}
if(window.ResizeObserver){
  new ResizeObserver(()=>scheduleBoardRect()).observe(bdEl);
}
window.addEventListener("resize",scheduleBoardRect,{passive:true});

function sqAtClient(x,y){
  const r=bdRect||bdEl.getBoundingClientRect();
  if(!r.width||!r.height)return null;
  const c=Math.floor((x-r.left)/r.width*8),w=Math.floor((y-r.top)/r.height*8);
  if(c<0||c>7||w<0||w>7)return null;
  return "abcdefgh"[S.flip?7-c:c]+(8-(S.flip?7-w:w));
}

let toastTimer=0;
function showToast(msg){
  const el=$("#toast");
  if(!el)return;
  el.textContent=msg;
  el.hidden=false;
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{toastTimer=0;el.hidden=true},2200);
}

let copyTxtTimer=0;
function markTextCopied(label){
  S.copiedLabel=label;
  S.copied=t("copied",{label});renderUIOnly();
  showToast(S.copied);
  if(copyTxtTimer)clearTimeout(copyTxtTimer);
  copyTxtTimer=setTimeout(()=>{copyTxtTimer=0;if(S.copiedLabel===label){S.copied="";S.copiedLabel="";renderUIOnly()}},1500);
}
function fallbackExecCopy(txt){
  const el=document.createElement("textarea");
  el.value=txt;
  el.setAttribute("readonly","");
  el.style.position="fixed";
  el.style.opacity="0";
  document.body.appendChild(el);
  el.select();
  const ok=document.execCommand("copy");
  el.remove();
  return !!ok;
}
function copyText(txt,label){
  try{
    if(navigator.clipboard?.writeText){
      const pr=navigator.clipboard.writeText(txt);
      if(pr&&typeof pr.then==="function"){
        pr.then(()=>markTextCopied(label)).catch(()=>{
          if(fallbackExecCopy(txt))markTextCopied(label);
          else showToast(t("copyFailed"));
        });
        return;
      }
      markTextCopied(label);
      return;
    }
    if(fallbackExecCopy(txt))markTextCopied(label);
    else showToast(t("copyFailed"));
  }catch(e){showToast(t("copyFailed"))}
}

document.addEventListener("click",e=>{

    startBasic(pick);

  else if(a==="mode-bot"){S.menuOpen=false;S.mateModalOpen=false;S.botColPick=S.botColPick||"w";S.colorModalOpen=true;renderUIOnly()}

  else if(a==="close-sb"){S.sbSetupOpen=false;renderUIOnly()}

  else if(a==="sb-brush"){S.sbCfg.brush=(d.c&&d.t)?{color:d.c,type:d.t}:null;renderUIOnly()}
  else if(a==="sb-sq"){
    const rr=+d.r,cc=+d.c,br=S.sbCfg.brush,curP=S.sbCfg.board[rr][cc];
    if(!br)S.sbCfg.board[rr][cc]=null;
    else if(curP&&curP.color===br.color&&curP.type===br.type)S.sbCfg.board[rr][cc]=null;
    else S.sbCfg.board[rr][cc]={color:br.color,type:br.type};
    S.sbCfg.err="";renderUIOnly();
  }
  else if(a==="sb-side"){S.sbCfg.bulkSide=d.v;renderUIOnly()}
  else if(a==="sb-bulk"){sbBulkReplace(d.tgt,d.pt)}
  else if(a==="sb-rule"){S.sbCfg.rules[d.pc][d.k]=!S.sbCfg.rules[d.pc][d.k];renderUIOnly()}
  else if(a==="sb-grule"){S.sbCfg.rules[d.k]=!S.sbCfg.rules[d.k];renderUIOnly()}
  else if(a==="sb-opp"){
    if(d.v==="bot"){showToast(t("sbBotUnavailable"));return}
    S.sbCfg.opp="same";
    showToast(`${t("play2p")} · ${t("p2SameTitle")}`);
    renderUIOnly();
  }
  else if(a==="sb-start"){
    if(!hasBothColors(S.sbCfg.board)){S.sbCfg.err=t("sbNeedPiece");renderUIOnly();return}
    S.sbCfg.opp="same";
    startSandbox();
  }
  else if(a==="rename-player"){
    const curN=P.name||t("defaultPlayerName");
    const nv=window.prompt(t("enterPlayerName"),curN);
    if(nv!==null){P.name=nv.trim().slice(0,24);save();renderUIOnly()}

  else if(a==="bot-start"){startBot(S.botColPick||"w")}
  else if(a==="close-color"){S.colorModalOpen=false;renderUIOnly()}
  else if(a==="coach-hint")coachHint();
  else if(a==="coach-undo")undo();
  else if(a==="coach-cont"){
    S.coachPending=null;S.coachArrows=[];S.coachTone="";
    setCoach("coachContinueMsg");
    renderUIOnly();
    triggerBotMove();

    S.mateModalOpen=false;
    if(S.mode==="bot")startBot(S.col);
    else if(S.mode==="coach")startCoach();
    else if(S.mode==="sandbox")startSandbox();
    else startBasic();
  }
  else if(a==="close-mate"){S.mateModalOpen=false;renderUIOnly()}

    if(d.v==="en"||d.v==="id"){
      P.lang=d.v;save();applyLanguage();refreshTranslatedState();renderUIOnly();

  else if(a==="next"){if(S.si<LS[S.li].s.length-1)S.si++;else{S.li=(S.li+1)%LS.length;S.si=0}startLesson()}
