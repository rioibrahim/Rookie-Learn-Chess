  else if(a==="pro"){const p=S.pp;S.pp=null;if(p)doMove(p.f,p.t,d.p,false)}
  else if(a==="pcancel"){if(performance.now()-S.ppAt<250)return;S.pp=null;renderUIOnly()}
  else if(a==="dm"){S.dm=!S.dm;S.ds=null;renderUIOnly()}
  else if(a==="dc"){S.dc=d.c;S.ds=null;ov();renderDrawBar()}
  else if(a==="cd"){S.dr={a:[],h:{}};S.ds=null;ov();renderDrawBar()}
  else if(a==="set"){if(d.k==="spd")P.fx.spd=+d.v;else P.fx[d.k]=!P.fx[d.k];save();renderUIOnly()}
  else if(a==="theme"){P.theme=d.v;save();applyTheme();renderUIOnly()}
  else if(a==="cpfen")copyText(S.g.fen(),"FEN");
  else if(a==="cppgn"){S.pgnFormat=S.pgnFormat||"classic";S.pgnModalOpen=true;renderUIOnly()}
  else if(a==="pgn-pick"){S.pgnFormat=(d.fmt==="modern")?"modern":"classic";renderUIOnly()}
  else if(a==="pgn-copy"){const txt=formatPgnExport(S.pgnFormat);S.pgnModalOpen=false;copyText(txt,"PGN")}
  else if(a==="close-pgn"){S.pgnModalOpen=false;renderUIOnly()}
  else if(a==="start-replay")enterReplayMode();
  else if(a==="replay-first"){if(S.replay){stopReplayAuto();stepReplay(0,false)}}
  else if(a==="replay-prev"){if(S.replay){stopReplayAuto();stepReplay(S.replay.idx-1,true)}}
  else if(a==="replay-next"){if(S.replay){stopReplayAuto();stepReplay(S.replay.idx+1,true)}}
  else if(a==="replay-last"){if(S.replay){stopReplayAuto();stepReplay(S.replay.frames.length-1,true)}}
  else if(a==="replay-goto"){if(S.replay){stopReplayAuto();stepReplay(+d.v,true)}}
  else if(a==="replay-toggle")toggleReplayAuto();
  else if(a==="replay-exit")exitReplayMode();
});

$("#menu-backdrop").addEventListener("click",()=>{S.menuOpen=false;renderUIOnly()});
$("#drawer-bg").addEventListener("click",()=>{S.drawerOpen=false;renderUIOnly()});
$("#color-bg").addEventListener("click",e=>{if(e.target.id==="color-bg"){S.colorModalOpen=false;renderUIOnly()}});
$("#p2-bg").addEventListener("click",e=>{if(e.target.id==="p2-bg"){S.p2ModalOpen=false;renderUIOnly()}});
$("#pgn-bg").addEventListener("click",e=>{if(e.target.id==="pgn-bg"){S.pgnModalOpen=false;renderUIOnly()}});
$("#sb-bg").addEventListener("click",e=>{if(e.target.id==="sb-bg"){S.sbSetupOpen=false;renderUIOnly()}});
$("#promo-bg").addEventListener("click",e=>{
  if(e.target.id==="promo-bg"){
    if(performance.now()-S.ppAt<250)return;
    S.pp=null;renderUIOnly();
  }
});
$("#mate-bg").addEventListener("click",e=>{if(e.target.id==="mate-bg"){S.mateModalOpen=false;renderUIOnly()}});

bdEl.addEventListener("contextmenu",e=>e.preventDefault());
let drag=null,rc=null,dragRaf=0,dragLastX=0,dragLastY=0;

function flushDragFrame(){
  dragRaf=0;
  if(!drag||!drag.moved||!drag.el||!bdRect)return;
  const r=bdRect,sqW=r.width/8,sqH=r.height/8;
  const dx=Math.max(-sqW*.5,Math.min(r.width-sqW*.5,dragLastX-r.left-sqW*.5));
  const dy=Math.max(-sqH*.5,Math.min(r.height-sqH*.5,dragLastY-r.top-sqH*.5));
  drag.el.style.transform=`translate3d(${(dx/sqW)*100}%,${(dy/sqH)*100}%,0) scale(1.16)`;
}

function endDragCleanup(){
  if(dragRaf){cancelAnimationFrame(dragRaf);dragRaf=0}
  if(drag&&drag.el){
    drag.el.classList.remove("dragging");
    const[x,y]=pxCoord(drag.sq);
    placePiece(drag.el,x,y,true);
  }
  drag=null;
}

bdEl.addEventListener("pointerdown",e=>{
  if(e.button===2){
    e.preventDefault();stopBoardRotateAnim();cacheBoardRect();
    rc={s:sqAtClient(e.clientX,e.clientY),c:e.shiftKey?"red":e.ctrlKey?"yellow":e.altKey?"blue":"green"};
    return;
  }
  if(e.button!==0||S.pp||S.menuOpen||S.drawerOpen||S.colorModalOpen||S.p2ModalOpen||S.pgnModalOpen||S.sbSetupOpen||S.mateModalOpen)return;
  if(S.flipBusy)return;
  cacheBoardRect();
  const sq=sqAtClient(e.clientX,e.clientY);if(!sq)return;
  if(S.dm){
    drag={mode:"draw",sq,x:e.clientX,y:e.clientY,moved:false,id:e.pointerId};
    bdEl.setPointerCapture?.(e.pointerId);
    return;
  }
  if(!sideOK())return;
  if(S.sel&&S.legal.includes(sq)){
    S.dr={a:[],h:{}};ov();
    needPromo(S.sel,sq)?askPromo(S.sel,sq,false):doMove(S.sel,sq,null,false);
    return;
  }
  const p=S.g.get(sq);
  const canDrag=!!(p&&p.color===S.g.turn()&&((S.mode!=="bot"&&S.mode!=="coach")||p.color===S.col));
  if(canDrag){
    const wasSel=S.sel===sq;
    if(!wasSel){
      S.sel=sq;
      S.legal=S.g.moves({square:sq,verbose:true}).map(m=>m.to);
      S.hint=null;S.dr={a:[],h:{}};ov();
      syncGridHighlights();
      SND.click();
    }
    if(PE[sq])clearMoveAnim(PE[sq]);
    drag={mode:"piece",sq,x:e.clientX,y:e.clientY,moved:false,canDrag:true,wasSel,el:PE[sq],id:e.pointerId};
    bdEl.setPointerCapture?.(e.pointerId);
  }else{
    if(S.sel&&reportInvalidAttempt(S.sel,sq)){
      const prevSel=S.sel;
      S.sel=null;S.legal=[];
      renderUIOnly();
      shakeSq(prevSel);
    }else if(S.sel){
      S.sel=null;S.legal=[];S.dr={a:[],h:{}};ov();
      syncGridHighlights();
    }else if(hasDrawMarks()){
      S.dr={a:[],h:{}};S.ds=null;ov();renderDrawBar();
    }
  }
});

document.addEventListener("pointermove",e=>{
  if(rc){const t=sqAtClient(e.clientX,e.clientY);S.pv=rc.s&&t?[rc.s,t,rc.c]:null;scheduleOv();return}
  if(!drag||e.pointerId!==drag.id)return;
  const dist=Math.hypot(e.clientX-drag.x,e.clientY-drag.y);
  if(drag.mode==="draw"){
    if(dist>8)drag.moved=true;
    if(drag.moved){const t=sqAtClient(e.clientX,e.clientY);S.pv=t?[drag.sq,t,S.dc]:null;scheduleOv()}
    return;
  }
  if(!drag.canDrag||!drag.el)return;
  if(!drag.moved&&dist>6){
    drag.moved=true;
    drag.el.classList.add("dragging");
  }
  if(drag.moved){
    dragLastX=e.clientX;dragLastY=e.clientY;
    if(!dragRaf)dragRaf=requestAnimationFrame(flushDragFrame);
  }
});

function handlePointerFinish(e,cancelled){
  if(e.button===2&&rc){
    const t=cancelled?null:sqAtClient(e.clientX,e.clientY);
    if(rc.s&&t)draw(rc.s,t,rc.c);
    rc=null;S.pv=null;ov();return;
  }
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;
  if(dragRaf){cancelAnimationFrame(dragRaf);dragRaf=0}
  drag=null;S.pv=null;
  if(cancelled){
    if(d.el){
      d.el.classList.remove("dragging");
      const[x,y]=pxCoord(d.sq);
      placePiece(d.el,x,y,false,1);
    }
    S.sel=null;S.legal=[];syncGridHighlights();ov();return;
  }
  const target=sqAtClient(e.clientX,e.clientY);
  if(d.mode==="draw"){
    if(d.moved&&target){S.ds=null;draw(d.sq,target,S.dc)}
    else drawTap(d.sq);
    return;
  }
  if(d.moved){
    if(target&&target!==d.sq&&S.legal.includes(target)){
      if(d.el)d.el.classList.remove("dragging");
      if(needPromo(d.sq,target)){
        if(d.el){const[x,y]=pxCoord(d.sq);placePiece(d.el,x,y,true)}
        askPromo(d.sq,target,true);
      }else{
        doMove(d.sq,target,null,true);
      }
    }else{
      const invalidShake=!!(target&&target!==d.sq&&reportInvalidAttempt(d.sq,target));
      if(d.el){
        d.el.classList.remove("dragging");
        const[x,y]=pxCoord(d.sq);
        placePiece(d.el,x,y,invalidShake,1);
      }
      if(invalidShake)shakeSq(d.sq);
      S.sel=null;S.legal=[];renderUIOnly();
    }
  }else{
    if(d.el)d.el.classList.remove("dragging");
    if(d.wasSel){
      S.sel=null;S.legal=[];syncGridHighlights();ov();
    }
  }
}

document.addEventListener("pointerup",e=>handlePointerFinish(e,false));
document.addEventListener("pointercancel",e=>handlePointerFinish(e,true));
window.addEventListener("blur",endDragCleanup);
window.addEventListener("pagehide",()=>{save();saveMatchState()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){save();saveMatchState()}});

document.addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==="Escape"){
    if(S.mateModalOpen){S.mateModalOpen=false;renderUIOnly()}
    else if(S.pp){S.pp=null;renderUIOnly()}
    else if(S.pgnModalOpen){S.pgnModalOpen=false;renderUIOnly()}
    else if(S.p2ModalOpen){S.p2ModalOpen=false;renderUIOnly()}
    else if(S.sbSetupOpen){S.sbSetupOpen=false;renderUIOnly()}
    else if(S.colorModalOpen){S.colorModalOpen=false;renderUIOnly()}
    else if(S.menuOpen){S.menuOpen=false;renderUIOnly()}
    else if(S.drawerOpen){S.drawerOpen=false;renderUIOnly()}
    else{S.dr={a:[],h:{}};S.ds=null;ov();renderDrawBar()}
  }else if(e.key==="f"||e.key==="F"){if(S.mode!=="sandbox"){cancelFlipTimer();triggerBoardRotateAnim(!S.flip)}}
  else if(e.key==="ArrowLeft"){if(S.replay){stopReplayAuto();stepReplay(S.replay.idx-1,true)}else undo()}
  else if(e.key==="ArrowRight"){if(S.replay){stopReplayAuto();stepReplay(S.replay.idx+1,true)}else redo()}
});

let _sliderRaf=0;
document.addEventListener("input",e=>{
  const a=e.target.dataset.a;
  if(a==="vol"){
    P.vol=+e.target.value;scheduleSave();
    if(!_sliderRaf){
      _sliderRaf=requestAnimationFrame(()=>{
        _sliderRaf=0;
        const vv=$("#volv");if(vv)vv.textContent=Math.round(P.vol*100)+"%";
      });
    }
    LocalAudioEngine.syncVolumes();
    SND.click();
  }else if(a==="psz"){
    P.pieceBoost=+e.target.value;scheduleSave();
    applyUIScale();
    if(!_sliderRaf){
      _sliderRaf=requestAnimationFrame(()=>{
        _sliderRaf=0;
        const pv=$("#pszv");if(pv)pv.textContent=(P.pieceBoost>0?"+"+P.pieceBoost:P.pieceBoost)+"%";
        document.querySelectorAll('#menu-pop button[data-a="psz"]').forEach(btn=>btn.classList.toggle("on",+btn.dataset.v===P.pieceBoost));
      });
    }
  }
});

/* Real-Time Local Midnight Countdown & Rollover Ticker */
setInterval(()=>{
  const nowDay=todayKey();
  if(nowDay!==activeDailyDay){
    activeDailyDay=nowDay;
    getDailyState();
    if(S.mode==="puz")startPuzzle(0);
    else renderUIOnly();
    return;
  }
  if(S.tab!=="me"&&S.mode!=="puz")return;
  const dEl=$("#daily-cd"),bEl=$("#banner-cd");
  if(!dEl&&!bEl)return;
  const cd=formatMidnightCountdown();
  if(dEl)dEl.textContent=cd;
  if(bEl)bEl.textContent=cd;
},1000);

const _resumed=restoreMatchState();
render();
if(_resumed&&!S.over&&(S.mode==="bot"||S.mode==="coach")&&S.g.turn()!==S.col)triggerBotMove();
})();
</script>
