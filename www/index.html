<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#161512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rookie – Learn Chess</title>
<style>
:root{
  --bg:#161512;
  --pn:#262421;
  --pn2:#302d29;
  --tx:#e8e6e1;
  --mu:#a39e95;
  --ac:#7fa650;
  --ac-soft:rgba(127,166,80,.16);
  --ac-ring:rgba(127,166,80,.42);
  --acon:#0f1d09;
  --lt:#ebecd0;
  --dk:#739552;
  --bd:#3c3833;
  --err:#e05a55;
  --hint:#4995ff;
  --shadow:0 8px 24px rgba(0,0,0,.34);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f1efe9;
    --pn:#ffffff;
    --pn2:#e8e4da;
    --tx:#201e1b;
    --mu:#68645c;
    --ac:#5e8336;
    --ac-soft:rgba(94,131,54,.14);
    --ac-ring:rgba(94,131,54,.38);
    --acon:#ffffff;
    --bd:#d6d1c6;
    --shadow:0 8px 20px rgba(32,30,27,.12);
  }
}
:root[data-theme="light"]{
  --bg:#f1efe9;
  --pn:#ffffff;
  --pn2:#e8e4da;
  --tx:#201e1b;
  --mu:#68645c;
  --ac:#5e8336;
  --ac-soft:rgba(94,131,54,.14);
  --ac-ring:rgba(94,131,54,.38);
  --acon:#ffffff;
  --bd:#d6d1c6;
  --shadow:0 8px 20px rgba(32,30,27,.12);
}
*,*::before,*::after{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  height:100dvh;
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:manipulation;
  background:var(--bg);
  color:var(--tx);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
body{
  display:flex;
  flex-direction:column;
}

/* Header & Navigation */
header{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:10px;
  min-height:58px;
  padding:calc(8px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) 8px calc(14px + env(safe-area-inset-left,0px));
  background:var(--pn);
  border-bottom:1px solid var(--bd);
}
.brand{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:17px;
  font-weight:800;
  letter-spacing:-.01em;
  white-space:nowrap;
  flex:0 0 auto;
}
.brand-ic{
  width:24px;
  height:24px;
  color:var(--ac);
  flex:0 0 auto;
}
.nav-tabs{
  display:flex;
  align-items:center;
  gap:6px;
  margin-left:6px;
}
.nav-right{
  display:flex;
  align-items:center;
  gap:8px;
  margin-left:auto;
  flex:0 0 auto;
}

/* Buttons & Controls */
button{
  font:inherit;
  color:var(--tx);
  background:var(--pn);
  border:1px solid var(--bd);
  border-radius:12px;
  padding:0 14px;
  min-height:44px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-size:14px;
  font-weight:600;
  line-height:1.2;
  white-space:nowrap;
  flex-shrink:0;
  cursor:pointer;
  transition:border-color .14s ease,background-color .14s ease,color .14s ease,transform .08s ease;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
}
button svg,.ico{
  width:18px;
  height:18px;
  flex:0 0 auto;
  display:block;
}
button:active:not(:disabled){transform:scale(.97)}
button:hover:not(:disabled){border-color:var(--ac)}
button.on,button.pri{
  background:var(--ac);
  color:var(--acon);
  border-color:var(--ac);
  font-weight:700;
}
button:disabled{opacity:.42;cursor:default}

.icon-btn{
  width:44px;
  height:44px;
  min-width:44px;
  min-height:44px;
  padding:0;
  border-radius:12px;
}
.icon-btn svg{width:20px;height:20px}
.mode-pill{
  height:44px;
  min-height:44px;
  padding:0 13px;
  border-radius:12px;
  font-size:13px;
  background:var(--pn2);
}
.mode-pill.on{
  background:var(--ac-soft);
  color:var(--ac);
  border-color:var(--ac-ring);
}

/* Fixed Bottom Navigation Bar (Mobile <= 820px) */
#tabbar{
  display:none;
  flex:0 0 auto;
  background:var(--pn);
  border-top:1px solid var(--bd);
  padding:6px calc(8px + env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) calc(8px + env(safe-area-inset-left,0px));
}
.tab-btn{
  flex-direction:column;
  gap:3px;
  min-height:50px;
  height:auto;
  width:100%;
  padding:6px 4px;
  border-radius:12px;
  border:1px solid transparent;
  background:transparent;
  color:var(--mu);
  font-size:11px;
  font-weight:600;
  letter-spacing:.01em;
}
.tab-btn svg{width:21px;height:21px}
.tab-btn:hover:not(:disabled){border-color:transparent;color:var(--tx)}
.tab-btn.on{
  background:var(--ac-soft);
  color:var(--ac);
  border-color:var(--ac-ring);
  font-weight:700;
}

/* Main Workspace Layout */
main{
  flex:1 1 0;
  min-height:0;
  width:100%;
  max-width:1140px;
  margin:0 auto;
  padding:16px calc(18px + env(safe-area-inset-right,0px)) 16px calc(18px + env(safe-area-inset-left,0px));
  display:grid;
  grid-template-columns:minmax(0,1.22fr) minmax(320px,1fr);
  gap:18px;
  align-items:stretch;
  overflow:hidden;
}
main>section{min-width:0}
.stage{
  display:flex;
  flex-direction:column;
  min-height:0;
  gap:12px;
}
#bwrap{
  flex:1 1 0;
  min-height:0;
  display:grid;
  place-items:center;
  container-type:size;
}
#bw{
  position:relative;
  width:min(100cqw,100cqh);
  height:min(100cqw,100cqh);
  min-width:0;
  margin:0;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}
#bd{
  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  grid-template-rows:repeat(8,minmax(0,1fr));
  width:100%;
  height:100%;
  border-radius:10px;
  overflow:hidden;
  border:1.5px solid var(--bd);
  box-shadow:var(--shadow);
  transform:translateZ(0);
}
.sq{
  position:relative;
  display:grid;
  place-items:center;
  min-width:0;
  min-height:0;
  cursor:pointer;
}
.l{background:var(--lt)}
.d{background:var(--dk)}
.sq.last{box-shadow:inset 0 0 0 100px rgba(255,220,0,.34)}
.sq.sel{box-shadow:inset 0 0 0 100px rgba(255,235,0,.56)}
.sq.chk{box-shadow:inset 0 0 0 100px rgba(255,45,45,.56)}
.sq.h1{box-shadow:inset 0 0 0 100px rgba(60,140,255,.52)}
.sq.h2{box-shadow:inset 0 0 0 100px rgba(40,200,120,.55)}
.sq[data-r]::before{
  content:attr(data-r);
  position:absolute;
  left:4px;
  top:3px;
  font-size:clamp(9.5px,2.4vw,11.5px);
  font-weight:800;
  color:rgba(28,32,22,.68);
  line-height:1;
  pointer-events:none;
  z-index:2;
}
.sq[data-f]::after{
  content:attr(data-f);
  position:absolute;
  right:4px;
  bottom:3px;
  font-size:clamp(9.5px,2.4vw,11.5px);
  font-weight:800;
  color:rgba(28,32,22,.68);
  line-height:1;
  pointer-events:none;
  z-index:2;
}
.sq.d[data-r]::before,.sq.d[data-f]::after{
  color:rgba(255,255,255,.78);
}
.sq .ind{
  position:absolute;
  pointer-events:none;
  z-index:3;
}
.sq.mv .ind{
  width:28%;
  height:28%;
  border-radius:50%;
  background:rgba(0,0,0,.24);
  animation:fi .15s ease-out;
}
.sq.cap .ind{
  inset:7%;
  border-radius:50%;
  border:4px solid rgba(0,0,0,.26);
  animation:fi .15s ease-out;
}

#pl{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:5;
  overflow:hidden;
  border-radius:10px;
}
.pp{
  position:absolute;
  left:0;
  top:0;
  width:12.5%;
  height:12.5%;
  display:grid;
  place-items:center;
  padding:4%;
  will-change:transform;
  pointer-events:none;
}
.pp svg,.pkb svg{width:100%;height:100%;display:block}
.pp.lift{z-index:25;filter:drop-shadow(0 8px 6px rgba(0,0,0,.45))}
.pp.chk{animation:pls 1.3s ease-in-out infinite}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
#pk{position:absolute;inset:0;z-index:30;pointer-events:none;border-radius:10px;overflow:hidden}
.pkbg{position:absolute;inset:0;background:rgba(0,0,0,.5);pointer-events:auto}
.pkc{
  position:absolute;
  width:12.5%;
  display:flex;
  gap:2px;
  padding:2px;
  background:#eeebe3;
  border-radius:10px;
  box-shadow:0 10px 26px rgba(0,0,0,.55);
  pointer-events:auto;
}
.pkb{
  width:100%;
  aspect-ratio:1;
  padding:8%;
  display:grid;
  place-items:center;
  border:0;
  background:transparent;
  border-radius:8px;
  min-height:0;
}
.pkb:hover,.pkb:active{background:rgba(127,166,80,.42)}

/* Board Controls Strip */
#bctl{
  display:flex;
  gap:8px;
  flex-wrap:nowrap;
  overflow-x:auto;
  align-items:center;
  justify-content:center;
  padding:2px 2px;
  scrollbar-width:none;
}
#bctl::-webkit-scrollbar{display:none}
#bctl button{
  flex:0 0 auto;
  min-height:44px;
  padding:0 13px;
  border-radius:12px;
  font-size:13.5px;
  font-weight:600;
}
#bctl .sw{
  width:38px;
  height:38px;
  min-width:38px;
  min-height:38px;
  padding:0;
  border-radius:50%;
  flex:0 0 auto;
}

/* Side / Scrollable Cards Panel */
#side{
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding-right:4px;
}
.pnl{
  background:var(--pn);
  border:1px solid var(--bd);
  border-radius:14px;
  padding:14px 16px;
  margin-bottom:12px;
}
.pnl h3{
  margin:0 0 8px;
  font-size:16px;
  font-weight:700;
  letter-spacing:-.01em;
}
.mu{color:var(--mu);font-size:13.5px;line-height:1.45}
.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
  align-items:center;
}
.row button{
  min-height:44px;
  padding:0 14px;
  border-radius:10px;
  font-size:13.5px;
}
.msg{
  border-left:4px solid var(--ac);
  padding:9px 12px;
  background:rgba(127,166,80,.13);
  border-radius:8px;
  margin:8px 0;
  font-size:14px;
  line-height:1.45;
}
.msg.bad{border-color:var(--err);background:rgba(224,90,85,.13)}
.msg.hint{border-color:var(--hint);background:rgba(73,149,255,.13)}
.bar{
  height:10px;
  background:var(--bd);
  border-radius:999px;
  overflow:hidden;
}
.bar i{
  display:block;
  height:100%;
  background:var(--ac);
  border-radius:999px;
  transition:width .25s ease;
}
.li{
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:100%;
  min-height:46px;
  padding:0 14px;
  border-radius:10px;
  text-align:left;
  margin-bottom:7px;
}
.li.dn::after{content:"✓";color:var(--ac);font-weight:800;font-size:15px}
.stats-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-top:12px;
}
.stat{
  background:var(--pn2);
  border:1px solid var(--bd);
  border-radius:12px;
  padding:10px 12px;
  font-size:12.5px;
  color:var(--mu);
}
.stat b{
  display:block;
  color:var(--tx);
  font-size:20px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  line-height:1.2;
  margin-bottom:2px;
}
.vol-wrap{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:8px;
}
.vol-wrap input[type="range"]{
  flex:1 1 auto;
  height:36px;
  accent-color:var(--ac);
  cursor:pointer;
}
.vol-val{
  min-width:42px;
  text-align:right;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  font-size:13.5px;
  color:var(--tx);
}
code{
  display:block;
  word-break:break-all;
  font-size:12px;
  padding:8px 10px;
  margin-top:6px;
  background:var(--pn2);
  border:1px solid var(--bd);
  border-radius:8px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.sq.lf{animation:lf .35s ease-out}
@keyframes fi{from{opacity:0;transform:scale(.45)}}
@keyframes lf{from{box-shadow:inset 0 0 0 100px rgba(255,220,0,0)}}
@keyframes pls{50%{filter:drop-shadow(0 0 7px #ff3b30)}}
.rm *,.rm *::after{animation:none!important;transition:none!important}

/* Mobile Portrait: Compact Top Bar + Optimally Scaled Board + Scrollable Cards + Fixed Bottom Nav */
@media (max-width:820px){
  header{
    min-height:54px;
    padding:calc(6px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 6px calc(12px + env(safe-area-inset-left,0px));
    gap:8px;
  }
  .nav-tabs{display:none}
  #tabbar{
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:4px;
  }
  main{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:10px calc(12px + env(safe-area-inset-right,0px)) 4px calc(12px + env(safe-area-inset-left,0px));
  }
  .stage{
    flex:0 0 auto;
    align-items:center;
    gap:10px;
    width:100%;
  }
  #bwrap{
    flex:0 0 auto;
    width:100%;
    display:flex;
    justify-content:center;
    container-type:normal;
  }
  #bw{
    width:min(100%,46dvh);
    height:auto;
    aspect-ratio:1 / 1;
  }
  #bctl{
    width:100%;
    justify-content:flex-start;
  }
  #bctl.few{
    justify-content:center;
  }
  #side{
    flex:1 1 0;
    min-height:0;
    padding:0 0 8px;
  }
}

/* Short Mobile Landscape Fallback */
@media (max-width:900px) and (max-height:520px){
  header .nav-tabs{display:none}
  #tabbar{
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:4px;
    padding-top:4px;
    padding-bottom:calc(4px + env(safe-area-inset-bottom,0px));
  }
  .tab-btn{min-height:44px;padding:4px}
  main{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    grid-template-rows:minmax(0,1fr);
    gap:12px;
    padding:8px calc(12px + env(safe-area-inset-right,0px)) 8px calc(12px + env(safe-area-inset-left,0px));
  }
  .stage{
    height:100%;
    align-items:stretch;
  }
  #bwrap{
    flex:1 1 0;
    min-height:0;
    display:grid;
    place-items:center;
    container-type:size;
  }
  #bw{
    width:min(100cqw,100cqh);
    height:min(100cqw,100cqh);
    aspect-ratio:auto;
  }
}
</style>
</head>
<body>
<header id="nav"></header>
<main>
  <section class="stage">
    <div id="bwrap">
      <div id="bw">
        <div id="bd"></div>
        <div id="pl"></div>
        <div id="pk"></div>
        <svg id="ov" viewBox="0 0 80 80" shape-rendering="geometricPrecision"></svg>
      </div>
    </div>
    <div id="bctl"></div>
  </section>
  <section id="side"></section>
</main>
<nav id="tabbar" aria-label="Main navigation"></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
(()=>{
"use strict";
const $=q=>document.querySelector(q);
const def={done:{},pz:{s:0,a:0,r:800,st:0,cat:{},ok:{}},g:{w:0,d:0,l:0},vol:.6,mute:false,beg:true,theme:"auto"};
let P;
try{P=Object.assign({},def,JSON.parse(localStorage.getItem("rookie")||"{}"))}catch(e){P=Object.assign({},def)}
P.pz=Object.assign({},def.pz,P.pz||{});
P.pz.cat=P.pz.cat||{};P.pz.ok=P.pz.ok||{};
P.g=Object.assign({},def.g,P.g||{});
P.fx=Object.assign({anim:true,spd:1,cap:true,hl:true,arr:true,cl:true,rm:false},P.fx||{});
const save=()=>{try{localStorage.setItem("rookie",JSON.stringify(P))}catch(e){}};
const applyTheme=()=>{
  const r=document.documentElement;
  if(P.theme==="dark"||P.theme==="light")r.setAttribute("data-theme",P.theme);
  else r.removeAttribute("data-theme");
  const isLight=P.theme==="light"||(P.theme==="auto"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme:light)").matches);
  const mc=document.querySelector('meta[name="theme-color"]');
  if(mc)mc.setAttribute("content",isLight?"#f1efe9":"#161512");
};
applyTheme();

/* ---------- Crisp Inline UI Vector Icons ---------- */
const IC={
  knight:`<svg viewBox="0 0 24 24" fill="currentColor" shape-rendering="geometricPrecision" aria-hidden="true"><path d="M19 20H5v-2h14v2zm-1.6-3.5H7.2c.2-1.8 1.2-3.1 2.7-4.2 1.4-1 2.2-2.2 2.2-3.5l-1.4 1.2c-.7.6-1.6.7-2.4.3L5.6 9.1c-.9-.4-1.2-1.5-.6-2.3l3.1-3.4c1.2-.8 2.7-1.1 4.1-.7l2.5-1.4-.4 2.5c2.7 2.4 3.4 6.1 3.1 12.7z"/></svg>`,
  home:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" shape-rendering="geometricPrecision" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg>`,
  learn:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" shape-rendering="geometricPrecision" aria-hidden="true"><path d="M2 6.5C2 5.4 2.9 4.5 4 4.5h5.5c1.4 0 2.5 1.1 2.5 2.5v12.5c0-1.1-.9-2-2-2H4c-1.1 0-2-.9-2-2V6.5z"/><path d="M22 6.5c0-1.1-.9-2-2-2h-5.5C13.1 4.5 12 5.6 12 7v12.5c0-1.1.9-2 2-2h6c1.1 0 2-.9 2-2V6.5z"/></svg>`,
  puz:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" shape-rendering="geometricPrecision" aria-hidden="true"><path d="M10 4a2 2 0 1 1 4 0v1h4v4h1a2 2 0 1 1 0 4h-1v4h-4v-1a2 2 0 1 0-4 0v1H6v-4H5a2 2 0 1 1 0-4h1V5h4V4z"/></svg>`,

/* ---------- Web Audio SFX (unlocked on first mobile touch) ---------- */
let AC=null;
function unlockAudio(){
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx)return;
    if(!AC)AC=new Ctx();
    if(AC.state==="suspended")AC.resume().catch(()=>{});
  }catch(e){}
}
document.addEventListener("pointerdown",unlockAudio,{passive:true});
function tone(f,d=.08,ty="sine",v=.18,t0=0){
  if(P.mute||P.vol<=.01)return;
  try{
    unlockAudio();
    if(!AC)return;
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;
    o.type=ty;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(Math.max(.001,v*P.vol),t);
    g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(AC.destination);
    o.start(t);o.stop(t+d);
  }catch(e){}
}

      const[cx,cy]=kn?(Math.abs(dx)>Math.abs(dy)?[x2,y1]:[x1,y2]):[x1,y1];
      const l=Math.hypot(x2-cx,y2-cy);if(!l)continue;

}

function put(e,x,y){e.style.transform=`translate(${x*100}%,${y*100}%)`}
function mk(t,c,sq){
  const e=document.createElement("div");
  e.className="pp "+c;
  e.innerHTML=pieceSvg(t,c);
  put(e,...PX(sq));
  $("#pl").appendChild(e);
  return e;
}
function pieces(){
  const g=S.g;$("#pl").textContent="";
  for(const k in PE)delete PE[k];
  g.board().forEach((row,i)=>row.forEach((p,j)=>{
    if(!p)return;
    const sq="abcdefgh"[j]+(8-i),e=mk(p.type,p.color,sq);
    PE[sq]=e;
    if(p.type==="k"&&p.color===g.turn()&&g.in_check())e.classList.add("chk");
  }));
}
function tween(ms,ease,step,done,tk){
  const t0=performance.now();
  const f=n=>{
    if(tk!==S.rt)return;
    const k=Math.min(1,Math.max(0,(n-t0)/ms));
    step(ease(k));
    k<1?requestAnimationFrame(f):done&&done();
  };
  requestAnimationFrame(f);
}
function fx(){
  const a=S.anim,sh=S.shake;S.anim=S.shake=null;
  const tk=++S.rt;pieces();
  const d=dur();
  if(sh&&d)PE[sh]?.animate([0,-7,7,-4,3,0].map(x=>({translate:`${x}px 0`})),{duration:320});
  if(!a||!d)return;
  const m=a.m,rev=a.rev,fs=rev?m.to:m.from,ts=rev?m.from:m.to,el=PE[ts];
  if(!el)return;
  const[x1,y1]=PX(fs),[x2,y2]=PX(ts),dist=Math.hypot(x2-x1,y2-y1);
  const cap=!!m.captured&&!rev&&P.fx.cap,ms=d*(.8+.04*dist);
  const cs=m.flags.includes("e")?m.to[0]+m.from[1]:m.to,promo=!!m.promotion&&!rev;
  S.until=performance.now()+ms+(promo?240:60);
  const glide=(e,a0,b0,cb)=>{
    const[p,q]=PX(a0),[r,s]=PX(b0);
    e.classList.add("lift");put(e,p,q);
    tween(ms,ez,k=>put(e,p+(r-p)*k,q+(s-q)*k),()=>{e.classList.remove("lift");cb&&cb()},tk);
  };
  let v=null;
  if(cap){
    v=mk(m.captured,m.color==="w"?"b":"w",cs);
    setTimeout(()=>{if(tk===S.rt&&v)tween(130,ez,k=>{v.style.opacity=1-k},()=>v.remove(),tk)},ms*.82);
  }
  if(promo)el.innerHTML=pieceSvg("p",m.color);
  if(m.piece==="k"&&/[kq]/.test(m.flags)){
    const k=m.flags.includes("k"),r=m.from[1],rf=(k?"h":"a")+r,rt=(k?"f":"d")+r,re=PE[rev?rf:rt];
    if(re)glide(re,rev?rt:rf,rev?rf:rt,null);
  }
  if(rev&&m.captured){
    const vv=PE[cs];
    if(vv)tween(280,ez,k=>{vv.style.opacity=k;vv.style.scale=.5+.5*k},()=>{vv.style.opacity=vv.style.scale=""},tk);
  }
  glide(el,fs,ts,()=>{
    if(promo){
      el.innerHTML=pieceSvg(m.promotion,m.color);
      tween(220,ez,k=>{el.style.scale=1.45-.45*k},()=>{el.style.scale=""},tk);
    }
    if(cap&&v)v.remove();
    if(!rev&&m.san.endsWith("#")){
      $("#pl .chk")?.animate(
        [{rotate:"0deg",scale:"1"},{rotate:"-14deg",scale:"1.35"},{rotate:"10deg",scale:"1.15"},{rotate:"0deg",scale:"1.25"}],
        {duration:700,easing:"ease-out",fill:"forwards"}
      );
      $("#bd").animate([{filter:"brightness(1)"},{filter:"brightness(1.25)"},{filter:"brightness(1)"}],{duration:700});
    }
  });
}

/* ---------- Game Lifecycle & Navigation ---------- */
function load(fen){
  S.busy=false;S.pp=null;SFstop();S.tok++;
  S.dr={a:[],h:{}};S.ds=null;S.anim=null;S.until=0;
  S.g=new Chess(fen);S.sel=null;S.legal=[];S.last=null;
  S.h=0;S.hint=null;S.hm="";S.redo=[];S.solved=false;
  S.bad=false;S.ex="";S.tried=false;S.over="";
}
function go(v){
  S.v=v;S.flip=false;
  if(v==="learn")startStep();
  else if(v==="puz")startPz();
  else if(v==="play"){load(new Chess().fen());S.col="w"}
  else{load(new Chess().fen());S.msg=""}
  render();
}
function startStep(){load(cur().fen);S.msg=cur().tx}
function startPz(){const p=PZ[S.pi];load(p.fen);S.flip=S.g.turn()==="b";S.msg=p.t}

/* ---------- AI: Optional Stockfish Worker + Offline Alpha-Beta Fallback ---------- */
const SF={ok:false,w:null,cb:null,pend:0};
function SFinit(){
  try{
    const u="https://cdn.jsdelivr.net/npm/stockfish@10.0.2/src/stockfish.js";
    const w=new Worker(URL.createObjectURL(new Blob([`importScripts("${u}")`],{type:"text/javascript"})));
    SF.w=w;
    w.onmessage=e=>{
      const l=String(e.data);
      if(l==="uciok"){SF.ok=true;w.postMessage("isready")}
      else if(l.startsWith("bestmove")){SF.pend=Math.max(0,SF.pend-1);if(SF.pend===0&&SF.cb)SF.cb(l)}
      else if(SF.cb)SF.cb(l);
    };
    w.onerror=()=>{SF.ok=false;SF.w=null};
    w.postMessage("uci");
  }catch(e){SF.ok=false}
}
function SFstop(){SF.cb=null;if(SF.w&&SF.pend>0)SF.w.postMessage("stop")}

const V={p:100,n:320,b:330,r:500,q:900,k:0};
function ev(g){
  let s=0;
  g.board().forEach((row,r)=>row.forEach((x,c)=>{
    if(!x)return;
    let v=V[x.type];
    if(x.type==="p")v+=(x.color==="w"?6-r:r-1)*6;
    if(c>1&&c<6&&r>1&&r<6&&"pnb".includes(x.type))v+=10;
    s+=x.color==="w"?v:-v;
  }));
  return s;
}
function abT(g,d,a,b,dl,c){
  if((++c.n&63)===0&&performance.now()>dl)throw 0;
  const w=g.turn()==="w";
  if(g.in_checkmate())return w?-1e5-d:1e5+d;
  if(g.in_draw())return 0;
  if(!d)return ev(g);
  let best=w?-1e9:1e9;
  const ms=g.moves({verbose:true}).sort((x,y)=>(y.captured?1:0)-(x.captured?1:0));
  for(const m of ms){
    g.move({from:m.from,to:m.to,promotion:m.promotion});
    let v;try{v=abT(g,d-1,a,b,dl,c)}finally{g.undo()}
    if(w){best=Math.max(best,v);a=Math.max(a,v)}else{best=Math.min(best,v);b=Math.min(b,v)}
    if(b<=a)break;
  }
  return best;
}
function pickT(g,L,bud){
  const dl=performance.now()+bud,w=g.turn()==="w",c={n:0};
  let all=g.moves({verbose:true}),best=all[0];
  for(let d=1;d<=L.d;d++){
    try{
      const sc=all.map(m=>{
        g.move({from:m.from,to:m.to,promotion:m.promotion});
        let v;try{v=abT(g,d-1,-1e9,1e9,dl,c)}finally{g.undo()}
        return[m,v+Math.random()*L.r];
      });
      sc.sort((x,y)=>w?y[1]-x[1]:x[1]-y[1]);
      best=sc[0][0];all=sc.map(x=>x[0]);
    }catch(e){break}
  }
  return best;
}
function cplx(g){
  const ms=g.moves({verbose:true}),n=ms.length;if(n<=1)return 0;
  let s=Math.min(1,n/40)*.3+Math.min(1,ms.filter(m=>m.captured).length/6)*.2+(g.in_check()?.15:0)+Math.min(1,ms.filter(m=>/[+#]/.test(m.san)).length/4)*.1;
  let w=0,b=0,pc=0;
  g.board().forEach(r=>r.forEach(x=>{if(x){pc++;if(x.type!=="k"){if(x.color==="w")w+=V[x.type];else b+=V[x.type]}}}));
  s+=Math.min(1,Math.abs(w-b)/300)*.1+(pc>12&&pc<30?.1:0);
  try{
    const f=g.fen().split(" ");f[1]=f[1]==="w"?"b":"w";f[3]="-";
    s+=Math.min(1,new Chess(f.join(" ")).moves({verbose:true}).filter(m=>m.captured).length/4)*.15;
  }catch(e){}
  return Math.min(1,s);
}
const thinkMs=(g,L)=>g.moves().length<=1?Math.max(180,L.lo*400):(L.lo+(L.hi-L.lo)*cplx(g))*1000;
const thTxt=()=>S.th&&S.th.done?"Move found — playing it now":`AI is thinking · ${S.th?S.th.eng:""}${S.th&&S.th.depth?" · depth "+S.th.depth:""}${S.th&&S.th.nodes?" · "+(S.th.nodes/1000|0)+"k nodes":""}`;
function thUpd(){const e=$("#th");if(e)e.textContent=thTxt()}
function cancelAI(){S.tok++;S.busy=false;SFstop()}
function ai(){
  if(S.busy)return;
  const tk=++S.tok,g=S.g,fen=g.fen(),L=LV[S.lvl],ms=thinkMs(g,L),t0=performance.now();
  S.busy=true;S.th={eng:SF.ok?"Stockfish":"Built-in search"};
  if(!SF.ok)S.th.depth=L.d;
  render();
  const legal=u=>g.moves({verbose:true}).find(m=>m.from+m.to+(m.promotion||"")===u);
  const built=()=>pickT(g,L,Math.max(150,ms*.7));
  const play=mv=>{
    if(tk!==S.tok)return;
    S.th={done:1};thUpd();
    setTimeout(()=>{
      if(tk!==S.tok||S.g.fen()!==fen)return;
      const m=S.g.move({from:mv.from,to:mv.to,promotion:mv.promotion});
      if(!m){S.busy=false;render();return}
      S.last=[m.from,m.to];S.ex="Opponent: "+explain(m,S.g);
      snd(kind(m,S.g));S.anim={m};clr();S.busy=false;endCheck();render();
    },Math.max(0,ms-(performance.now()-t0),S.until-performance.now()+30));
  };
  if(SF.ok){
    SF.pend++;
    SF.cb=l=>{
      if(tk!==S.tok)return;
      if(l.startsWith("info")){
        const d=/ depth (\d+)/.exec(l),n=/ nodes (\d+)/.exec(l);
        if(d)S.th.depth=+d[1];if(n)S.th.nodes=+n[1];thUpd();
      }else if(l.startsWith("bestmove")){
        SF.cb=null;play(legal(l.split(" ")[1])||built());
      }
    };
    SF.w.postMessage("setoption name Skill Level value "+L.sk);
    SF.w.postMessage("position fen "+fen);
    SF.w.postMessage(`go depth ${L.sd} movetime ${Math.round(ms*.85)}`);
    setTimeout(()=>{
      if(tk===S.tok&&S.th&&!S.th.done){
        SF.cb=null;if(SF.pend>0)SF.w.postMessage("stop");
        S.th.eng="Built-in search (Stockfish fallback)";thUpd();play(built());
      }
    },ms+2200);
  }else{
    setTimeout(()=>{if(tk===S.tok)play(built())},25);
  }
}

/* ---------- Coaching Explanations & Moves ---------- */
function explain(m,g){
  let t=`${N[m.piece]} ${m.from}→${m.to}.`;
  if(m.captured)t+=` Captures a ${N[m.captured]}.`;
  if(/[kq]/.test(m.flags)&&m.piece==="k")t+=" Castling: king to safety, rook into play.";
  if(m.flags.includes("e"))t+=" En passant capture.";
  if(m.promotion)t+=" Promoted to a "+N[m.promotion]+".";
  if(g.in_checkmate())t+=" Checkmate!";
  else if(g.in_check())t+=" Gives check.";
  if("de".includes(m.to[0])&&"45".includes(m.to[1]))t+=" Fights for the centre.";
  if("nb".includes(m.piece)&&m.from[1]===(m.color==="w"?"1":"8"))t+=" Develops a piece.";
  if(!g.in_checkmate()&&g.moves({verbose:true}).some(x=>x.to===m.to&&x.captured))t+=" ⚠ This piece can be captured next move.";
  if(P.beg){
    const s=m.san;
    t+=` Notation “${s}”: `+(s[0]==="O"?"castling.":(/[NBRQK]/.test(s[0])?N[m.piece][0].toUpperCase()+N[m.piece].slice(1)+" (capital letter = piece; pawns have no letter)":"pawn move")+(s.includes("x")?", x = capture":"")+(s.includes("+")?", + = check":"")+(s.includes("#")?", # = checkmate":"")+".");
  }
  return t;
}

const needPromo=(f,t)=>S.g.moves({square:f,verbose:true}).some(m=>m.to===t&&m.promotion);
function askPromo(f,t){S.pp={f,t,c:S.g.get(f).color};S.sel=null;S.legal=[];render()}
function sideOK(){return S.v==="play"?(!S.busy&&!S.over&&S.g.turn()===S.col):(!S.solved&&!S.over)}

function clickSq(sq){
  if(S.dm)return drawTap(sq);
  if(S.pp||performance.now()<S.until||(!sideOK()&&S.v!=="free"))return;
  S.dr={a:[],h:{}};
  const g=S.g,p=g.get(sq);
  if(S.sel&&S.legal.includes(sq)){
    return needPromo(S.sel,sq)?askPromo(S.sel,sq):doMove(S.sel,sq);
  }
  if(p&&p.color===g.turn()&&(S.v!=="play"||p.color===S.col)){
    S.sel=sq;S.legal=g.moves({square:sq,verbose:true}).map(m=>m.to);S.hint=null;SND.click();
  }else{
    if(S.sel&&p&&S.v!=="free"){
      S.msg="That piece can’t move there — look for the dots showing legal squares.";
      S.bad=true;S.shake=S.sel;SND.err();
    }
    S.sel=null;S.legal=[];
  }
  render();
}

function doMove(f,t,pr){
  const g=S.g,m=g.move({from:f,to:t,promotion:pr||"q"});
  if(!m)return;
  S.sel=null;S.legal=[];S.redo=[];S.hint=null;S.last=[f,t];S.ex=explain(m,g);
  const sk=kind(m,g),L=g.history().length;S.bad=false;
  if(S.v==="learn"){
    const s=cur();
    if(m.from===s.best.slice(0,2)&&s.acc.includes(m.to)){win(s.why+" ✓")}
    else{
      g.undo();S.last=null;S.ex="";S.bad=true;
      S.msg=m.from!==s.best.slice(0,2)?"That’s a legal move, but not with the piece we’re practising. No problem — the position was reset, try again!":"That’s legal, but it isn’t the move this exercise asks for. I put the piece back — read the task once more or press Hint.";
      SND.err();
    }
  }else if(S.v==="puz"){
    const p=PZ[S.pi],ok=p.sol?f+t===p.sol:m.san.endsWith("#");
    if(ok){
      S.msg=(p.why||`${m.san} is checkmate: the king is attacked and has no escape, capture or block.`)+" ✓";
      S.solved=true;if(!S.tried)pz(true);SND.ok();
    }else{
      g.undo();S.last=null;S.ex="";S.bad=true;
      S.msg=`${m.san} isn’t it. Position reset — try another idea (hints are unlimited).`;
      SND.err();if(!S.tried){S.tried=true;pz(false)}
    }
  }else if(S.v==="play"){
    if(!endCheck())ai();
  }
  if(g.history().length===L){snd(sk);S.anim={m};clr()}
  else S.shake=f;
  render();
}

function win(text){
  S.solved=true;S.msg=text;
  P.done[S.li+"-"+S.si]=1;save();
  if(S.si===LS[S.li].s.length-1&&LS[S.li].s.every((_,i)=>P.done[S.li+"-"+i]))S.msg+=" 🎉 Lesson complete!";
  SND.ok();
}
function pz(ok){
  const p=PZ[S.pi],z=P.pz;if(ok&&S.tried)return;
  z.a++;z.cat[p.c]=z.cat[p.c]||{a:0,s:0};z.cat[p.c].a++;
  if(ok&&!S.tried){z.s++;z.cat[p.c].s++;z.st++;z.r+=12;z.ok[S.pi]=1}
  else{z.st=0;z.r=Math.max(400,z.r-8)}
  S.tried=true;save();
}
function endCheck(){
  const g=S.g;let r="",res=null;
  if(g.in_checkmate()){const wn=g.turn()==="w"?"b":"w";r="Checkmate — "+(wn==="w"?"White":"Black")+" wins";res=wn===S.col?"w":"l"}
  else if(g.in_stalemate()){r="Stalemate — draw";res="d"}
  else if(g.in_threefold_repetition()){r="Draw by repetition";res="d"}
  else if(g.insufficient_material()){r="Draw — insufficient material";res="d"}
  else if(g.in_draw()){r="Draw — 50-move rule";res="d"}
  if(r){S.over=r;P.g[res]++;save()}
  return !!r;
}
function undo(){
  if(S.busy)cancelAI();
  S.pp=null;const g=S.g;
  let n=S.v==="play"?(g.turn()===S.col?2:1):1;
  if(S.v==="play"&&S.over)S.over="";
  while(n--&&g.history().length){const m=g.undo();S.redo.push(m);S.anim={m,rev:true};clr()}
  S.solved=false;S.sel=null;S.legal=[];S.hint=null;
  const h=g.history({verbose:true}).pop();
  S.last=h?[h.from,h.to]:null;SND.click();render();
}
function redo(){
  const g=S.g,o=S.redo.pop();if(!o)return;
  const m=g.move({from:o.from,to:o.to,promotion:o.promotion||"q"});
  S.last=[m.from,m.to];
  if(S.v==="learn"||S.v==="puz")S.solved=true;
  snd(kind(m,g));S.anim={m};clr();render();
}
function hint(){
  SND.click();
  if(S.v==="play"){
    const o=pickT(S.g,LV[2],350);if(!o)return;
    S.hint=[o.from,o.to];
    S.hm=`Suggested: ${o.san} (${N[o.piece]} to ${o.to}), found by a 2-move-deep search.`;
    S.h=3;return render();
  }
  let b,idea,why;
  if(S.v==="learn"){const s=cur();b=[s.best.slice(0,2),s.best.slice(2)];idea=s.idea;why=s.why}
  else{
    const p=PZ[S.pi];
    if(p.sol){b=[p.sol.slice(0,2),p.sol.slice(2)];idea="Look for a double attack on two valuable pieces.";why=p.why}
    else{const m=mateMove(p.fen);b=[m.from,m.to];idea="Start with checks. Which check leaves the king no flight squares?";why=`${m.san} is checkmate.`}
  }
  S.h=Math.min(4,S.h+1);
  S.hm=["","💡 "+idea,"Look at the highlighted piece — it’s the one to move.","The highlighted squares show the move.","Full explanation: "+why][S.h];
  S.hint=S.h===2?[b[0]]:S.h>=3?b:null;
  render();
}

/* ---------- View & Controls ---------- */
function board(){
  const g=S.g;let ck=null;
  if(g.in_check()){g.board().forEach((r,i)=>r.forEach((x,j)=>{if(x&&x.type==="k"&&x.color===g.turn())ck="abcdefgh"[j]+(8-i)}))}
  let h="";
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const rr=S.flip?7-r:r,cc=S.flip?7-c:c,sq="abcdefgh"[cc]+(8-rr),p=g.get(sq);
    let k=(rr+cc)%2?"d":"l";
    if(P.fx.hl&&S.last&&S.last.includes(sq))k+=S.anim?" last lf":" last";
    if(P.fx.hl&&S.sel===sq)k+=" sel";
    if(sq===ck)k+=" chk";
    if(S.hint&&S.hint.includes(sq))k+=S.hint[0]===sq?" h1":" h2";
    const isMv=S.legal.includes(sq);
    if(isMv)k+=p?" cap":" mv";
    const rk=c===0?(8-rr):"",fl=r===7?"abcdefgh"[cc]:"";
    h+=`<div class="sq ${k}" data-sq="${sq}"${rk?` data-r="${rk}"`:""}${fl?` data-f="${fl}"`:""}>${isMv?`<span class="ind" aria-hidden="true"></span>`:""}</div>`;
  }
  return h;
}
const T=(a,t,x="")=>`<button data-a="${a}" ${x}>${t}</button>`;
function pk(){
  const p=S.pp,[x,y]=PX(p.t),top=y===0;
  return `<div class="pkbg" data-a="pcancel"></div><div class="pkc" style="left:${x*12.5}%;${top?"top:0":"bottom:0"};flex-direction:${top?"column":"column-reverse"}">${["q","r","b","n"].map(k=>`<button data-a="pro" data-p="${k}" class="pkb" title="${N[k]}" aria-label="${N[k]}">${pieceSvg(k,p.c)}</button>`).join("")}</div>`;
}
function drawCtl(){
  let h=T("dm",`${IC.draw}<span>Draw${S.dm?" ON":""}</span>`,S.dm?`class="on"`:"");
  if(S.dm)h+=["green","red","blue","yellow"].map(k=>`<button data-a="dc" data-c="${k}" class="sw" aria-label="Draw ${k}" style="background:${DC[k]};${S.dc===k?"outline:2.5px solid var(--tx);outline-offset:2px":""}"></button>`).join("");
  if(S.dr.a.length||Object.keys(S.dr.h).length)h+=T("cd","Clear");
  return h;
}
function settings(){
  const f=P.fx,B=(k,l)=>`<button data-a="set" data-k="${k}" class="${f[k]?"on":""}">${l}</button>`;
  return `<div class="pnl"><h3>Board &amp; app settings</h3><div class="row">${B("anim","Animations")}${B("cap","Capture effects")}${B("hl","Highlights")}${B("arr","Arrows")}${B("cl","Clear drawings")}${B("rm","Reduced motion")}<button data-a="set" data-k="snd" class="${P.mute?"":"on"}">Sound</button></div><div class="mu" style="margin-top:12px">Sound volume</div><div class="vol-wrap"><input type="range" min="0" max="1" step=".05" value="${P.vol}" data-a="vol" aria-label="Volume"><span id="volv" class="vol-val">${Math.round(P.vol*100)}%</span></div><div class="mu" style="margin-top:12px">Animation speed</div><div class="row">${["Slow","Normal","Fast"].map((n,i)=>`<button data-a="set" data-k="spd" data-v="${i}" class="${f.spd===i?"on":""}">${n}</button>`).join("")}</div><div class="mu" style="margin-top:12px">Theme</div><div class="row">${[["auto","System"],["dark","Dark"],["light","Light"]].map(([v,n])=>`<button data-a="theme" data-v="${v}" class="${P.theme===v?"on":""}">${n}</button>`).join("")}</div><p class="mu" style="margin:12px 0 0">Tap or drag pieces to move. In Draw mode, tap a square to highlight or drag between squares for arrows.</p></div>`;
}
function togg(k,v){if(k==="spd")P.fx.spd=+v;else if(k==="snd")P.mute=!P.mute;else P.fx[k]=!P.fx[k];save();render()}

const TABS=[
  ["home","Dashboard",IC.home],
  ["learn","Learn",IC.learn],
  ["puz","Puzzles",IC.puz],
  ["play","Play AI",IC.play],
  ["free","Sandbox",IC.free]
];

function render(){
  $("#nav").innerHTML=
    `<span class="brand"><span class="brand-ic">${IC.knight}</span><span>Rookie</span></span>`+
    `<div class="nav-tabs">${TABS.map(([v,t,ic])=>`<button data-a="nav" data-v="${v}" class="${S.v===v?"on":""}">${ic}<span>${t}</span></button>`).join("")}</div>`+
    `<div class="nav-right">`+
      `<button data-a="beg" class="mode-pill ${P.beg?"on":""}" aria-label="Toggle coaching detail">${P.beg?"Beginner":"Advanced"}</button>`+
      `<button data-a="mute" class="icon-btn ${P.mute?"":"on"}" aria-label="${P.mute?"Unmute sound":"Mute sound"}" title="${P.mute?"Sound off":"Sound on"}">${P.mute?IC.volOff:IC.volOn}</button>`+
      `<button data-a="so" class="icon-btn ${S.so?"on":""}" aria-label="Settings" title="Settings">${IC.gear}</button>`+
    `</div>`;

  $("#tabbar").innerHTML=TABS.map(([v,t,ic])=>`<button data-a="nav" data-v="${v}" class="tab-btn ${S.v===v?"on":""}" aria-label="${t}">${ic}<span>${t}</span></button>`).join("");

  $("#bd").innerHTML=board();
  const g=S.g,mv=g.history();
  let c=T("flip",`${IC.flip}<span>Flip</span>`);
  let bc=1;
  if(S.v!=="home"){
    c+=T("undo",`${IC.undo}<span>Undo</span>`,mv.length?"":"disabled")+
       T("redo",`${IC.redo}<span>Redo</span>`,S.redo.length?"":"disabled")+
       T("hint",`${IC.hint}<span>Hint${S.h?` ${S.h}/4`:""}</span>`);
    bc+=3;
  }
  if(S.v==="learn"||S.v==="puz"){c+=T("restart",`${IC.restart}<span>Restart</span>`);bc++}
  c+=drawCtl();
  const bctl=$("#bctl");
  bctl.classList.toggle("few",bc<=2&&!S.dm);
  bctl.innerHTML=c;

  const msg=S.msg?`<div class="msg ${S.bad?"bad":""}">${S.msg}</div>`:"";
  const hm=S.hm&&S.h?`<div class="msg hint">${S.hm}</div>`:"";
  const ex=S.ex?`<div class="pnl"><h3>What just happened?</h3><div>${S.ex}</div></div>`:"";
  const hist=mv.length?`<div class="pnl"><h3>Moves</h3><div class="mu">${mv.map((m,i)=>(i%2?"":`${i/2+1}. `)+m).join(" ")}</div></div>`:"";
  let s="";

  if(S.v==="home"){
    const tot=LS.reduce((a,l)=>a+l.s.length,0),dn=Object.keys(P.done).length,z=P.pz;
    const nx=LS.findIndex((l,i)=>!l.s.every((_,j)=>P.done[i+"-"+j]));
    const weak=Object.entries(z.cat).filter(([,v])=>v.a).sort((a,b)=>a[1].s/a[1].a-b[1].s/b[1].a)[0];
    s=`<div class="pnl"><h3>Your progress</h3><div class="bar"><i style="width:${tot?dn/tot*100:0}%"></i></div><p class="mu" style="margin:8px 0 0">${dn} of ${tot} lesson steps completed</p>
      <div class="stats-grid"><div class="stat"><b>${z.r}</b>Puzzle rating</div><div class="stat"><b>${z.a?Math.round(z.s/z.a*100):0}%</b>Accuracy</div><div class="stat"><b>${z.st}</b>Streak</div><div class="stat"><b>${P.g.w}/${P.g.d}/${P.g.l}</b>W/D/L vs AI</div></div></div>
      <div class="pnl"><h3>Recommended next</h3><div style="font-size:14.5px">${nx<0?"All piece lessons done! Try puzzles or a game against the AI.":`Continue with the <b>${LS[nx].t}</b> lesson.`}</div>${weak&&weak[1].s<weak[1].a?`<div class="mu" style="margin-top:4px">Weakest puzzle category: <b>${weak[0]}</b>.</div>`:""}<div class="row">${T("nav","Start learning",'data-v="learn" class="pri"')}${T("nav","Puzzles",'data-v="puz"')}${T("nav","Play AI",'data-v="play"')}</div></div>
      <div class="pnl mu">New to chess? Start with <b>Learn → Pawn</b>. Tap or drag a piece to see its legal moves (dots), make a move, and use <b>Hint</b> up to 4 times for progressively clearer help. Progress is saved locally on this device.</div>`;
  }else if(S.v==="learn"){
    s=`<div class="pnl"><h3>${LS[S.li].t} lesson — step ${S.si+1}/${LS[S.li].s.length}</h3>${msg}${hm}<div class="row">${T("next","Next step →",S.solved?`class="pri"`:"disabled")}</div></div>${ex}<div class="pnl"><h3>Lessons</h3>${LS.map((l,i)=>`<button class="li ${l.s.every((_,j)=>P.done[i+"-"+j])?"dn":""} ${i===S.li?"on":""}" data-a="lesson" data-i="${i}"><span>${l.t}</span></button>`).join("")}<p class="mu" style="margin:6px 0 0">Openings, endgames, tactics &amp; strategy lessons are not built yet.</p></div>`;
  }else if(S.v==="puz"){
    const p=PZ[S.pi];
    s=`<div class="pnl"><h3>Puzzle ${S.pi+1}/${PZ.length} · ${p.c} ${P.pz.ok[S.pi]?"✓":""}</h3><div class="mu">${g.turn()==="w"?"White":"Black"} to move</div>${msg}${hm}<div class="row">${T("ppz","← Previous",S.pi?"":"disabled")}${T("npz","Next puzzle →",S.solved?`class="pri"`:"")}</div></div>${ex}<div class="pnl mu">Rating ${P.pz.r} · solved ${P.pz.s}/${P.pz.a} attempted · streak ${P.pz.st}. ${PZ.length} verified puzzles (mate-in-1 and a fork).</div>`;
  }else if(S.v==="play"){
    s=`<div class="pnl"><h3>Play vs AI</h3>${S.over?`<div class="msg"><b>${S.over}</b></div>`:`<div class="mu">${S.busy?"Thinking…":g.turn()===S.col?"Your move":"Opponent’s turn"}${g.in_check()?" · CHECK":""}</div>`}${hm}${S.busy?`<div id="th" class="mu" style="margin-top:4px">${thTxt()}</div>`:""}<div class="row">${LV.map((l,i)=>`<button class="${S.lvl===i?"on":""}" data-a="lvl" data-i="${i}">${l.n}</button>`).join("")}</div><div class="row">${T("new","New as White",'data-c="w" class="pri"')}${T("new","as Black",'data-c="b"')}${T("new","Random",'data-c="r"')}${T("resign","Resign",S.over||!mv.length?"disabled":"")}</div><p class="mu" style="margin:10px 0 0">${SF.ok?"Engine: Stockfish. Level sets skill, depth and think time.":"Engine: built-in search (offline fallback active)."}</p></div>${ex}${hist}<div class="pnl"><h3>Export ${S.copied?`<span class="mu">(${S.copied})</span>`:""}</h3><div class="row">${T("cpfen","Copy FEN")}${T("cppgn","Copy PGN",mv.length?"":"disabled")}</div><div class="mu" style="margin-top:10px">FEN</div><code>${g.fen()}</code><div class="mu" style="margin-top:10px">PGN</div><code>${g.pgn()||"—"}</code></div>`;
  }else{
    s=`<div class="pnl"><h3>Sandbox</h3><div class="mu">Move any side freely (legal moves only), undo/redo, and copy the FEN.</div><div class="row">${T("reset","Reset board",'class="pri"')}${T("cpfen","Copy FEN")}</div>${S.copied?`<div class="mu" style="margin-top:8px">${S.copied}</div>`:""}${ex}</div>${hist}<div class="pnl"><div class="mu">FEN</div><code>${g.fen()}</code></div>`;
  }
  $("#side").innerHTML=(S.so?settings()+s:s);
  document.body.classList.toggle("rm",!!P.fx.rm);
  ov();fx();
  $("#pk").innerHTML=S.pp?pk():"";
}

function copyText(txt,label){
  try{
    if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt);
    else{const t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}
    S.copied=label+" copied";render();
    setTimeout(()=>{if(S.copied===label+" copied"){S.copied="";render()}},1500);
  }catch(e){}
}

/* ---------- Events: Clicks, Unified Pointer Drag-and-Drop, Right-Drag, Keyboard ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,d=b.dataset;if(a==="vol")return;
  SND.click();
  if(a==="nav")go(d.v);
  else if(a==="flip"){S.flip=!S.flip;render()}
  else if(a==="undo")undo();
  else if(a==="redo")redo();
  else if(a==="hint")hint();
  else if(a==="mute"){P.mute=!P.mute;save();render()}
  else if(a==="beg"){P.beg=!P.beg;save();render()}
  else if(a==="restart"){S.v==="learn"?startStep():startPz();render()}
  else if(a==="lesson"){S.li=+d.i;S.si=0;startStep();render()}
  else if(a==="next"){if(S.si<LS[S.li].s.length-1)S.si++;else{S.li=(S.li+1)%LS.length;S.si=0}startStep();render()}
  else if(a==="npz"){S.pi=(S.pi+1)%PZ.length;startPz();render()}
  else if(a==="ppz"){S.pi=Math.max(0,S.pi-1);startPz();render()}
  else if(a==="lvl"){S.lvl=+d.i;render()}
  else if(a==="new"){let c=d.c;if(c==="r")c=Math.random()<.5?"w":"b";S.col=c;load(new Chess().fen());S.flip=c==="b";render();if(c==="b")ai()}
  else if(a==="resign"){cancelAI();S.over="You resigned";P.g.l++;save();render()}
  else if(a==="reset"){load(new Chess().fen());render()}
  else if(a==="pro"){const p=S.pp;S.pp=null;if(p)doMove(p.f,p.t,d.p)}
  else if(a==="pcancel"){S.pp=null;render()}
  else if(a==="so"){S.so=!S.so;if(S.so)$("#side").scrollTop=0;render()}
  else if(a==="dm"){S.dm=!S.dm;S.ds=null;render()}
  else if(a==="dc"){S.dc=d.c;S.ds=null;render()}
  else if(a==="cd"){S.dr={a:[],h:{}};S.ds=null;render()}
  else if(a==="set")togg(d.k,d.v);
  else if(a==="theme"){P.theme=d.v;save();applyTheme();render()}
  else if(a==="cpfen")copyText(S.g.fen(),"FEN");
  else if(a==="cppgn")copyText(S.g.pgn(),"PGN");
});

const bd=$("#bd");
bd.addEventListener("contextmenu",e=>e.preventDefault());
let drag=null,rc=null;

bd.addEventListener("pointerdown",e=>{
  if(e.button===2){
    e.preventDefault();
    rc={s:sqAt(e.clientX,e.clientY),c:e.shiftKey?"red":e.ctrlKey?"yellow":e.altKey?"blue":"green"};
    return;
  }
  if(e.button!==0||S.pp||performance.now()<S.until)return;
  const sq=sqAt(e.clientX,e.clientY);if(!sq)return;
  if(S.dm){
    drag={mode:"draw",sq,x:e.clientX,y:e.clientY,moved:false};
    bd.setPointerCapture?.(e.pointerId);
    return;
  }
  const p=S.g.get(sq);
  const canDrag=p&&p.color===S.g.turn()&&(S.v!=="play"||p.color===S.col)&&(sideOK()||S.v==="free");
  drag={mode:"piece",sq,x:e.clientX,y:e.clientY,moved:false,canDrag,id:e.pointerId};
  bd.setPointerCapture?.(e.pointerId);
});

document.addEventListener("pointermove",e=>{
  if(rc){const t=sqAt(e.clientX,e.clientY);S.pv=rc.s&&t?[rc.s,t,rc.c]:null;ov();return}
  if(!drag)return;
  const dist=Math.hypot(e.clientX-drag.x,e.clientY-drag.y);
  if(drag.mode==="draw"){
    if(dist>8)drag.moved=true;
    if(drag.moved){const t=sqAt(e.clientX,e.clientY);S.pv=t?[drag.sq,t,S.dc]:null;ov()}
    return;
  }
  if(!drag.canDrag)return;
  if(!drag.moved&&dist>7){
    drag.moved=true;
    S.sel=drag.sq;S.legal=S.g.moves({square:drag.sq,verbose:true}).map(m=>m.to);
    S.hint=null;S.dr={a:[],h:{}};
    $("#bd").innerHTML=board();
    const el=PE[drag.sq];if(el)el.classList.add("lift");
  }
  if(drag.moved){
    const el=PE[drag.sq],r=$("#bd").getBoundingClientRect();
    if(el&&r.width){
      const dx=e.clientX-r.left-r.width/16,dy=e.clientY-r.top-r.height/16;
      el.style.transform=`translate(${dx}px,${dy}px) scale(1.18)`;
    }
  }
});

document.addEventListener("pointerup",e=>{
  if(e.button===2&&rc){
    const t=sqAt(e.clientX,e.clientY);if(rc.s&&t)draw(rc.s,t,rc.c);
    rc=null;S.pv=null;ov();return;
  }
  if(!drag)return;
  const d=drag;drag=null;S.pv=null;
  const target=sqAt(e.clientX,e.clientY);
  if(d.mode==="draw"){
    if(d.moved&&target){S.ds=null;draw(d.sq,target,S.dc)}
    else drawTap(d.sq);
    return;
  }
  if(d.moved){
    if(target&&target!==d.sq&&S.legal.includes(target)){
      needPromo(d.sq,target)?askPromo(d.sq,target):doMove(d.sq,target);
    }else{
      if(target&&target!==d.sq&&S.g.get(target)&&S.v!=="free"){
        S.msg="That piece can’t move there — look for the dots showing legal squares.";
        S.bad=true;S.shake=d.sq;SND.err();
      }
      render();
    }
  }else{
    clickSq(d.sq);
  }
});

document.addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==="Escape"){
    if(S.pp){S.pp=null;render()}
    else{S.dr={a:[],h:{}};S.ds=null;ov()}
  }else if(e.key==="f"||e.key==="F"){S.flip=!S.flip;render()}
  else if(e.key==="ArrowLeft")undo();
  else if(e.key==="ArrowRight")redo();
});
document.addEventListener("input",e=>{
  if(e.target.dataset.a==="vol"){
    P.vol=+e.target.value;save();
    const vv=$("#volv");if(vv)vv.textContent=Math.round(P.vol*100)+"%";
    tone(440,.05);
  }
});

SFinit();
render();
})();
</script>
</body>
</html>
